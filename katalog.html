<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Layanan Surabaya — Mahyra Relaksia</title>
<meta name="description" content="Katalog layanan pijat panggilan Mahyra Relaksia cabang Surabaya. Full body massage, kombinasi totok wajah, head massage, dan foot reflexy.">
<meta property="og:title" content="Katalog Layanan Surabaya — Mahyra Relaksia">
<meta property="og:description" content="Home service massage seluruh area Surabaya. Harga sudah termasuk transport, oil, dan perlengkapan.">
<meta property="og:image" content="https://mahyrarelaksia.com/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   Yang perlu diganti: nomor WhatsApp (cari WA_NOMOR di bawah)
   dan foto (unggah ke folder /foto, daftar namanya ada di bawah)
   ══════════════════════════════════════════════════════════ */
:root{
  --emas:#E4C179;
  --emas-terang:#F5E2B0;
  --emas-tua:#B8873C;
  --kayu:#33210F;      /* cokelat kartu */
  --gelap:#150C05;     /* dasar halaman */
  --krem:#F0E6D4;
  --krem-2:#C6B394;
  --page-w:360px;
  --page-h:504px;
  --flip:.9s;
  --ease:cubic-bezier(.36,.66,.24,1);
}
@media (prefers-reduced-motion:reduce){:root{--flip:.001s}}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  margin:0;color:var(--krem);font-family:Jost,system-ui,-apple-system,sans-serif;font-weight:300;
  display:flex;flex-direction:column;height:100dvh;
  background:radial-gradient(130% 90% at 50% -10%,#4A3218 0%,#120A04 60%),#0C0703;
}

/* ── kepala ── */
.bar{flex:0 0 auto;display:flex;justify-content:center;padding:.9rem .8rem .1rem;z-index:2}
.bar .mark{text-align:center;line-height:1.2}
.bar .mark b{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:1.3rem;letter-spacing:.14em;color:var(--emas-terang);display:block}
.bar .mark i{font-style:normal;font-size:.58rem;letter-spacing:.34em;color:var(--emas-tua);display:block;margin-top:.28rem}

/* ── panggung & lembaran ── */
.stage{flex:1 1 auto;display:grid;place-items:center;min-height:0;perspective:2600px;position:relative;z-index:1}
.book{position:relative;width:var(--book-w);height:var(--page-h);transform-style:preserve-3d;touch-action:none;transition:transform var(--flip) var(--ease)}
.book.at-first{transform:translateX(calc(var(--page-w)/2))}
.book.at-last{transform:translateX(calc(var(--page-w)/-2))}
.book::after{content:"";position:absolute;left:4%;right:4%;bottom:-16px;height:30px;z-index:0;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.7),transparent 72%);filter:blur(4px)}
.leaf{position:absolute;top:0;height:100%;transform-style:preserve-3d;transform-origin:left center;will-change:transform;transition:transform var(--flip) var(--ease)}
.spread .leaf{left:50%;width:50%}
.solo .leaf{left:0;width:100%}
.leaf.flipped{transform:rotateY(-180deg)}
.leaf.dragging{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--gelap)}
.face.back{transform:rotateY(180deg)}
.face.front{box-shadow:inset 18px 0 30px -22px #000,3px 3px 20px rgba(0,0,0,.55)}
.face.back{box-shadow:inset -18px 0 30px -22px #000,-3px 3px 20px rgba(0,0,0,.55)}
.verso{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#33210F,#120A04 70%)}
.verso img{width:32%;opacity:.12}

/* ── halaman ── */
.page{
  width:100%;height:100%;position:relative;color:var(--krem);
  font-size:calc(var(--page-w)/26);line-height:1.5;
  padding:1.5em 1.3em 1.1em;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 0%,#3B2712 0%,#150C05 62%);
}
.page::before{content:"";position:absolute;inset:.6em;border:1px solid rgba(228,193,121,.28);pointer-events:none}
.runner{font-size:.54em;letter-spacing:.3em;color:var(--emas-tua);text-align:center;margin-bottom:.5em}
.judul{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:1.75em;line-height:1.1;
  text-align:center;color:var(--emas-terang);margin:0 0 .3em;
}
.page p{margin:0 0 .6em;font-size:.74em;color:var(--krem-2);font-weight:300}
.folio{margin-top:auto;padding-top:.7em;display:flex;justify-content:space-between;align-items:center;font-size:.52em;letter-spacing:.2em;color:var(--emas-tua)}
.folio b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:1.6em;letter-spacing:0}

/* ── kartu layanan ── */
.kartu{border:1px solid rgba(228,193,121,.35);background:rgba(0,0,0,.28);display:flex;flex-direction:column;flex:1;min-height:0}
.kepala{display:flex;align-items:stretch}
.kepala .nama{
  flex:1;background:linear-gradient(100deg,var(--emas-terang),var(--emas) 55%,var(--emas-tua));
  color:#2A1B0A;font-family:"Cormorant Garamond",serif;font-size:1.12em;letter-spacing:.02em;
  padding:.34em .7em;text-align:center;
}
.kepala .tag{
  flex:0 0 auto;background:#EDE7DC;color:#4A3418;font-size:.66em;letter-spacing:.06em;
  padding:.55em .8em;display:grid;place-items:center;
}
.badan{display:flex;gap:.55em;padding:.6em;flex:1;min-height:0}
.badan.balik{flex-direction:row-reverse}
.badan .ph{flex:0 0 41%;align-self:stretch}
.isi-kartu{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3em}
.blok h4{margin:0 0 .18em;font-size:.66em;letter-spacing:.06em;color:var(--emas);font-weight:400}
.blok ul{margin:0;padding-left:1em;font-size:.66em;color:var(--krem);line-height:1.5}
.blok ul li{margin-bottom:.08em}
.blok ul li b{font-weight:500;color:var(--emas-terang)}
.durasi{display:flex;align-items:center;gap:.4em;font-size:.66em;color:var(--krem-2);margin-top:auto;padding-top:.25em}
.durasi svg{width:1.6em;height:1.6em;flex:0 0 auto;stroke:var(--emas);fill:none;stroke-width:1.4}
.durasi b{display:block;color:var(--emas-terang);font-weight:400;font-size:1.05em}

/* ── kotak harga ── */
.harga{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(228,193,121,.5)}
.harga.dua{grid-template-columns:repeat(2,1fr)}
.harga.satu{grid-template-columns:1fr}
.harga div{background:linear-gradient(180deg,#F6E5B6,#D8B369);color:#2A1B0A;text-align:center;padding:.42em .2em .5em}
.harga span{display:block;font-size:.6em;letter-spacing:.08em;color:#6A4E1E}
.harga b{display:block;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:1.15em;line-height:1.2}

/* ── foto ── */
.ph{position:relative;overflow:hidden;border:1px solid rgba(228,193,121,.3);background:linear-gradient(150deg,#4A3218,#1B0F06 75%)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.kosong::after{
  content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:rgba(228,193,121,.6);font-size:.58em;letter-spacing:.12em;padding:.5em;
}
.band{height:26%;margin-bottom:.6em}

/* ── daftar termasuk ── */
.termasuk{border:1px solid rgba(228,193,121,.4);padding:.7em .8em;margin-bottom:.7em;background:rgba(0,0,0,.25)}
.termasuk .t{font-family:"Cormorant Garamond",serif;font-size:1.05em;color:var(--emas-terang);text-align:center;margin-bottom:.35em}
.termasuk li{list-style:none;font-size:.68em;padding:.2em 0 .2em 1.4em;position:relative;color:var(--krem)}
.termasuk li::before{content:"✓";position:absolute;left:0;color:var(--emas);font-size:.9em}
.termasuk ul{margin:0;padding:0}

/* ── daftar isi ── */
.toc{list-style:none;margin:.1em 0 0;padding:0}
.toc li{display:flex;align-items:baseline;gap:.4em;padding:.34em 0;font-size:.72em;border-bottom:1px solid rgba(228,193,121,.14)}
.toc .dots{flex:1;border-bottom:1px dotted rgba(228,193,121,.3);transform:translateY(-.3em)}
.toc b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:1.25em;color:var(--emas)}

/* ── langkah ── */
.steps{list-style:none;margin:.1em 0 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:.4em 0 .4em 2.1em;counter-increment:s;font-size:.7em;border-bottom:1px solid rgba(228,193,121,.14);color:var(--krem-2)}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:.42em;font-family:"Cormorant Garamond",serif;font-size:1.2em;color:var(--emas)}
.steps b{display:block;font-weight:400;font-size:1.08em;color:var(--krem);margin-bottom:.02em}

/* ── terapis ── */
.who{display:flex;gap:.6em;padding:.42em 0;border-bottom:1px solid rgba(228,193,121,.14);align-items:center}
.who .ph{width:3em;height:3em;border-radius:50%;flex:0 0 auto}
.who .ph.kosong::after{font-size:.46em;letter-spacing:.04em}
.who .txt{font-size:.66em;color:var(--krem-2);line-height:1.45}
.who .txt b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.2em;color:var(--krem);font-weight:400}
.who .txt i{font-style:normal;color:var(--emas)}

.areas{display:flex;flex-wrap:wrap;gap:.26em;margin:.2em 0 .6em;justify-content:center}
.areas span{font-size:.58em;letter-spacing:.1em;border:1px solid rgba(228,193,121,.45);border-radius:2em;padding:.28em .75em;color:var(--krem-2)}
.qa{font-size:.68em;margin-bottom:.45em;line-height:1.5;color:var(--krem-2)}
.qa b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.15em;color:var(--emas-terang);font-weight:400}

.cta{display:inline-block;background:linear-gradient(180deg,#F6E5B6,#D8B369);color:#2A1B0A;text-decoration:none;font-size:.66em;letter-spacing:.14em;padding:.7em 1.3em;font-weight:500}
.cta:hover{filter:brightness(1.07)}
.tengah{text-align:center}

/* ── sampul ── */
.page.sampul,.page.penutup{padding:0}
.sampul .ph,.penutup .ph{position:absolute;inset:0;border:0}
.sampul .isi,.penutup .isi{position:relative;z-index:2;height:100%;padding:2em 1.6em 1.4em;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;background:linear-gradient(180deg,rgba(14,8,3,.88) 0%,rgba(14,8,3,.55) 42%,rgba(14,8,3,.94) 100%)}
.sampul .logo{width:4.4em}
.penutup .logo{width:3.4em;margin-bottom:.5em}
.sampul h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:2.6em;line-height:1;margin:0;color:var(--emas-terang)}
.sampul h1 em{font-style:italic;display:block;color:var(--emas)}
.sampul .rule{width:3.2em;height:1px;background:var(--emas);margin:.8em auto}
.sampul .sub{font-size:.66em;letter-spacing:.28em;color:var(--krem-2)}
.sampul .kaki,.penutup .kaki{font-size:.56em;letter-spacing:.22em;color:rgba(228,193,121,.8);line-height:2}
.penutup .judul{font-size:1.55em}

/* ── kontrol & logo ── */
.ctrl{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:1rem .8rem .3rem;z-index:2}
.ctrl button,.ctrl select{font:inherit;font-size:.72rem;letter-spacing:.12em;color:var(--emas-terang);background:rgba(228,193,121,.07);border:1px solid rgba(228,193,121,.4);border-radius:2em;padding:.55em 1.1em;cursor:pointer}
.ctrl button:hover:not(:disabled),.ctrl select:hover{background:rgba(228,193,121,.18)}
.ctrl button:disabled{opacity:.28;cursor:default}
.ctrl .count{font-size:.66rem;letter-spacing:.16em;color:var(--emas-tua);min-width:8em;text-align:center}
.ctrl select{max-width:10rem}
:focus-visible{outline:1px solid var(--emas);outline-offset:3px}
.kaki-logo{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.45rem 0 max(.7rem,env(safe-area-inset-bottom));z-index:2}
.kaki-logo img{height:34px;width:auto;opacity:.92}
.kaki-logo span{font-size:.52rem;letter-spacing:.3em;color:rgba(228,193,121,.65)}

@media (max-width:860px){
  .bar{padding:.65rem .6rem .05rem}
  .bar .mark b{font-size:1.08rem}
  .ctrl{gap:.35rem;padding:.75rem .5rem .15rem}
  .ctrl button,.ctrl select{font-size:.62rem;padding:.5em .8em}
  .ctrl .count{min-width:6em;font-size:.58rem}
  .ctrl select{max-width:6.5rem}
  .kaki-logo img{height:26px}
}
</style>
</head>
<body>

<header class="bar">
  <div class="mark"><b>MAHYRA RELAKSIA</b><i>HOME SERVICE MASSAGE · SURABAYA</i></div>
</header>

<main class="stage" id="stage"></main>

<nav class="ctrl">
  <button id="prev" aria-label="Halaman sebelumnya">‹</button>
  <span class="count" id="count"></span>
  <button id="next" aria-label="Halaman berikutnya">›</button>
  <select id="jump" aria-label="Lompat ke halaman"></select>
</nav>

<footer class="kaki-logo">
  <img src="logo.png" alt="Mahyra Relaksia" onerror="this.style.display='none'">
  <span>SURABAYA</span>
</footer>

<script>
/* ══════════════════════════════════════════════════════════
   1. NOMOR WHATSAPP — ganti dengan nomor asli (awalan 62)
   ══════════════════════════════════════════════════════════ */
const WA_NOMOR = "6281234567890";

/* ══════════════════════════════════════════════════════════
   2. FOTO — unggah ke folder /foto dengan nama persis ini:
      sampul.jpg  fullbody.jpg  totok.jpg  head.jpg
      reflexy.jpg paket.jpg     couple.jpg oil.jpg
      dewi.jpg    ayu.jpg       bagas.jpg  penutup.jpg
      Ukuran saran: 1200×1600 px (tegak), 800×800 px (terapis).
   ══════════════════════════════════════════════════════════ */
const foto = (f, cls) =>
  `<div class="ph ${cls||''}" data-label="foto/${f}"><img src="foto/${f}" alt="" onerror="this.parentNode.classList.add('kosong');this.remove()"></div>`;

const wa = t => "https://wa.me/" + WA_NOMOR + "?text=" + encodeURIComponent(t);
const folio = (n,s) => `<div class="folio"><span>${s}</span><b>${n}</b></div>`;
const jam = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
const durasi = t => `<div class="durasi">${jam}<span>Durasi<b>${t}</b></span></div>`;

/* kartu layanan — dipakai berulang */
const kartu = ({nama, tag, gambar, balik, termasuk, manfaat, fokus, waktu, harga}) => `
  <div class="kartu">
    <div class="kepala">
      <div class="nama">${nama}</div>
      ${tag ? `<div class="tag">${tag}</div>` : ``}
    </div>
    <div class="badan ${balik ? 'balik' : ''}">
      ${foto(gambar)}
      <div class="isi-kartu">
        <div class="blok"><h4>Treatment termasuk</h4><ul>${termasuk.map(x=>`<li>${x}</li>`).join("")}</ul></div>
        <div class="blok"><h4>Manfaat utama</h4><ul>${manfaat.map(x=>`<li>${x}</li>`).join("")}</ul></div>
        ${fokus ? `<div class="blok"><h4>Fokus pijat</h4><ul><li>${fokus}</li></ul></div>` : ``}
        ${durasi(waktu)}
      </div>
    </div>
    <div class="harga ${harga.length===1?'satu':harga.length===2?'dua':''}">
      ${harga.map(h=>`<div><span>${h[0]}</span><b>${h[1]}</b></div>`).join("")}
    </div>
  </div>`;

const PAGES = [
{ label:"Sampul", html:`
  <div class="page sampul">
    ${foto("sampul.jpg")}
    <div class="isi">
      <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'">
      <div>
        <h1>Katalog<em>Layanan</em></h1>
        <div class="rule"></div>
        <div class="sub">CABANG SURABAYA · 2026</div>
      </div>
      <div class="kaki">HOME SERVICE PREMIUM MASSAGE<br>SELURUH AREA SURABAYA</div>
    </div>
  </div>`},

{ label:"Harga sudah termasuk", html:`
  <div class="page">
    <div class="runner">HOME SERVICE PREMIUM MASSAGE</div>
    <div class="judul">Harga sudah termasuk</div>
    <div class="termasuk">
      <ul>
        <li>Transport ke seluruh area Surabaya</li>
        <li>Oil massage</li>
        <li>Perlengkapan pijat: matras, kemben, handuk bersih</li>
        <li>Aromatherapy selama sesi</li>
      </ul>
    </div>
    ${foto("oil.jpg","band")}
    <ul class="toc">
      <li>Full Body Massage <span class="dots"></span> <b>3</b></li>
      <li>Full Body &amp; Totok Wajah <span class="dots"></span> <b>4</b></li>
      <li>Full Body &amp; Head Massage <span class="dots"></span> <b>5</b></li>
      <li>Full Body &amp; Foot Reflexy <span class="dots"></span> <b>6</b></li>
      <li>Paket Tiga Perawatan <span class="dots"></span> <b>7</b></li>
      <li>Couple <span class="dots"></span> <b>8</b></li>
    </ul>
    ${folio(2,"ISI KATALOG")}
  </div>`},

{ label:"Full Body Massage", html:`
  <div class="page">
    ${kartu({
      nama:"Full Body Massage", tag:"Badan Pegal", gambar:"fullbody.jpg",
      termasuk:["Pijat tradisional seluruh badan","Tekanan disesuaikan permintaan","Oil massage &amp; aromatherapy"],
      manfaat:["Otot lebih lemas","Tidur lebih nyenyak"],
      fokus:"Punggung, bahu, kaki, tangan",
      waktu:"1 – 2 Jam",
      harga:[["1 JAM","Rp 100.000"],["1,5 JAM","Rp 130.000"],["2 JAM","Rp 180.000"]]
    })}
    ${folio(3,"FULL BODY MASSAGE")}
  </div>`},

{ label:"Full Body & Totok Wajah", html:`
  <div class="page">
    ${kartu({
      nama:"Full Body &amp; Totok Wajah", tag:"Wajah Kusam", gambar:"totok.jpg", balik:true,
      termasuk:["Full body massage","Totok wajah","Oil massage &amp; aromatherapy"],
      manfaat:["Otot wajah dan rahang lebih rileks","Wajah terasa lebih segar"],
      fokus:"Seluruh badan dan titik wajah",
      waktu:"1,5 – 2,5 Jam",
      harga:[["1,5 JAM","Rp 120.000"],["2 JAM","Rp 135.000"],["2,5 JAM","Rp 155.000"]]
    })}
    ${folio(4,"TOTOK WAJAH")}
  </div>`},

{ label:"Full Body & Head Massage", html:`
  <div class="page">
    ${kartu({
      nama:"Full Body &amp; Head Massage", tag:"Capek Kerja", gambar:"head.jpg",
      termasuk:["Full body massage","Head &amp; scalp massage","Oil massage &amp; aromatherapy"],
      manfaat:["Kepala dan bahu lebih ringan","Pikiran lebih tenang"],
      fokus:"Kepala, leher, bahu, punggung",
      waktu:"1,5 – 2,5 Jam",
      harga:[["1,5 JAM","Rp 120.000"],["2 JAM","Rp 135.000"],["2,5 JAM","Rp 155.000"]]
    })}
    ${folio(5,"HEAD MASSAGE")}
  </div>`},

{ label:"Full Body & Foot Reflexy", html:`
  <div class="page">
    ${kartu({
      nama:"Full Body &amp; Foot Reflexy", tag:"Kaki Pegal", gambar:"reflexy.jpg", balik:true,
      termasuk:["Full body massage","Refleksi telapak kaki","Oil massage &amp; aromatherapy"],
      manfaat:["Kaki lebih ringan","Membantu kualitas tidur"],
      fokus:"Seluruh badan dan titik telapak kaki",
      waktu:"1,5 – 2,5 Jam",
      harga:[["1,5 JAM","Rp 120.000"],["2 JAM","Rp 135.000"],["2,5 JAM","Rp 155.000"]]
    })}
    ${folio(6,"FOOT REFLEXY")}
  </div>`},

{ label:"Paket Tiga Perawatan", html:`
  <div class="page">
    ${kartu({
      nama:"Paket Tiga Perawatan", tag:"Paling Laris", gambar:"paket.jpg",
      termasuk:["<b>Favorit</b> badan, kepala, wajah","<b>Rileks</b> badan, wajah, kaki","<b>Puas</b> badan, kepala, kaki"],
      manfaat:["Tiga perawatan dalam satu sesi","Satu harga, tanpa tambahan"],
      waktu:"2,5 Jam",
      harga:[["FAVORIT","Rp 160.000"],["RILEKS","Rp 165.000"],["PUAS","Rp 165.000"]]
    })}
    ${folio(7,"PAKET TIGA PERAWATAN")}
  </div>`},

{ label:"Couple", html:`
  <div class="page">
    ${kartu({
      nama:"Couple Massage", tag:"Berdua", gambar:"couple.jpg", balik:true,
      termasuk:["Dua terapis datang bersamaan","Layanan boleh berbeda tiap orang","Oil massage &amp; aromatherapy"],
      manfaat:["Selesai bersamaan, tanpa antre","Cocok untuk pasangan atau ibu dan anak"],

/* ══════════════ mesin lembaran ══════════════ */
const stage = document.getElementById("stage");
const bPrev = document.getElementById("prev");
const bNext = document.getElementById("next");
const count = document.getElementById("count");
const jump  = document.getElementById("jump");
const root  = document.documentElement;

const N = PAGES.length;
let mode = null, leaves = 0, at = 0, busy = false, book = null;

PAGES.forEach((p,i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = (i+1) + ". " + p.label;
  jump.appendChild(o);
});

const wantMode = () => window.matchMedia("(min-width:861px)").matches ? "spread" : "solo";
const verso = `<div class="verso"><img src="logo.png" alt="" onerror="this.style.display='none'"></div>`;

function ukur(){
  const r = stage.getBoundingClientRect();
  const h = r.height - 18, w = r.width - 20;
  let pw = mode === "spread" ? Math.min(w/2, h/1.4) : Math.min(w, h/1.4);
  pw = Math.max(210, Math.floor(pw));
  root.style.setProperty("--page-w", pw + "px");
  root.style.setProperty("--page-h", Math.round(pw*1.4) + "px");
  root.style.setProperty("--book-w", (mode === "spread" ? pw*2 : pw) + "px");
}

function build(next){
  mode = next;
  leaves = mode === "spread" ? Math.ceil(N/2) : N;
  stage.innerHTML = "";
  book = document.createElement("div");
  book.className = "book " + mode;
  for (let i = 0; i < leaves; i++){
    const leaf = document.createElement("div");
    leaf.className = "leaf";
    const f = mode === "spread" ? (PAGES[2*i]   ? PAGES[2*i].html   : verso) : PAGES[i].html;
    const b = mode === "spread" ? (PAGES[2*i+1] ? PAGES[2*i+1].html : verso) : verso;
    leaf.innerHTML = '<div class="face front">'+f+'</div><div class="face back">'+b+'</div>';
    book.appendChild(leaf);
  }
  stage.appendChild(book);
  ukur();
  pasangGeser();
  render();
}

function render(){
  book.querySelectorAll(".leaf").forEach((leaf,i) => {
    const done = i < at;
    leaf.classList.toggle("flipped", done);
    leaf.style.zIndex = done ? (i+1) : (leaves - i);
    if (!leaf.classList.contains("dragging")) leaf.style.transform = "";
  });
  book.classList.toggle("at-first", mode === "spread" && at === 0);
  book.classList.toggle("at-last",  mode === "spread" && at === leaves);
  if (mode === "spread"){
    const kiri = at === 0 ? null : 2*at, kanan = at === leaves ? null : 2*at + 1;
    count.textContent = (kiri && kanan) ? kiri + "–" + kanan + " / " + N : (kiri || kanan) + " / " + N;
    jump.value = String(kiri ? kiri-1 : 0);
  } else {
    count.textContent = (at+1) + " / " + N;
    jump.value = String(at);
  }
  bPrev.disabled = at === 0;
  bNext.disabled = at === (mode === "spread" ? leaves : N-1);
}

function go(dir){
  if (busy) return;
  const maks = mode === "spread" ? leaves : N-1;
  const t = at + dir;
  if (t < 0 || t > maks) return;
  const leaf = book.querySelectorAll(".leaf")[dir > 0 ? at : at-1];
  at = t; busy = true;
  if (leaf) leaf.style.zIndex = 999;
  render();
  setTimeout(() => { busy = false; render(); }, 940);
}

function goTo(p){
  if (busy) return;
  at = mode === "spread" ? (p === 0 ? 0 : Math.ceil(p/2)) : p;
  render();
}

function pasangGeser(){
  let aktif = null, x0 = 0, y0 = 0, arah = 0, geser = false, lebar = 1;

  book.addEventListener("pointerdown", e => {
    if (busy || e.target.closest("a")) return;
    x0 = e.clientX; y0 = e.clientY; geser = false; aktif = null;
    lebar = book.getBoundingClientRect().width / (mode === "spread" ? 2 : 1);
    book.setPointerCapture(e.pointerId);
  });

  book.addEventListener("pointermove", e => {
    if (!x0) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!geser){
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
      geser = true;
      arah = dx < 0 ? 1 : -1;
      const maks = mode === "spread" ? leaves : N-1;
      if (at + arah < 0 || at + arah > maks){ geser = false; x0 = 0; return; }
      aktif = book.querySelectorAll(".leaf")[arah > 0 ? at : at-1];
      if (!aktif){ geser = false; x0 = 0; return; }
      aktif.classList.add("dragging");
      aktif.style.zIndex = 999;
    }
    const p = Math.min(1, Math.max(0, Math.abs(dx)/lebar));
    aktif.style.transform = "rotateY(" + (arah > 0 ? -180*p : -180*(1-p)) + "deg)";
  });

  const lepas = e => {
    if (!x0) return;
    const dx = e.clientX - x0;
    if (geser && aktif){
      const p = Math.min(1, Math.abs(dx)/lebar);
      aktif.classList.remove("dragging");
      aktif.style.transform = "";
      if (p > .3) at += arah;
      busy = true; render();
      setTimeout(() => { busy = false; render(); }, 940);
    } else if (Math.abs(dx) < 8){
      const r = book.getBoundingClientRect();
      go(e.clientX - r.left > r.width/2 ? 1 : -1);
    }
    x0 = 0; geser = false; aktif = null;
  };
  book.addEventListener("pointerup", lepas);
  book.addEventListener("pointercancel", () => {
    if (aktif){ aktif.classList.remove("dragging"); aktif.style.transform = ""; }
    x0 = 0; geser = false; aktif = null; render();
  });
}

bPrev.addEventListener("click", () => go(-1));
bNext.addEventListener("click", () => go(1));
jump.addEventListener("change", () => goTo(Number(jump.value)));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft")  go(-1);
});

build(wantMode());

let rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const w = wantMode();
    if (w === mode){ ukur(); return; }
    const hal = mode === "spread" ? (at === 0 ? 0 : 2*at - 1) : at;
    build(w);
    at = w === "spread" ? (hal === 0 ? 0 : Math.ceil(hal/2)) : hal;
    render();
  }, 180);
});
</script>
</body>
</html>
