<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Layanan 2026 — Mahyra Relaksia</title>
<meta name="description" content="Katalog layanan pijat panggilan Mahyra Relaksia untuk Malang dan Surabaya. Perawatan, paket, dan harga, dibuka seperti lembaran buku.">
<meta property="og:title" content="Katalog Layanan 2026 — Mahyra Relaksia">
<meta property="og:description" content="Perawatan, paket, dan harga pijat panggilan ke rumah di Malang & Surabaya.">
<meta property="og:image" content="https://mahyrarelaksia.com/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   Yang perlu kamu ganti ada tiga:
   1. Nomor WhatsApp  → cari WA_NOMOR di bagian JavaScript, paling bawah
   2. Foto            → unggah ke folder /foto (daftar ada di bawah)
   3. Warna           → tiga baris pertama di :root
   ══════════════════════════════════════════════════════════ */
:root{
  --malam:#0F1C2B;        /* biru malam — sampul */
  --emas:#C6A96B;         /* emas — aksen & harga */
  --gading:#F7F2E8;       /* kertas */

  --malam-2:#1B2E44;
  --emas-tua:#8A6E3A;
  --tinta:#1E1C17;
  --abu:#7A736A;
  --page-w:360px;
  --page-h:504px;
  --flip:.9s;
  --ease:cubic-bezier(.36,.66,.24,1);
}
@media (prefers-reduced-motion:reduce){:root{--flip:.001s}}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  margin:0;color:var(--gading);
  font-family:Jost,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;
  display:flex;flex-direction:column;height:100dvh;
  background:
    radial-gradient(120% 90% at 50% -10%,#20344C 0%,#0B1522 62%),
    #0B1522;
}
body::before{ /* butiran halus, biar tidak terasa datar */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(198,169,107,.14) 1px,transparent 0);
  background-size:22px 22px;
}

/* ── kepala ── */
.bar{flex:0 0 auto;display:flex;justify-content:center;padding:1rem .8rem .2rem;position:relative;z-index:2}
.bar .mark{text-align:center;line-height:1.25}
.bar .mark b{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:1.32rem;
  letter-spacing:.14em;color:#EFE6D4;display:block;
}
.bar .mark i{
  font-style:normal;font-size:.6rem;letter-spacing:.34em;color:var(--emas);
  display:block;margin-top:.3rem;
}

/* ── panggung ── */
.stage{flex:1 1 auto;display:grid;place-items:center;min-height:0;perspective:2600px;position:relative;z-index:1}
.book{
  position:relative;width:var(--book-w);height:var(--page-h);
  transform-style:preserve-3d;touch-action:none;
  transition:transform var(--flip) var(--ease);
}
.book.at-first{transform:translateX(calc(var(--page-w)/2))}
.book.at-last{transform:translateX(calc(var(--page-w)/-2))}
.book::after{
  content:"";position:absolute;left:4%;right:4%;bottom:-16px;height:30px;z-index:0;
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.6),transparent 72%);filter:blur(4px);
}
.leaf{
  position:absolute;top:0;height:100%;transform-style:preserve-3d;
  transform-origin:left center;will-change:transform;
  transition:transform var(--flip) var(--ease);
}
.spread .leaf{left:50%;width:50%}
.solo .leaf{left:0;width:100%}
.leaf.flipped{transform:rotateY(-180deg)}
.leaf.dragging{transition:none}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;background:var(--gading);
}
.face.back{transform:rotateY(180deg)}
.face.front{box-shadow:inset 16px 0 26px -20px rgba(0,0,0,.5),3px 3px 18px rgba(0,0,0,.4)}
.face.back{box-shadow:inset -16px 0 26px -20px rgba(0,0,0,.5),-3px 3px 18px rgba(0,0,0,.4)}

/* punggung halaman kosong (mode ponsel) */
.verso{
  width:100%;height:100%;background:var(--gading);display:grid;place-items:center;
}
.verso img{width:34%;opacity:.07}

/* ── halaman ── */
.page{
  width:100%;height:100%;color:var(--tinta);position:relative;
  font-size:calc(var(--page-w)/26);line-height:1.55;
  padding:1.9em 1.7em 1.3em;display:flex;flex-direction:column;
  background:var(--gading);
}
.page::before{ /* bingkai emas tipis */
  content:"";position:absolute;inset:.75em;border:1px solid rgba(198,169,107,.42);pointer-events:none;
}
.page h2{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:1.95em;
  line-height:1.08;margin:.1em 0 .35em;letter-spacing:.005em;
}
.page p{margin:0 0 .7em;font-size:.8em;color:#4A463E;max-width:34ch;font-weight:300}
.runner{
  font-size:.56em;letter-spacing:.3em;color:var(--emas-tua);margin-bottom:.4em;
}
.folio{
  margin-top:auto;padding-top:.8em;font-size:.58em;color:var(--abu);
  display:flex;justify-content:space-between;align-items:center;letter-spacing:.18em;
}
.folio b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:1.5em;color:var(--emas-tua);letter-spacing:0}

/* ── foto ── */
.ph{
  position:relative;overflow:hidden;background:linear-gradient(140deg,#233A52,#0F1C2B 70%);
  border:1px solid rgba(198,169,107,.4);flex:0 0 auto;
}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.kosong::after{
  content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;
  color:rgba(198,169,107,.75);font-size:.62em;letter-spacing:.16em;text-align:center;padding:.6em;
}
.band{height:30%;margin:.1em 0 .8em}
.band.pendek{height:22%}
.trio{display:flex;gap:.4em;margin:.2em 0 .8em}
.trio .ph{flex:1;aspect-ratio:3/4}

/* ── daftar harga ── */
.rows{list-style:none;margin:.1em 0 .7em;padding:0}
.rows li{display:flex;align-items:baseline;gap:.35em;padding:.4em 0;border-bottom:1px solid rgba(198,169,107,.35)}
.rows .n{font-size:.82em}
.rows .n small{display:block;color:var(--abu);font-size:.84em;line-height:1.4}
.rows .dots{flex:1}
.rows .p{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.12em;color:var(--emas-tua);white-space:nowrap}

.note{font-size:.66em;color:var(--abu);border-left:1px solid var(--emas);padding-left:.75em;margin:.1em 0 .55em;line-height:1.6}

/* ── daftar isi ── */
.toc{list-style:none;margin:.2em 0 0;padding:0}
.toc li{display:flex;align-items:baseline;gap:.4em;padding:.42em 0;font-size:.78em;border-bottom:1px solid rgba(30,28,23,.08)}
.toc .dots{flex:1;border-bottom:1px dotted rgba(30,28,23,.25);transform:translateY(-.3em)}
.toc b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:1.25em;color:var(--emas-tua)}

/* ── langkah ── */
.steps{list-style:none;margin:.1em 0 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:.48em 0 .48em 2.2em;counter-increment:s;font-size:.76em;border-bottom:1px solid rgba(30,28,23,.08)}
.steps li::before{
  content:counter(s,decimal-leading-zero);position:absolute;left:0;top:.5em;
  font-family:"Cormorant Garamond",serif;font-size:1.15em;color:var(--emas);
}
.steps b{display:block;font-weight:500;font-size:1.05em;margin-bottom:.02em}
.steps span{color:#4A463E}

/* ── terapis ── */
.who{display:flex;gap:.7em;padding:.5em 0;border-bottom:1px solid rgba(30,28,23,.08);align-items:center}
.who .ph{width:3.1em;height:3.1em;border-radius:50%;flex:0 0 auto}
.who .ph.kosong::after{font-size:.5em;letter-spacing:.06em}
.who .txt{font-size:.72em;color:#4A463E;line-height:1.5}
.who .txt b{display:block;font-size:1.14em;color:var(--tinta);font-weight:500;font-family:"Cormorant Garamond",serif}
.who .txt i{font-style:normal;color:var(--emas-tua)}

.areas{display:flex;flex-wrap:wrap;gap:.28em;margin:.1em 0 .7em}
.areas span{font-size:.62em;letter-spacing:.1em;border:1px solid rgba(198,169,107,.55);border-radius:2em;padding:.3em .8em;color:#4A463E}

.qa{font-size:.72em;margin-bottom:.55em;line-height:1.55}
.qa b{display:block;font-weight:500;font-family:"Cormorant Garamond",serif;font-size:1.1em}
.qa span{color:#4A463E}

.cta{
  display:inline-block;margin-top:.35em;background:var(--malam);color:var(--gading);
  text-decoration:none;font-size:.68em;letter-spacing:.16em;padding:.75em 1.4em;
  border:1px solid var(--emas);
}
.cta:hover{background:var(--malam-2)}

/* ── sampul ── */
.page.sampul,.page.penutup{padding:0;color:var(--gading);background:var(--malam)}
.page.sampul .ph,.page.penutup .ph{position:absolute;inset:0;border:0}
.page.sampul .isi,.page.penutup .isi{
  position:relative;z-index:2;height:100%;padding:2.1em 1.8em 1.5em;
  display:flex;flex-direction:column;justify-content:space-between;text-align:center;align-items:center;
  background:linear-gradient(180deg,rgba(9,17,27,.86) 0%,rgba(9,17,27,.6) 45%,rgba(9,17,27,.92) 100%);
}
.page.sampul::before,.page.penutup::before{inset:.9em;border-color:rgba(198,169,107,.6);z-index:3}
.sampul .logo{width:4.6em;opacity:.95}
.sampul h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:2.75em;line-height:1;
  margin:0;letter-spacing:.02em;color:#F3EADA;
}
.sampul h1 em{font-style:italic;display:block;color:var(--emas)}
.sampul .rule{width:3.4em;height:1px;background:var(--emas);margin:.85em auto}
.sampul .sub{font-size:.68em;letter-spacing:.28em;color:#C8BCA4}
.sampul .kaki{font-size:.6em;letter-spacing:.24em;color:rgba(198,169,107,.85)}
.penutup h2{color:#F3EADA;font-size:1.7em;margin-bottom:.3em}
.penutup p{color:#C8BCA4;max-width:26ch;font-size:.76em;margin-inline:auto}
.penutup .cta{background:var(--emas);color:#14100A;border-color:var(--emas);font-weight:500}
.penutup .cta:hover{background:#D6BC85}
.penutup .kaki{font-size:.58em;letter-spacing:.2em;color:rgba(198,169,107,.85);line-height:2}
.penutup .logo{width:3.6em;margin-bottom:.6em}

/* ── kontrol & logo bawah ── */
.ctrl{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:1.15rem .8rem .35rem;z-index:2}
.ctrl button,.ctrl select{
  font:inherit;font-size:.72rem;letter-spacing:.12em;color:#DDD2BC;background:rgba(255,255,255,.05);
  border:1px solid rgba(198,169,107,.4);border-radius:2em;padding:.55em 1.1em;cursor:pointer;
}
.ctrl button:hover:not(:disabled),.ctrl select:hover{background:rgba(198,169,107,.16)}
.ctrl button:disabled{opacity:.28;cursor:default}
.ctrl .count{font-size:.66rem;letter-spacing:.16em;color:#9E947F;min-width:8.5em;text-align:center}
.ctrl select{max-width:10rem}
:focus-visible{outline:1px solid var(--emas);outline-offset:3px}

.kaki-logo{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.3rem;
  padding:.5rem 0 max(.7rem,env(safe-area-inset-bottom));z-index:2;
}
.kaki-logo img{height:34px;width:auto;opacity:.9}
.kaki-logo span{font-size:.54rem;letter-spacing:.3em;color:rgba(198,169,107,.7)}

@media (max-width:860px){
  .bar{padding:.7rem .6rem .1rem}
  .bar .mark b{font-size:1.1rem}
  .ctrl{gap:.35rem;padding:.85rem .5rem .2rem}
  .ctrl button,.ctrl select{font-size:.64rem;padding:.5em .85em}
  .ctrl .count{min-width:6.6em;font-size:.6rem}
  .ctrl select{max-width:7rem}
  .kaki-logo img{height:28px}
}
</style>
</head>
<body>

<nav class="ctrl">

<footer class="kaki-logo">

<script>

/* ══════════════════════════════════════════════════════════

      foto/bagas.jpg       foto/area.jpg        foto/penutup.jpg
      Selama belum diunggah, kotaknya tampil kosong bertuliskan nama file.
   ══════════════════════════════════════════════════════════ */
const foto = (file, cls) =>
  `<div class="ph ${cls||''}" data-label="foto/${file}">
     <img src="foto/${file}" alt="" onerror="this.parentNode.classList.add('kosong');this.remove()">
   </div>`;

const wa = t => "https://wa.me/" + WA_NOMOR + "?text=" + encodeURIComponent(t);

{ label:"Area & jam layanan", html:`
  <div class="page">
    <div class="runner">DUA CABANG, BANYAK WILAYAH</div>
    <h2>Area &amp; jam layanan</h2>
    ${foto("area.jpg","band pendek")}

    ${folio(9,"AREA &amp; JAM LAYANAN")}

{ label:"Pesan sekarang", html:`
  <div class="page penutup">
    ${foto("penutup.jpg")}
    <div class="isi">

/* ══════════════ mesin lembaran ══════════════ */
const stage  = document.getElementById("stage");
const bPrev  = document.getElementById("prev");
const bNext  = document.getElementById("next");
const count  = document.getElementById("count");
const jump   = document.getElementById("jump");
const root   = document.documentElement;

const N = PAGES.length;
let mode = null;      // "spread" | "solo"
let leaves = 0;       // jumlah lembar pada mode aktif
let at = 0;           // jumlah lembar yang sudah dibalik
let busy = false;
let book = null;

PAGES.forEach((p,i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = (i+1) + ". " + p.label;
  jump.appendChild(o);
});

const wantMode = () => window.matchMedia("(min-width:861px)").matches ? "spread" : "solo";
const verso = `<div class="verso"><img src="logo.png" alt="" onerror="this.style.display='none'"></div>`;

function ukur(){
  const r = stage.getBoundingClientRect();
  const h = r.height - 18, w = r.width - 20;
  let pw = mode === "spread" ? Math.min(w/2, h/1.4) : Math.min(w, h/1.4);
  pw = Math.max(210, Math.floor(pw));
  root.style.setProperty("--page-w", pw + "px");
  root.style.setProperty("--page-h", Math.round(pw*1.4) + "px");
  root.style.setProperty("--book-w", (mode === "spread" ? pw*2 : pw) + "px");
}

function build(next){
  mode = next;
  leaves = mode === "spread" ? Math.ceil(N/2) : N;
  stage.innerHTML = "";
  book = document.createElement("div");
  book.className = "book " + mode;
  for (let i = 0; i < leaves; i++){
    const leaf = document.createElement("div");
    leaf.className = "leaf";
    const f = mode === "spread" ? (PAGES[2*i]   ? PAGES[2*i].html   : verso) : PAGES[i].html;
    const b = mode === "spread" ? (PAGES[2*i+1] ? PAGES[2*i+1].html : verso) : verso;
    leaf.innerHTML = '<div class="face front">'+f+'</div><div class="face back">'+b+'</div>';
    book.appendChild(leaf);
  }
  stage.appendChild(book);
  ukur();
  pasangGeser();
  render();
}

function render(){
  const ls = book.querySelectorAll(".leaf");
  ls.forEach((leaf,i) => {
    const done = i < at;
    leaf.classList.toggle("flipped", done);
    leaf.style.zIndex = done ? (i+1) : (leaves - i);
    if (!leaf.classList.contains("dragging")) leaf.style.transform = "";
  });
  book.classList.toggle("at-first", mode === "spread" && at === 0);
  book.classList.toggle("at-last",  mode === "spread" && at === leaves);

  if (mode === "spread"){
    const kiri  = at === 0 ? null : 2*at;
    const kanan = at === leaves ? null : 2*at + 1;
    count.textContent = (kiri && kanan) ? kiri + "–" + kanan + " / " + N : (kiri || kanan) + " / " + N;
    jump.value = String(kiri ? kiri-1 : 0);
  } else {
    count.textContent = (at+1) + " / " + N;
    jump.value = String(at);
  }
  bPrev.disabled = at === 0;
  bNext.disabled = at === (mode === "spread" ? leaves : N-1);
}

function go(dir){
  if (busy) return;
  const maks = mode === "spread" ? leaves : N-1;
  const t = at + dir;
  if (t < 0 || t > maks) return;
  const leaf = book.querySelectorAll(".leaf")[dir > 0 ? at : at-1];
  at = t; busy = true;
  if (leaf) leaf.style.zIndex = 999;
  render();
  setTimeout(() => { busy = false; render(); }, 940);
}

function goTo(p){
  if (busy) return;
  at = mode === "spread" ? (p === 0 ? 0 : Math.ceil(p/2)) : p;
  render();
}

/* geser dengan jari / tetikus — halaman mengikuti gerakan tangan */
function pasangGeser(){
  let aktif = null, x0 = 0, y0 = 0, arah = 0, geser = false, lebar = 1;

  book.addEventListener("pointerdown", e => {
    if (busy || e.target.closest("a")) return;
    x0 = e.clientX; y0 = e.clientY; geser = false; aktif = null;
    lebar = book.getBoundingClientRect().width / (mode === "spread" ? 2 : 1);
    book.setPointerCapture(e.pointerId);
  });

  book.addEventListener("pointermove", e => {
    if (!x0) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!geser){
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
      geser = true;
      arah = dx < 0 ? 1 : -1;
      const maks = mode === "spread" ? leaves : N-1;
      const t = at + arah;
      if (t < 0 || t > maks){ geser = false; x0 = 0; return; }
      aktif = book.querySelectorAll(".leaf")[arah > 0 ? at : at-1];
      if (!aktif){ geser = false; x0 = 0; return; }
      aktif.classList.add("dragging");
      aktif.style.zIndex = 999;
    }
    const p = Math.min(1, Math.max(0, Math.abs(dx)/lebar));
    const deg = arah > 0 ? -180*p : -180*(1-p);
    aktif.style.transform = "rotateY(" + deg + "deg)";
  });

  const lepas = e => {
    if (!x0) return;
    const dx = e.clientX - x0;
    if (geser && aktif){
      const p = Math.min(1, Math.abs(dx)/lebar);
      aktif.classList.remove("dragging");
      aktif.style.transform = "";
      if (p > .3) { at += arah; }
      busy = true; render();
      setTimeout(() => { busy = false; render(); }, 940);
    } else if (Math.abs(dx) < 8){
      const r = book.getBoundingClientRect();
      go(e.clientX - r.left > r.width/2 ? 1 : -1);
    }
    x0 = 0; geser = false; aktif = null;
  };
  book.addEventListener("pointerup", lepas);
  book.addEventListener("pointercancel", () => { 
    if (aktif){ aktif.classList.remove("dragging"); aktif.style.transform = ""; }
    x0 = 0; geser = false; aktif = null; render();
  });
}

bPrev.addEventListener("click", () => go(-1));
bNext.addEventListener("click", () => go(1));
jump.addEventListener("change", () => goTo(Number(jump.value)));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft")  go(-1);
});

build(wantMode());

let rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const w = wantMode();
    if (w === mode){ ukur(); return; }
    const hal = mode === "spread" ? (at === 0 ? 0 : 2*at - 1) : at;   // halaman aktif, 0-based
    build(w);
    at = w === "spread" ? (hal === 0 ? 0 : Math.ceil(hal/2)) : hal;
    render();
  }, 180);
});
</script>
</body>
