<html lang="id">
<head>

<style>
/* ============================================================
   GANTI DUA BARIS DI BAWAH INI DENGAN DATA ASLI KAMU
   (nomor WhatsApp ada di file JavaScript, cari kata WA_NOMOR)
   ============================================================ */
:root{
  --nila:#16233F;        /* indigo tua — sampul */
  --nila-mid:#33487A;    /* indigo sedang — aksen */
  --kertas:#FBF7F0;      /* kertas halaman */
  --tinta:#22201C;       /* teks */
  --kunyit:#B5822B;      /* aksen harga & garis */
  --abu:#6E6A61;         /* teks sekunder */

  --page-h:min(76vh,600px);
  --page-w:calc(var(--page-h)/1.36);
  --flip:.85s;
}
@media (prefers-reduced-motion:reduce){:root{--flip:.001s}}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#0E1729;color:var(--kertas);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;min-height:100dvh;
  background-image:radial-gradient(120% 80% at 50% 0%,#1B2B48 0%,#0E1729 60%);
}

/* ---------- kepala ---------- */
.bar{display:flex;align-items:center;gap:.9rem;padding:.85rem 1.1rem;flex:0 0 auto}
.bar .mark{font-family:Fraunces,Georgia,serif;font-size:1.02rem;letter-spacing:.01em}
.bar .mark span{display:block;font-family:"Instrument Sans",sans-serif;font-size:.66rem;color:#93A2C0;margin-top:.1rem}
.bar .spacer{flex:1}
.bar a.back{color:#B9C6E0;text-decoration:none;font-size:.82rem;border-bottom:1px solid rgba(185,198,224,.35);padding-bottom:1px}
.bar a.back:hover{color:#fff}

/* ---------- panggung buku ---------- */
.stage{flex:1;display:grid;place-items:center;padding:.4rem 1rem 0;perspective:2400px;min-height:0}
.book{
  position:relative;width:calc(var(--page-w)*2);height:var(--page-h);
  transform-style:preserve-3d;transition:transform var(--flip) cubic-bezier(.32,.72,.29,1);
}
.book.at-first{transform:translateX(calc(var(--page-w)/2))}
.book.at-last{transform:translateX(calc(var(--page-w)/-2))}
.book::after{ /* bayangan buku di bawah */
  content:"";position:absolute;left:6%;right:6%;bottom:-14px;height:26px;
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.55),transparent 70%);
  filter:blur(3px);z-index:0;
}
.leaf{
  position:absolute;top:0;left:50%;width:50%;height:100%;
  transform-style:preserve-3d;transform-origin:left center;
  transition:transform var(--flip) cubic-bezier(.36,.66,.24,1);
}
.leaf.flipped{transform:rotateY(-180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
  background:var(--kertas);
}
.face.back{transform:rotateY(180deg)}
.face.front{box-shadow:inset 14px 0 22px -18px rgba(0,0,0,.55),2px 2px 14px rgba(0,0,0,.35)}
.face.back{box-shadow:inset -14px 0 22px -18px rgba(0,0,0,.55),-2px 2px 14px rgba(0,0,0,.35)}

/* ---------- halaman ---------- */
.page{
  width:100%;height:100%;color:var(--tinta);
  font-size:calc(var(--page-w)/25);line-height:1.5;
  padding:2.1em 1.9em 1.5em;display:flex;flex-direction:column;position:relative;
}
.page h2{
  font-family:Fraunces,Georgia,serif;font-weight:500;font-size:1.72em;line-height:1.12;
  margin:.15em 0 .5em;letter-spacing:-.012em;
}
.page p{margin:0 0 .75em;font-size:.86em;color:#43403A;max-width:32ch}
.page .lead{font-size:.95em;color:#35322D}
.runner{
  font-family:Fraunces,Georgia,serif;font-style:italic;font-size:.72em;color:var(--abu);
  border-bottom:1px solid rgba(110,106,97,.28);padding-bottom:.5em;
}
.folio{margin-top:auto;padding-top:.9em;font-size:.62em;color:var(--abu);display:flex;justify-content:space-between;align-items:baseline}
.folio b{font-family:Fraunces,serif;font-weight:400;color:var(--tinta)}

/* daftar harga bergaya menu */
.rows{list-style:none;margin:.2em 0 .9em;padding:0}
.rows li{display:flex;align-items:baseline;gap:.35em;padding:.42em 0;border-bottom:1px dotted rgba(181,130,43,.5)}
.rows .n{font-size:.86em}
.rows .n small{display:block;color:var(--abu);font-size:.82em;line-height:1.35}
.rows .dots{flex:1}
.rows .p{font-family:Fraunces,Georgia,serif;font-size:.98em;color:var(--kunyit);white-space:nowrap}

.note{font-size:.72em;color:var(--abu);border-left:2px solid var(--kunyit);padding-left:.7em;margin:.2em 0 .6em}

/* daftar isi */
.toc{list-style:none;margin:.3em 0 0;padding:0}
.toc li{display:flex;align-items:baseline;gap:.4em;padding:.46em 0;border-bottom:1px solid rgba(34,32,28,.1);font-size:.85em}
.toc .dots{flex:1;border-bottom:1px dotted rgba(34,32,28,.28);transform:translateY(-.25em)}
.toc b{font-family:Fraunces,serif;font-weight:400;color:var(--nila-mid)}

/* langkah bernomor (memang urutan) */

.steps li{position:relative;padding:.5em 0 .5em 2.1em;counter-increment:s;font-size:.82em;border-bottom:1px solid rgba(34,32,28,.1)}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:.5em;

}
.steps b{display:block;font-weight:500;font-size:1.02em;margin-bottom:.05em}
.steps span{color:#4A4740}

/* terapis */
.who{display:flex;gap:.7em;padding:.55em 0;border-bottom:1px solid rgba(34,32,28,.1);align-items:flex-start}
.who .ini{
  flex:0 0 auto;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;
  background:var(--nila);color:var(--kertas);font-family:Fraunces,serif;font-size:.9em;

.who .txt{font-size:.78em;color:#4A4740}
.who .txt b{display:block;font-size:1.08em;color:var(--tinta);font-weight:500}
.who .txt i{font-style:normal;color:var(--kunyit)}

.areas{display:flex;flex-wrap:wrap;gap:.3em;margin:.1em 0 .8em}
.areas span{font-size:.7em;border:1px solid rgba(34,32,28,.18);border-radius:1em;padding:.2em .65em;color:#4A4740}

.qa{font-size:.78em;margin-bottom:.7em}
.qa b{display:block;font-weight:500;margin-bottom:.1em}
.qa span{color:#4A4740}

.cta{

.cta:hover{background:var(--nila-mid)}

/* sampul depan & belakang */
.page.cover,.page.end{background:var(--nila);color:var(--kertas);justify-content:space-between}
.page.cover::before,.page.end::before{
  content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:radial-gradient(circle at 1px 1px,rgba(181,130,43,.9) 1px,transparent 0);
  background-size:14px 14px;

.page.cover>*,.page.end>*{position:relative}
.page.cover h1{

.page.cover h1 em{font-style:italic;display:block}
.cover .top,.end .top{font-size:.78em;color:#C6D2EA}
.cover .rule{width:2.6em;height:1px;background:var(--kunyit);margin:.9em 0}
.cover .foot,.end .foot{font-size:.7em;color:#9FB0CE}
.end h2{color:var(--kertas);font-size:1.5em}
.end p{color:#C6D2EA;max-width:26ch}
.end .cta{background:var(--kunyit);color:#1B1503;font-weight:500}
.end .cta:hover{background:#CE9736}

/* ---------- mode satu halaman (ponsel) ---------- */
.single{position:relative;width:min(92vw,400px);height:calc(min(92vw,400px)*1.36);overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.45)}
.single .slide{position:absolute;inset:0;transition:transform var(--flip) cubic-bezier(.32,.72,.29,1);background:var(--kertas)}
.single .page{--page-w:min(92vw,400px);font-size:calc(min(92vw,400px)/23);padding:1.7em 1.4em 1.2em}

/* ---------- kontrol ---------- */
.ctrl{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:.55rem;padding:1.1rem 1rem 1.4rem}
.ctrl button,.ctrl select{
  font:inherit;font-size:.8rem;color:#DCE4F3;background:rgba(255,255,255,.07);

.ctrl button:hover:not(:disabled),.ctrl select:hover{background:rgba(255,255,255,.14)}
.ctrl button:disabled{opacity:.32;cursor:default}
.ctrl .count{font-size:.78rem;color:#93A2C0;min-width:9.5em;text-align:center}
.ctrl select{max-width:11rem}
:focus-visible{outline:2px solid var(--kunyit);outline-offset:2px}

@media (max-width:860px){
  .stage{padding:.2rem .5rem 0;perspective:none}
  .ctrl{padding:.9rem .6rem 1.1rem;gap:.4rem}
  .ctrl .count{min-width:7.5em;font-size:.72rem}
  .ctrl select{max-width:8rem;font-size:.72rem}
}
@media (max-height:620px) and (min-width:861px){:root{--page-h:min(72vh,520px)}}
</style>
</head>

/* -------------------- mesin flipbook -------------------- */
const stage = document.getElementById("stage");
const btnPrev = document.getElementById("prev");
const btnNext = document.getElementById("next");
const count = document.getElementById("count");
const jump = document.getElementById("jump");

const N = PAGES.length;              // jumlah halaman (genap)
const LEAVES = Math.ceil(N / 2);
let mode = null;                     // "spread" | "single"
let flipped = 0;                     // jumlah lembar yang sudah dibalik
let idx = 0;                         // halaman aktif di mode ponsel
let busy = false;

PAGES.forEach((p, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = (i + 1) + ". " + p.label;
  jump.appendChild(o);
});

function wantMode(){ return window.matchMedia("(min-width:861px)").matches ? "spread" : "single"; }

function build(next){
  mode = next;
  stage.innerHTML = "";
  if (mode === "spread"){
    const book = document.createElement("div");
    book.className = "book"; book.id = "book";
    for (let i = 0; i < LEAVES; i++){
      const leaf = document.createElement("div");
      leaf.className = "leaf";
      leaf.innerHTML =
        '<div class="face front">' + (PAGES[2*i] ? PAGES[2*i].html : "") + '</div>' +
        '<div class="face back">'  + (PAGES[2*i+1] ? PAGES[2*i+1].html : "") + '</div>';
      book.appendChild(leaf);
    }
    stage.appendChild(book);
  } else {
    const wrap = document.createElement("div");
    wrap.className = "single";
    PAGES.forEach((p, i) => {
      const s = document.createElement("div");
      s.className = "slide"; s.dataset.i = i; s.innerHTML = p.html;
      wrap.appendChild(s);
    });
    stage.appendChild(wrap);
    addSwipe(wrap);
  }
  render();
}

function render(){
  if (mode === "spread"){
    const book = document.getElementById("book");
    const leaves = book.querySelectorAll(".leaf");
    leaves.forEach((leaf, i) => {
      const isFlipped = i < flipped;
      leaf.classList.toggle("flipped", isFlipped);
      leaf.style.zIndex = isFlipped ? (i + 1) : (LEAVES - i);
    });
    book.classList.toggle("at-first", flipped === 0);
    book.classList.toggle("at-last", flipped === LEAVES);

    const left = flipped === 0 ? null : 2 * flipped;      // nomor halaman (1-based)
    const right = flipped === LEAVES ? null : 2 * flipped + 1;
    count.textContent = left && right ? "Halaman " + left + "–" + right + " dari " + N
                      : "Halaman " + (left || right) + " dari " + N;
    jump.value = String(left ? left - 1 : 0);
    btnPrev.disabled = flipped === 0;
    btnNext.disabled = flipped === LEAVES;
  } else {
    stage.querySelectorAll(".slide").forEach((s, i) => {
      s.style.transform = "translateX(" + ((i - idx) * 100) + "%)";
    });
    count.textContent = "Halaman " + (idx + 1) + " dari " + N;
    jump.value = String(idx);
    btnPrev.disabled = idx === 0;
    btnNext.disabled = idx === N - 1;
  }
}

function go(dir){
  if (busy) return;
  if (mode === "spread"){
    const t = flipped + dir;
    if (t < 0 || t > LEAVES) return;
    const leaf = document.querySelectorAll(".leaf")[dir > 0 ? flipped : flipped - 1];
    if (leaf){ leaf.style.zIndex = 100; }
    flipped = t; busy = true;
    render();
    setTimeout(() => { busy = false; render(); }, 880);
  } else {
    const t = idx + dir;
    if (t < 0 || t > N - 1) return;
    idx = t; render();
  }
}

function goTo(page){                 // page: indeks 0-based
  if (mode === "spread"){
    flipped = page === 0 ? 0 : Math.ceil(page / 2);
    render();
  } else { idx = page; render(); }
}

function addSwipe(el){
  let x0 = null, y0 = null;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  el.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    x0 = null;
  }, {passive:true});
}

btnPrev.addEventListener("click", () => go(-1));
btnNext.addEventListener("click", () => go(1));
jump.addEventListener("change", () => goTo(Number(jump.value)));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
stage.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const r = stage.getBoundingClientRect();
  go(e.clientX - r.left > r.width / 2 ? 1 : -1);
});

build(wantMode());
let rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const w = wantMode();
    if (w === mode) return;
    const cur = mode === "spread" ? (flipped === 0 ? 0 : 2 * flipped - 1) : idx;
    if (w === "spread"){ flipped = cur === 0 ? 0 : Math.ceil(cur / 2); } else { idx = cur; }
    build(w);
  }, 200);
});
</script>
</body>
</html>
