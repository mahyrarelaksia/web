/* ============ MODEL: hanya alat, bahan, dan biaya belum tercatat ============ */
const MODEL_AWAL={
  iklan:0, lain:0, hari_kerja:26,
  alat:[{nama:'Matras lipat',harga:450000,set:1,umur:24},
        {nama:'Handuk besar',harga:60000,set:6,umur:6},
        {nama:'Sprei & selimut',harga:150000,set:2,umur:12},
        {nama:'Tas terapis',harga:200000,set:1,umur:24}],
  bahan:[{nama:'Minyak pijat',harga:120000,cukup:40},
         {nama:'Lulur & scrub',harga:90000,cukup:25},
         {nama:'Tisu & masker',harga:35000,cukup:30},
         {nama:'Laundry handuk',harga:8000,cukup:1}]
};
let MODELS={}, CAB_BIAYA=null, PER_BIAYA=null;

function cabangBiaya(){
  if(CAB_BIAYA) return CAB_BIAYA;
  CAB_BIAYA = lingkupSaya()==='semua' ? 'semua' : (ME.cabang_id||'semua');
  return CAB_BIAYA;
}
function periodeBiaya(){ return PER_BIAYA||periode(); }
function pilihCabangBiaya(id){ CAB_BIAYA=id; render(); }
function pilihPeriodeBiaya(p){ PER_BIAYA=p; render(); }

function modelAktif(){
  const dasar={...MODEL_AWAL,...(MODELS.umum||{})};
  const cab=cabangBiaya();
  const khusus=(cab&&cab!=='semua')?(MODELS[cab]||{}):{};
  const g={...dasar,...khusus};
  g.alat =(khusus.alat&&khusus.alat.length)?khusus.alat
        :((MODELS.umum&&MODELS.umum.alat&&MODELS.umum.alat.length)?MODELS.umum.alat:MODEL_AWAL.alat);
  g.bahan=(khusus.bahan&&khusus.bahan.length)?khusus.bahan
        :((MODELS.umum&&MODELS.umum.bahan&&MODELS.umum.bahan.length)?MODELS.umum.bahan:MODEL_AWAL.bahan);
  return g;
}
function modelTulis(){
  const cab=cabangBiaya(), kunci=(cab&&cab!=='semua')?cab:'umum';
  if(!MODELS[kunci]) MODELS[kunci]={};
  return MODELS[kunci];
}
function muatModel(){
  const p=(DB.pengaturan||[]).find(x=>x.kunci==='model_biaya');
  const isi=(p&&p.nilai&&typeof p.nilai==='object')?p.nilai:{};
  MODELS = Object.keys(isi).length ? isi : {umum:{}};
  if(!MODELS.umum) MODELS.umum={};
}
async function simpanModel(){
  if(LIVE){
    const {error}=await sb.from('pengaturan').upsert({kunci:'model_biaya',nilai:MODELS});
    if(error) return toast('Gagal menyimpan: '+error.message);
    if(!Array.isArray(DB.pengaturan)) DB.pengaturan=[];
    const i=DB.pengaturan.findIndex(x=>x.kunci==='model_biaya');
    if(i>=0) DB.pengaturan[i].nilai=MODELS; else DB.pengaturan.push({kunci:'model_biaya',nilai:MODELS});
  }
  const cab=cabangBiaya();
  toast('Asumsi '+(cab==='semua'?'umum':nm('cabang',cab))+' tersimpan');
}
function resetModel(){
  const cab=cabangBiaya(), kunci=(cab&&cab!=='semua')?cab:'umum';
  MODELS[kunci]={}; render(); toast('Kembali ke angka awal');
}
function isian(kunci,label,ket,satuan='Rp'){
  const M=modelAktif();
  return `<div class="baris"><label for="m_${kunci}">${label}<small>${ket}</small></label>
    <input id="m_${kunci}" type="number" value="${M[kunci]??0}"
      oninput="ubahModel('${kunci}',this.value)" placeholder="${satuan}"></div>`;
}
let jedaHitung=null;
const jeda=(ms=600)=>{ clearTimeout(jedaHitung);
  jedaHitung=setTimeout(()=>{ const f=document.activeElement?.id; render();
    const el=document.getElementById(f); if(el){el.focus(); el.setSelectionRange?.(el.value.length,el.value.length);} },ms); };
function ubahModel(kunci,nilai){ modelTulis()[kunci]=Number(nilai)||0; jeda(); }
function salinRinci(jenis){ const m=modelTulis();
  if(!m[jenis]) m[jenis]=modelAktif()[jenis].map(x=>({...x})); return m[jenis]; }
function ubahRinci(jenis,i,kunci,nilai){
  const arr=salinRinci(jenis); arr[i][kunci]=kunci==='nama'?nilai:(Number(nilai)||0); jeda(700); }
function tambahRinci(jenis){ salinRinci(jenis).push(
  jenis==='alat'?{nama:'Alat baru',harga:0,set:1,umur:12}:{nama:'Bahan baru',harga:0,cukup:1}); render(); }
function hapusRinci(jenis,i){ salinRinci(jenis).splice(i,1); render(); }

/* ================= PERHITUNGAN DARI DATA NYATA ================= */
function hitungRealisasi(cab,per,M){
  const diCabang=r=>cab==='semua'?dalamLingkup(r,'pesanan'):r.cabang_id===cab;
  const orang  =k=>cab==='semua'?dalamLingkup(k,'karyawan'):k.cabang_id===cab;

  // --- omzet: order selesai & complete, menurut bulan pengerjaan ---
  const pesanan=DB.pesanan.filter(p=>['selesai','complete'].includes(p.status)
    &&String(p.tgl_kerja||p.tanggal).startsWith(per)&&diCabang(p));
  const idPesanan=new Set(pesanan.map(p=>p.id));
  const omzet=sum(pesanan,'total'), jmlOrder=pesanan.length;
  const harga=jmlOrder?omzet/jmlOrder:0;
  const item=DB.item.filter(i=>idPesanan.has(i.pesanan_id)&&i.status==='selesai');

  // --- biaya SDM: rumus penggajian yang sama, dipecah per komponen ---
  const hariKerja=M.hari_kerja||26;
  const aktif=DB.karyawan.filter(k=>k.status==='aktif'&&orang(k));
  const terapis=aktif.filter(k=>k.role==='terapis');
  const staf=aktif.filter(k=>k.role!=='terapis');
  const rinci=aktif.map(k=>({k,g:rincianGaji(k,per)})).filter(x=>x.g.ada);
  // biaya perusahaan = sebelum dipotong cicilan kasbon (kasbon bukan biaya)
  const kotor=g=>g.total+g.ksb;

  let komisi=0, bonus=0, upah=0, gajiStaf=0, gajiCS=0, penyesuaian=0;
  const peta={};
  rinci.forEach(({k,g})=>{
    const j=get('jabatan',k.jabatan_id)||{};
    const kunci=k.jabatan_id||'tanpa';
    if(!peta[kunci]) peta[kunci]={nama:j.nama||'Tanpa jabatan',jumlah:0,order:0,hari:0,
      komisi:0,upah:0,bonus:0,total:0,skema:g.s.nama+' · '+g.s.tipe,terapis:k.role==='terapis'};
    const p=peta[kunci];
    p.jumlah++; p.order+=g.nOrder; p.hari+=g.efektif;
    p.komisi+=g.kom;
    p.upah+=g.pokok+g.upah+g.tunj+g.um;
    p.bonus+=g.bon+g.bonusTarget+g.bonusTetap+g.sesuai;
    p.total+=kotor(g);

    if(g.s.tipe==='cs') gajiCS+=kotor(g);
    else if(k.role==='terapis'){
      komisi+=g.kom; bonus+=g.bon+g.bonusTarget+g.bonusTetap;
      upah+=g.pokok+g.upah+g.tunj+g.um-g.pot; penyesuaian+=g.sesuai;
    }else gajiStaf+=kotor(g);
  });
  const perJabatan=Object.values(peta).sort((a,b)=>b.total-a.total);
  const tanpaSkema=aktif.filter(k=>!skemaBerlaku(k));

  // --- pengeluaran yang sudah disetujui ---
  const keluar=DB.pengeluaran.filter(e=>e.status==='disetujui'&&String(e.tanggal).startsWith(per)&&diCabang(e));
  const pengeluaran=sum(keluar,'nominal');
  const perKategori={};
  keluar.forEach(e=>{ const n=nm('kategori_pengeluaran',e.kategori_id)||'Lain-lain';
    perKategori[n]=(perKategori[n]||0)+Number(e.nominal||0); });
  const adaKategori=kata=>Object.keys(perKategori).some(n=>n.toLowerCase().includes(kata));

  // --- perkiraan yang diisi admin, hanya bila belum tercatat di Pengeluaran ---
  const jmlTerapis=Math.max(1,terapis.length);
  const alat=Math.round((M.alat||[]).reduce((a,x)=>a+((x.harga||0)/Math.max(1,x.umur||1))*(x.set||1),0)*jmlTerapis);
  const bahanPerOrder=(M.bahan||[]).reduce((a,x)=>a+((x.harga||0)/Math.max(1,x.cukup||1)),0);
  const bahanTercatat=adaKategori('bahan')||adaKategori('minyak')||adaKategori('perlengkapan');
  const bahan=bahanTercatat?0:Math.round(bahanPerOrder*jmlOrder);
  const iklanTercatat=adaKategori('iklan')||adaKategori('promosi')||adaKategori('marketing');
  const lainManual=(iklanTercatat?0:(M.iklan||0))+(M.lain||0);

  const sdm=komisi+bonus+upah+penyesuaian+gajiCS+gajiStaf;
  const otomatis=sdm+pengeluaran;
  const manual=alat+bahan+lainManual;
  const total=otomatis+manual;
  const laba=omzet-total;

  const otomatisRinci=[
    {nama:'Komisi terapis',nilai:komisi,sumber:'skema gaji × order selesai',catatan:item.length+' pekerjaan selesai'},
    {nama:'Upah & gaji pokok terapis',nilai:upah,sumber:'skema gaji × hari kerja'},
    {nama:'Bonus terapis',nilai:bonus,sumber:'bonus order, target, service motor, BPJS'},
    {nama:'Jaminan gaji minimal',nilai:penyesuaian,sumber:'selisih ke gaji minimal'},
    {nama:'Gaji Customer Service',nilai:gajiCS,sumber:'pokok + order + target + omzet'},
    {nama:'Gaji staf kantor',nilai:gajiStaf,sumber:'skema gaji',catatan:staf.filter(k=>skemaKaryawan(k).tipe!=='cs').length+' orang'},
    ...Object.entries(perKategori).map(([n,v])=>({nama:n,nilai:v,sumber:'menu Pengeluaran'}))
  ].filter(b=>b.nilai>0);

  const semua=[...otomatisRinci,
    {nama:'Penyusutan alat',nilai:alat},{nama:'Bahan habis pakai (perkiraan)',nilai:bahan},
    {nama:'Iklan & lain-lain (perkiraan)',nilai:lainManual}].filter(b=>b.nilai>0);

  const anggaran=[
    ...perJabatan.map(g=>({nama:g.nama,nilai:g.total,catatan:g.jumlah+' orang · '+g.skema})),
    ...(M.alat||[]).map(x=>({nama:x.nama||'Alat',
      nilai:Math.round(((x.harga||0)/Math.max(1,x.umur||1))*(x.set||1)*jmlTerapis),
      catatan:rp(x.harga)+' · '+(x.set||1)+' set/terapis · umur '+(x.umur||1)+' bulan'})),
    ...(bahanTercatat?[]:(M.bahan||[]).map(x=>({nama:x.nama||'Bahan',
      nilai:Math.round(((x.harga||0)/Math.max(1,x.cukup||1))*jmlOrder),
      catatan:rp(x.harga)+' cukup untuk '+(x.cukup||1)+' order'}))),
    ...Object.entries(perKategori).map(([n,v])=>({nama:n,nilai:v,catatan:'pengeluaran tercatat'})),
    {nama:'Iklan & lain-lain',nilai:lainManual,catatan:'perkiraan, belum tercatat di pengeluaran'}
  ].filter(a=>a.nilai>0);

  // titik impas: biaya variabel mengikuti order, sisanya tetap
  const komisiPerOrder=jmlOrder?komisi/jmlOrder:0;
  const feeCsPerOrder=rinci.filter(x=>x.g.s.tipe==='cs').reduce((a,x)=>a+x.g.upah,0)/Math.max(1,jmlOrder);
  const marjin=harga-(komisiPerOrder+feeCsPerOrder+bahanPerOrder);
  const tetap=total-komisi-rinci.filter(x=>x.g.s.tipe==='cs').reduce((a,x)=>a+x.g.upah,0)-bahan;
  const bep=marjin>0?tetap/marjin:0;

  return {omzet,jmlOrder,harga,komisi,bonus,upah:upah+penyesuaian,gajiStaf:gajiStaf+gajiCS,gajiCS,
    pengeluaran,alat,bahan,lainManual,otomatis,manual,total,laba,perJabatan,otomatisRinci,semua,anggaran,
    jmlTerapis:terapis.length,jmlStaf:staf.length,tanpaSkema,bahanTercatat,iklanTercatat,
    perHari:jmlOrder/Math.max(1,terapis.length*hariKerja),
    bep,bepHari:bep/Math.max(1,terapis.length*hariKerja),tetap,marjin:Math.round(marjin)};
}

/* ----------------------- pengelolaan izin ----------------------- */
let AKSES_JBT=null;
function izinBaris(jabatanId,modul){
  return DB.hak_akses.find(x=>x.jabatan_id===jabatanId&&x.modul===modul)
      || {jabatan_id:jabatanId,modul,lihat:false,tambah:false,ubah:false,hapus:false};
}
async function setIzin(modul,aksi,nilai){
  const lama=izinBaris(AKSES_JBT,modul);
  const baru={...lama,id:lama.id||uid(),[aksi]:nilai};
  if(nilai&&aksi!=='lihat') baru.lihat=true;              // tidak bisa mengubah tanpa melihat
  if(!nilai&&aksi==='lihat'){ baru.tambah=false; baru.ubah=false; baru.hapus=false; }
  const hasil=await simpan('hak_akses',baru);
  if(!hasil) return;
  render(); toast('Izin '+modul+' diperbarui');
}
async function terapkanPreset(jenis){
  for(const [m] of MODUL){
    const lama=izinBaris(AKSES_JBT,m);
    const nilai = jenis==='penuh' ? {lihat:true,tambah:true,ubah:true,hapus:true}
                : jenis==='baca'  ? {lihat:true,tambah:false,ubah:false,hapus:false}
                :                   {lihat:false,tambah:false,ubah:false,hapus:false};
    await simpan('hak_akses',{...lama,id:lama.id||uid(),jabatan_id:AKSES_JBT,modul:m,...nilai});
  }
  render(); toast('Izin jabatan diperbarui');
}
async function setLingkup(jabatanId,nilai){
  const j=get('jabatan',jabatanId);
  const hasil=await simpan('jabatan',{...j,lingkup:nilai});
  if(!hasil) return;
  render(); toast('Lingkup '+j.nama+' menjadi '+nilai);
}

  const terapis=DB.karyawan.filter(k=>k.role==='terapis'&&k.status==='aktif'&&dalamLingkup(k,'karyawan'));
  const idTerapis=new Set(terapis.map(k=>k.id));

  /* Siapa saja yang libur pada satu tanggal */
  const liburPada=(tanggal)=>{
    const hasil=[];
    (DB.libur||[]).forEach(l=>{
      const mulai=String(l.tanggal||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(mulai)) return;
      let akhir=String(l.tgl_selesai||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(akhir)||akhir<mulai) akhir=mulai;
      if(tanggal<mulai||tanggal>akhir) return;
      if(l.cabang_id&&l.cabang_id!==ME.cabang_id&&lingkupSaya()!=='semua') return;
      if(l.karyawan_id){
        if(idTerapis.has(l.karyawan_id)) hasil.push({nama:nm('karyawan',l.karyawan_id),l});
      }else{
        terapis.filter(k=>!l.cabang_id||k.cabang_id===l.cabang_id)
          .forEach(k=>hasil.push({nama:k.nama,l}));
      }
    });
    return hasil;
  };

  const tigaHari=[
    ['Hari ini', today()],
    ['Besok',    geser(1)],
    ['Lusa',     geser(2)]
  ].map(([label,tgl_])=>{
    const orang=liburPada(tgl_);
    const hari=new Date(tgl_+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'});
    return `<div class="libur-hari ${orang.length?'ada':''}">
      <div class="kepala"><strong>${label}</strong><span class="hint">${hari}</span></div>
      ${orang.length
        ? `<div class="orang">${orang.map(o=>
            `<span class="nama-libur">${esc(o.nama)}${o.l.keterangan?`<i>${esc(o.l.keterangan)}</i>`:''}</span>`).join('')}</div>`
        : '<p class="hint" style="margin:0">Semua terapis masuk</p>'}
    </div>`;
  }).join('');

  /* Rekap sebulan penuh, dikelompokkan per terapis */
  const per=periode();
  const [thn,bln]=per.split('-').map(Number);
  const jmlHari=new Date(thn,bln,0).getDate();
  const rekap=terapis.map(k=>{
    const tanggal=[];
    for(let d=1; d<=jmlHari; d++){
      const tglIni=`${thn}-${String(bln).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(liburPada(tglIni).some(o=>o.nama===k.nama)) tanggal.push({d,tglIni});
    }
    return {nama:k.nama,tanggal};
  }).filter(r=>r.tanggal.length);

  const namaBulan=new Date(thn,bln-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  const singkat=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

  return `<div class="card" style="margin-top:14px">
    <div class="head"><h3>Jadwal libur terapis</h3>
      <span class="tag info">${esc(lingkupSaya()==='semua'?'Semua cabang':nm('cabang',ME.cabang_id))}</span></div>

/* ---------- Diskon dibagikan ke tiap layanan ----------
   Pos berharga manual seperti transport tidak ikut dipotong.
   Mengembalikan daftar {harga, diskon, subtotal} sejajar dengan barisnya. */
function sebarDiskon(baris, diskon){
  const nilai=baris.map(b=>Number(b.harga||0));
  const bisa=baris.map(b=>{const l=get('layanan',b.layanan_id)||{}; return !l.harga_manual;});
  const dasar=nilai.reduce((a,v,i)=>a+(bisa[i]?v:0),0);
  let sisa=Math.min(Number(diskon||0), dasar);
  const total=sisa;
  const terakhir=bisa.lastIndexOf(true);

  return baris.map((b,i)=>{
    if(!bisa[i]||dasar<=0) return {harga:nilai[i],diskon:0,subtotal:nilai[i]};
    let bagian;
    if(i===terakhir){ bagian=sisa; }
    else { bagian=Math.round(total*nilai[i]/dasar); sisa-=bagian; }
    return {harga:nilai[i],diskon:bagian,subtotal:Math.max(0,nilai[i]-bagian)};
  });
}

/* Komisi seorang terapis untuk sebuah layanan, mengikuti skema gajinya.
   Imbalan tetap per orderan menang atas persentase. */
function komisiUntuk(karyawanId, layanan, diskon){
  const k=get('karyawan',karyawanId); if(!k||!layanan) return 0;
  if(layanan.butuh_terapis===false) return 0;
  const s=skemaKaryawan(k);
  if(s.fee>0) return Math.round(s.fee);
  const persen=s.persen||Number(layanan.komisi_persen||0);
  // dasar komisi adalah harga bersih setelah diskon
  const dasar=Math.max(0,Number(layanan.harga||0)-Number(diskon||0));
  return Math.round(dasar*persen/100);
}

  const peta={};

/* ===================== PENGGAJIAN =====================
   Satu rumus untuk tampilan realtime dan slip yang disimpan, sama dengan
   fungsi generate_gaji di database.

   Bulan berjalan: komponen bulanan (gaji pokok, tunjangan, service motor,
   BPJS) dihitung sebanding jatah hari kerja yang sudah lewat. Akhir bulan
   hasilnya penuh. */

/* Jatah hari kerja yang sudah lewat pada periode itu */
function jatahHariKerja(per, hk, tanggal){
  const t=tanggal||today();
  const [y,m]=per.split('-').map(Number);
  const awalP=`${per}-01`;
  const akhirP=tglLokal(new Date(y,m,0));
  if(t>akhirP) return hk;
  if(t<awalP) return 0;
  const jmlHari=new Date(y,m,0).getDate();
  const tgl_=Number(t.slice(8,10));
  return Math.min(hk, Math.round(hk*tgl_/jmlHari));
}

/* Periode sebuah pekerjaan: bulan saat selesai dikerjakan */

  const p=get('pesanan',i.pesanan_id)||{};
  return String(i.jam_selesai?tglLokal(new Date(i.jam_selesai)):(p.tgl_kerja||p.tanggal||'')).slice(0,7);
}

  const kom=kerja.reduce((a,i)=>{
    const c=DB.komisi.find(x=>(x.pesanan_item_id||x.item_id)===i.id);
    return a+Number(c?c.nominal:(i.komisi||0));
  },0);
  const bon=sum(DB.bonus.filter(b=>b.karyawan_id===k.id&&b.periode===per&&b.status==='disetujui'),'nominal');
  const ksb=sum(DB.kasbon.filter(x=>x.karyawan_id===k.id&&x.status==='disetujui'&&Number(x.sisa)>0),'cicilan');

  const tunj=Math.round(s.tunjangan*rasio);
  const um=s.uangMakan*efektif;

  let bonusTarget=0;
  if(s.bonusT2Order>0&&nOrder>=s.bonusT2Order)      bonusTarget=s.bonusT2Nominal;
  else if(s.bonusT1Order>0&&nOrder>=s.bonusT1Order) bonusTarget=s.bonusT1Nominal;
  const bonusTetap=efektif>0?Math.round((s.bonusMotor+s.bonusBpjs)*rasio):0;

  let pokok=0, upah=0, pot=0;
  if(s.tipe==='harian'){ upah=s.harian*efektif; }
  else if(s.tipe==='training'){
    pokok=Math.round(s.pokok*rasio); upah=s.harian*efektif;
    pot=Math.max(0,s.potongan*(jatah-efektif));
  }else{
    pokok=Math.round(s.pokok*rasio);
    pot=HK?Math.round(s.pokok/HK)*Math.max(0,jatah-efektif):0;
  }

  const hitung=pokok+upah+tunj+um+kom+bon+bonusTarget+bonusTetap-pot;
  const minimal=s.minimal>0&&HK?Math.round(s.minimal*efektif/HK):0;
  const sesuai=Math.max(0,minimal-hitung);
  const total=Math.max(0,Math.max(hitung,minimal)-ksb);

  return {k, s, ada:s.ada!==false, HK, jatah, efektif, nOrder,
    pokok, upah, tunj, um, kom, bon, bonusTarget, bonusTetap,
    pot, ksb, minimal, sesuai, total};
}

/* ===================== GAJI CUSTOMER SERVICE =====================
   Pokok + bonus per order + bonus target (bertingkat) + persen omzet
   progresif. Hanya bagian omzet di tingkat itu yang kena persen lebih tinggi. */
function bonusOmzet(omzet, s){
  if(omzet<=0) return {nilai:0,rinci:[]};
  const r=[];
  if(!s.t1Batas){ const v=Math.round(omzet*s.t1Persen/100); return {nilai:v,rinci:[[s.t1Persen,omzet,v]]}; }
  const t1=Math.min(omzet,s.t1Batas); r.push([s.t1Persen,t1,t1*s.t1Persen/100]);
  if(omzet>s.t1Batas){
    if(s.t2Batas>s.t1Batas){
      const t2=Math.min(omzet,s.t2Batas)-s.t1Batas; r.push([s.t2Persen,t2,t2*s.t2Persen/100]);
      if(omzet>s.t2Batas){ const t3=omzet-s.t2Batas; r.push([s.t3Persen,t3,t3*s.t3Persen/100]); }
    }else{ const t2=omzet-s.t1Batas; r.push([s.t2Persen,t2,t2*s.t2Persen/100]); }
  }
  return {nilai:Math.round(r.reduce((a,x)=>a+x[2],0)), rinci:r.filter(x=>x[1]>0)};
}
const jt=n=>{ const v=n/1e6; return (Number.isInteger(v)?String(v):v.toFixed(1).replace('.',','))+' jt'; };

function hitungCS(k, per, tanggal){
  const s=skemaKaryawan(k), HK=s.hariKerja||26;
  const jatah=jatahHariKerja(per,HK,tanggal), rasio=HK?jatah/HK:0;
  const order=DB.pesanan.filter(p=>['selesai','complete'].includes(p.status)
    &&String(p.tgl_kerja||p.tanggal).slice(0,7)===per
    &&(s.dasarCs==='cabang'?p.cabang_id===k.cabang_id:p.kasir_id===k.id));
  const n=order.length, omzet=sum(order,'total');

  const pokok=Math.round(s.pokok*rasio);
  const bonusOrder=s.feeOrderCs*n;

  // target: bertingkat berarti ditambahkan, bukan menggantikan
  const tgt=[[s.bonusT1Order,s.bonusT1Nominal],[s.bonusT2Order,s.bonusT2Nominal]].filter(x=>x[0]>0);
  let bonusTarget=0;
  if(s.bertingkat) tgt.forEach(([o,v])=>{ if(n>=o) bonusTarget+=v; });
  else { const capai=tgt.filter(([o])=>n>=o).pop(); bonusTarget=capai?capai[1]:0; }
  const berikut=tgt.find(([o])=>n<o);

  const om=bonusOmzet(omzet,s);
  // tingkat omzet berikutnya
  let tingkatBerikut=null;
  if(s.t1Batas&&omzet<s.t1Batas&&s.t2Persen) tingkatBerikut=[s.t1Batas-omzet,s.t2Persen];
  else if(s.t2Batas&&omzet<s.t2Batas&&s.t3Persen) tingkatBerikut=[s.t2Batas-omzet,s.t3Persen];

  const bonusKinerja=sum(DB.bonus.filter(b=>b.karyawan_id===k.id&&b.periode===per
    &&b.status==='disetujui'&&b.jenis==='kinerja'),'nominal');
  const bonLain=sum(DB.bonus.filter(b=>b.karyawan_id===k.id&&b.periode===per
    &&b.status==='disetujui'&&b.jenis!=='kinerja'),'nominal');
  const tunj=Math.round(s.tunjangan*rasio);
  const tetap=Math.round((s.bonusMotor+s.bonusBpjs)*rasio);
  const ksb=sum(DB.kasbon.filter(x=>x.karyawan_id===k.id&&x.status==='disetujui'&&Number(x.sisa)>0),'cicilan');

  const total=Math.max(0,pokok+bonusOrder+bonusTarget+om.nilai+bonusKinerja+bonLain+tunj+tetap-ksb);
  return {k,s,HK,jatah,n,omzet,pokok,bonusOrder,bonusTarget,berikut,om,tingkatBerikut,
    bonusKinerja,bonLain,tunj,tetap,ksb,total,persenOmzet:omzet?total/omzet*100:0};
}

/* Kartu rincian gaji CS, dipakai di menu Jabatan dan beranda CS */
function kartuGajiCS(k, per){
  const c=hitungCS(k,per), s=c.s;
  const baris=(l,v,ket,neg)=>`<div class="baris-gaji"><div><span>${l}</span>${ket?`<em>${ket}</em>`:''}</div>
    <b class="${neg?'neg':''}">${neg?'− ':''}${rp(v)}</b></div>`;
  const ketTarget=c.bonusTarget?`target ${[s.bonusT1Order,s.bonusT2Order].filter(o=>o&&c.n>=o).join(' & ')} order tercapai`
    :(c.berikut?`belum capai target ${c.berikut[0]} order`:'');
  const saran=[];
  if(c.berikut) saran.push(`Kurang <b>${c.berikut[0]-c.n} order</b> lagi untuk bonus target ${rp(c.berikut[1])}.`);
  if(c.tingkatBerikut) saran.push(`Kurang <b>${rp(c.tingkatBerikut[0])}</b> omzet lagi untuk naik ke tingkat ${c.tingkatBerikut[1]}%.`);
  const progres=c.berikut?Math.min(100,Math.round(c.n/c.berikut[0]*100)):100;

  return `<div class="kartu-gaji-cs">
    <div class="atas"><div><strong>${esc(k.nama)}</strong>
      <div class="hint">${esc(nm('cabang',k.cabang_id))} · ${c.n} order · omzet ${rp(c.omzet)}</div></div>
      <div style="text-align:right"><div class="total">${rp(c.total)}</div>
        <div class="hint">${c.persenOmzet?c.persenOmzet.toFixed(1)+'% dari omzet':'belum ada omzet'}</div></div></div>
    <div class="progres"><i style="width:${progres}%"></i></div>
    <div class="hint" style="margin:-4px 0 8px">${c.berikut?`${c.n} dari ${c.berikut[0]} order menuju target berikutnya`:'semua target order tercapai'}</div>
    ${baris('Gaji pokok',c.pokok,c.jatah<c.HK?`${c.jatah}/${c.HK} hari kerja berjalan`:'')}
    ${baris(`Bonus order (${c.n} × ${rp(s.feeOrderCs)})`,c.bonusOrder)}
    ${baris('Bonus target order',c.bonusTarget,ketTarget)}
    ${baris(`Bonus omzet (${jt(c.omzet)})`,c.om.nilai,c.om.rinci.map(([p,v])=>`${p}%×${jt(v)}`).join(' + '))}
    ${baris('Bonus kinerja',c.bonusKinerja,c.bonusKinerja?'diberikan':`jika capai · ${rp(s.bonusKinerja)}`)}
    ${c.bonLain?baris('Bonus lain',c.bonLain):''}
    ${c.tunj?baris('Tunjangan',c.tunj):''}
    ${c.ksb?baris('Cicilan kasbon',c.ksb,'',true):''}
    <div class="baris-gaji total"><span>Total gaji CS</span><b>${rp(c.total)}</b></div>
    ${saran.length?`<div class="saran">${saran.join('<br>')}</div>`:''}
    ${!c.bonusKinerja&&s.bonusKinerja&&boleh('bonus','tambah')
      ?`<button class="btn ghost sm" style="margin-top:10px" onclick="beriBonusKinerja('${k.id}','${per}')">
          Beri bonus kinerja ${rp(s.bonusKinerja)}</button>`:''}
  </div>`;
}

function segarkanLayanan(){
  const cab=document.getElementById('o_cab').value||ME.cabang_id;
  const sel=document.getElementById('o_pilihLay');
  const daftar=layananCabang(cab);
  sel.innerHTML=daftar.map(l=>`<option value="${l.id}">${esc(l.nama)}${

    ||'<option value="">Belum ada layanan untuk cabang ini</option>';

function tambahBaris(){
  const id=document.getElementById('o_pilihLay').value;

  ORD.baris.push({layanan_id:id, harga:l.harga_manual?0:Number(l.harga||0),

  gambarBaris(); hitungOrder();
}
function hapusBaris(i){ ORD.baris.splice(i,1); gambarBaris(); hitungOrder(); }
function ubahBaris(i,kunci,nilai){

function hitungOrder(){
  const kotak=document.getElementById('o_total'); if(!kotak) return;
  const disk=Number(document.getElementById('o_disk')?.value)||0;
  const sub=ORD.baris.reduce((a,b)=>a+Number(b.harga||0),0);
  const total=Math.max(0,sub-disk);
  const kosong=ORD.baris.filter(b=>{
    const l=get('layanan',b.layanan_id)||{};
    return (l.butuh_terapis!==false && !b.terapis_id) || (l.harga_manual && !b.harga);
  }).length;

  const bagian=sebarDiskon(ORD.baris,disk);
  kotak.innerHTML=`
    ${ORD.baris.map((b,i)=>{const l=get('layanan',b.layanan_id)||{}; const g=bagian[i];
      return `<div class="row" style="justify-content:space-between;gap:10px;font-size:13px;padding:3px 0">
        <span class="hint" style="min-width:0">${esc(l.nama||'-')}${b.terapis_id?' · '+esc(nm('karyawan',b.terapis_id)):''}
          ${g.diskon?`<br><span style="color:var(--bad)">diskon ${rp(g.diskon)} → bersih ${rp(g.subtotal)}</span>`:''}</span>
        <span class="rp">${rp(g.harga)}</span></div>`}).join('')
      ||'<p class="hint">Belum ada layanan.</p>'}
    ${disk?`<div class="row" style="justify-content:space-between"><span class="hint">Diskon</span>
      <span class="rp" style="color:var(--bad)">− ${rp(disk)}</span></div>`:''}
    <div class="row" style="justify-content:space-between;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px">
      <strong>Total</strong><strong class="rp" style="font-size:17px">${rp(total)}</strong></div>
    ${disk?`<p class="hint" style="margin-top:7px">Diskon dibagi ke tiap layanan secara sebanding.

/* nama cocok -> isi kontak, alamat, dan tiru order terakhirnya */
function cekPelanggan(){
  const nama=document.getElementById('o_nama').value.trim().toLowerCase();
  const info=document.getElementById('o_infoPel');
  const p=DB.pelanggan.find(x=>String(x.nama||'').toLowerCase()===nama);
  if(!p){
    ORD.pelanggan_id=null;
    info.innerHTML=nama?'Nama baru — akan disimpan sebagai pelanggan baru.':'Pelanggan baru akan langsung disimpan ke daftar.';
    return;
  }
  ORD.pelanggan_id=p.id;
  document.getElementById('o_hp').value=p.telepon||'';
  document.getElementById('o_alamat').value=p.alamat||'';

  const lama=DB.pesanan.filter(o=>o.pelanggan_id===p.id)
    .sort((a,b)=>String(b.tanggal+(b.jam||'')).localeCompare(String(a.tanggal+(a.jam||''))))[0];
  let jejak='';
  if(lama){
    const item=DB.item.filter(i=>i.pesanan_id===lama.id);
    const tersedia=layananCabang(document.getElementById('o_cab').value||ME.cabang_id);
    if(item.length){
      ORD.baris=item.filter(i=>tersedia.some(l=>l.id===i.layanan_id)).map(i=>({
        layanan_id:i.layanan_id, harga:Number(i.harga||0),
        terapis_id:opsiRef('karyawan').some(k=>k.id===i.terapis_id)?i.terapis_id:null,
        catatan:i.catatan||''}));
      if(item[0].ruangan) document.getElementById('o_room').value=item[0].ruangan;
      gambarBaris();
    }
    const rLama=rekeningOrder(lama); if(rLama) document.getElementById('o_bayar').value=rLama.id;
    if(lama.catatan) document.getElementById('o_cat').value=lama.catatan;
    jejak=` · order terakhir ${tgl(lama.tgl_kerja||lama.tanggal)}: ${esc(DB.item.filter(i=>i.pesanan_id===lama.id).map(i=>nm('layanan',i.layanan_id)).join(', '))}`;
  }
  info.innerHTML=`<span class="tag ok">Pelanggan lama</span> ${p.total_kunjungan||0} kunjungan${jejak}
    ${p.catatan?`<br>Catatan terapi: ${esc(p.catatan)}`:''}`;
  hitungOrder();
}

async function simpanOrder(){
  const nama=document.getElementById('o_nama').value.trim();
  if(!nama) return toast('Isi nama pelanggan dulu');
  if(!ORD.baris.length) return toast('Tambahkan minimal satu layanan');

  for(const b of ORD.baris){
    const l=get('layanan',b.layanan_id)||{};
    if(l.butuh_terapis!==false && !b.terapis_id) return toast('Pilih terapis untuk '+(l.nama||'layanan'));
    if(l.harga_manual && !Number(b.harga)) return toast('Isi nominal untuk '+(l.nama||'layanan'));
  }

  const btn=document.getElementById('o_simpan'); btn.disabled=true; btn.textContent='Menyimpan…';
  const hp=document.getElementById('o_hp').value.trim();
  const alamat=document.getElementById('o_alamat').value.trim();

  let pel=ORD.pelanggan_id?get('pelanggan',ORD.pelanggan_id):null;
  if(!pel){
    pel=await simpan('pelanggan',{id:uid(),kode:'P-'+String(DB.pelanggan.length+1).padStart(4,'0'),
      nama,telepon:hp,alamat,member:false,poin:0,total_kunjungan:0});
    if(!pel){ btn.disabled=false; btn.textContent='Simpan order'; return; }
  }else if(hp!==pel.telepon||alamat!==pel.alamat){
    pel=await simpan('pelanggan',{...pel,telepon:hp,alamat})||pel;
  }

  const disk=Number(document.getElementById('o_disk').value)||0;
  const cab=get('cabang',document.getElementById('o_cab').value||ME.cabang_id);
  const sub=ORD.baris.reduce((a,b)=>a+Number(b.harga||0),0);
  const n=DB.pesanan.filter(p=>String(p.tanggal).slice(0,10)===today()).length+1;

  const p={id:uid(),nomor:'MHR-'+cab.kode+'-'+today().slice(2).replace(/-/g,'')+'-'+String(n).padStart(4,'0'),
    tanggal:today(),
    tgl_kerja:document.getElementById('o_tglkerja').value||today(),
    jam:document.getElementById('o_jam').value||jam(),
    jam_kerja:document.getElementById('o_jam').value||jam(),
    cabang_id:cab.id,pelanggan_id:pel.id,kasir_id:ME.id,status:'dijadwalkan',
    subtotal:sub,diskon:disk,total:Math.max(0,sub-disk),
    rekening_id:document.getElementById('o_bayar').value,
    metode_bayar:metodeDari(document.getElementById('o_bayar').value),status_bayar:'belum',
    catatan:document.getElementById('o_cat').value};
  const tersimpan=await simpan('pesanan',p);
  if(!tersimpan){ btn.disabled=false; btn.textContent='Simpan order'; return; }

  const ruangan=document.getElementById('o_room').value;
  const bagian=sebarDiskon(ORD.baris,disk);
  let berhasil=0; const galat=[];
  for(let i=0;i<ORD.baris.length;i++){
    const b=ORD.baris[i], g=bagian[i], l=get('layanan',b.layanan_id)||{};
    const hasil=await simpanItem({id:uid(),pesanan_id:p.id,layanan_id:b.layanan_id,
      terapis_id:b.terapis_id||null,ruangan,qty:1,
      harga:g.harga,diskon:g.diskon,subtotal:g.subtotal,durasi:l.durasi_menit||0,
      komisi:b.terapis_id?komisiUntuk(b.terapis_id,{...l,harga:g.subtotal},0):0,
      catatan:b.catatan||null,status:'menunggu'});
    if(hasil) berhasil++; else galat.push(l.nama||'layanan');
  }

  if(!berhasil){
    // order tanpa satu pun pekerjaan tidak ada gunanya, jadi dibatalkan
    await hapus('pesanan',p.id);
    btn.disabled=false; btn.textContent='Simpan order';
    return toast('Layanan gagal disimpan, order dibatalkan. Periksa hak akses Anda.');
  }
  if(galat.length) toast('Sebagian layanan gagal disimpan: '+galat.join(', '));

  render(); kirimOrder(p.id);
  toast('Order '+p.nomor+' dibuat');
}

const GARIS = '━━━━━━━━━━━━━━━';

function baris(label, nilai){ return nilai ? `*${label}*\n${nilai}` : null; }

function rincianOrder(p, {denganHp}){
  const item = DB.item.filter(i => i.pesanan_id === p.id);
  const pel  = get('pelanggan', p.pelanggan_id) || {};
  const jam  = String(p.jam_kerja || p.jam || '').slice(0,5);

  // tiap layanan satu baris, lengkap dengan terapis dan keterangannya
  const daftar = item.map(i => {
    const l = get('layanan', i.layanan_id) || {};
    let s = `• ${l.nama || '-'}`;
    if (l.durasi_menit) s += ` (${l.durasi_menit} menit)`;
    if (i.terapis_id)   s += `\n   Terapis: ${nm('karyawan', i.terapis_id)}`;
    if (i.catatan)      s += `\n   ${i.catatan}`;
    s += Number(i.diskon) > 0
      ? `\n   ${rp(i.harga)} − diskon ${rp(i.diskon)} = ${rp(i.subtotal)}`
      : `\n   ${rp(i.harga)}`;
    return s;
  }).join('\n');

  return [
    baris('Jadwal', hariLengkap(p.tgl_kerja || p.tanggal) + (jam ? `\nPukul ${jam} WIB` : '')),
    baris(item.length > 1 ? 'Layanan' : 'Layanan', daftar),
    baris('Atas nama', pel.nama + (denganHp && pel.telepon ? `\n${pel.telepon}` : '')),
    baris('Alamat', pel.alamat),
    baris('Catatan', p.catatan)
  ].filter(Boolean).join('\n\n');
}

function pesanPelanggan(p){
  const pel  = get('pelanggan', p.pelanggan_id) || {};
  const item = DB.item.filter(i => i.pesanan_id === p.id);

  const bagian = [];
  bagian.push(`Halo *${pel.nama}*, terima kasih sudah memesan di *Mahyra Massage*.`);

  bagian.push(GARIS);

  bagian.push(rincianOrder(p, {denganHp: true}));
  bagian.push(GARIS);

  // biaya, dirinci per layanan lalu diskon sebagai baris tersendiri
  const kotor = item.reduce((a, i) => a + Number(i.harga || 0), 0);

  biaya.push(`*Total bayar   ${rp(p.total)}*`);

  if (potongan > 0) bagian.push(`Anda hemat ${rp(potongan)} pada pesanan ini.`);
  bagian.push(GARIS);

  // pembayaran: rekening yang dipilih kasir
  const rek = rekeningOrder(p);
  if (rek && rek.jenis === 'bank') {
    bagian.push(`*PEMBAYARAN*\nTransfer ke rekening berikut:\n\n` +
      `*${rek.nama}*\n${rek.nomor || '-'}\na.n. ${rek.atas_nama || REKENING.nama}\n\n` +
      `Mohon kirimkan bukti transfer setelah pembayaran.`);

    const bank = daftarRekening().filter(r => r.jenis === 'bank');

    `Mohon siapkan ruang kurang lebih 2×2 meter.\n\n` +
    `Terima kasih atas kepercayaan Anda.`);

function pesanTerapis(p, terapisId){
  const milikku = DB.item.filter(i => i.pesanan_id === p.id && i.terapis_id === terapisId);
  const item = milikku[0];
  const bagian = [];

/* Nomor lokal 08xx diubah ke format internasional 62xx */
const noWa = n => {
  let s = String(n||'').replace(/[^0-9]/g,'');
  if (s.startsWith('0')) s = '62' + s.slice(1);
  else if (s.startsWith('8')) s = '62' + s;
  return s;
};
function tautanWa(nomor,pesan){
  return 'https://wa.me/'+noWa(nomor)+'?text='+encodeURIComponent(pesan);
}

/* Tampilan kartu untuk layar kecil */

/* ---------- Urutan daftar order ----------
   Yang masih perlu ditangani muncul lebih dulu:
     1. hari ini, lalu tanggal terdekat
     2. dalam satu hari, jam paling malam di atas
     3. yang butuh tindakan sebelum yang sudah tuntas
   Order complete dan batal turun ke bawah. */
function bobotOrder(p){
  if(p.status==='batal')      return 5;
  if(p.status==='complete')   return 4;
  if(p.status==='selesai')    return 3;   // tinggal menagih atau menunggu finance
  if(p.status==='dikerjakan') return 2;
  if(p.status==='dijadwalkan')return 1;
  return 3;
}
function urutanOrder(a,b){
  const ta=String(a.tgl_kerja||a.tanggal).slice(0,10);
  const tb=String(b.tgl_kerja||b.tanggal).slice(0,10);
  const hariIni=today();

  // hari ini paling atas, lalu tanggal lain diurutkan dari yang terbaru
  const kelA = ta===hariIni?0:1, kelB = tb===hariIni?0:1;
  if(kelA!==kelB) return kelA-kelB;

  // dalam kelompok hari ini: yang masih perlu ditangani lebih dulu
  if(kelA===0){
    const wa=bobotOrder(a), wb=bobotOrder(b);
    if(wa!==wb) return wa-wb;
  }else if(ta!==tb){
    return tb.localeCompare(ta);
  }

  // jam paling malam di atas
  const ja=String(a.jam_kerja||a.jam||'00:00').slice(0,5);
  const jb=String(b.jam_kerja||b.jam||'00:00').slice(0,5);
  if(ja!==jb) return jb.localeCompare(ja);

  return bobotOrder(a)-bobotOrder(b);
}

async function putuskanAudit(pesananId, keputusan){
  const p=get('pesanan',pesananId); if(!p) return;
  const catatan=keputusan==='ditolak'?(document.getElementById('au_alasan')?.value||'').trim():'';
  if(keputusan==='ditolak'&&!catatan) return toast('Tulis alasan penolakannya');
  if(keputusan==='disetujui'&&p.status_bayar!=='lunas') return toast('Order belum dibayar');

  if(LIVE){
    const {data,error}=await sb.rpc('audit_order',{p_pesanan:pesananId,p_keputusan:keputusan,p_catatan:catatan||null});
    if(error) return toast(error.message);
    const i=DB.pesanan.findIndex(x=>x.id===pesananId);
    if(i>=0&&data) DB.pesanan[i]=data;
  }else{
    const baru={...p,audit_status:keputusan,
      audit_oleh:keputusan==='belum'?null:ME.id,
      audit_waktu:keputusan==='belum'?null:new Date().toISOString(),
      audit_catatan:catatan||null};
    baru.status=statusAkhir(baru, p.status==='complete'?'selesai':p.status);
    await simpanSebagian('pesanan',pesananId,baru);
  }
  closeModal(); render();
  const q=get('pesanan',pesananId);
  toast(keputusan==='disetujui'
    ? (q.status==='complete'?'Disetujui. Order menjadi complete.':'Disetujui. Order menjadi complete setelah pengerjaan selesai.')
    : keputusan==='ditolak'?'Order ditolak dan dikembalikan ke kasir':'Keputusan audit dibatalkan');
}

/* Gambar dikecilkan sebelum disimpan supaya ringan */
function pilihBukti(input,pesananId){
  const berkas=input.files&&input.files[0]; if(!berkas) return;
  const kotak=document.getElementById('kotakUnggah');
  if(kotak) kotak.innerHTML='<strong>Memproses gambar…</strong>';

  const baca=new FileReader();
  baca.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const lebar=Math.min(900,img.width);
      const tinggi=Math.round(img.height/img.width*lebar);
      const c=document.createElement('canvas'); c.width=lebar; c.height=tinggi;
      c.getContext('2d').drawImage(img,0,0,lebar,tinggi);
      simpanBukti(pesananId, c.toDataURL('image/jpeg',0.6));
    };
    img.onerror=()=>toast('Berkas itu bukan gambar yang bisa dibaca');
    img.src=e.target.result;
  };
  baca.readAsDataURL(berkas);
}

async function simpanBukti(pesananId,gambar){
  const p=get('pesanan',pesananId);
  const rek=document.getElementById('b_metode')?.value||rekeningOrder(p)?.id;
  // bukti baru berarti finance perlu memeriksa lagi
  const hasil=await simpanSebagian('pesanan',pesananId,{
    bukti_bayar:gambar, rekening_id:rek, metode_bayar:metodeDari(rek),
    status_bayar:'lunas', tgl_bayar:new Date().toISOString(), alasan_batal:null,
    audit_status:'belum', audit_waktu:null,
    status: statusAkhir({...p,status_bayar:'lunas',audit_status:'belum'})});
  if(!hasil) return;
  if(!LIVE) await catatKasDemo(hasil);
  render();
  formBayar(pesananId);          // buka lagi agar tombol kirim bukti muncul
  toast('Bukti tersimpan. Pembayaran ditandai lunas.');
}

async function batalBayar(pesananId){

async function simpanTarifKm(){
  const n=Number(document.getElementById('set_tarifkm')?.value)||0;
  if(n<=0) return toast('Isi tarif per kilometer');
  const lama=(DB.pengaturan||[])[0];
  const hasil=lama
    ? await simpanSebagian('pengaturan',lama.id,{tarif_transport_km:n})
    : await simpan('pengaturan',{id:uid(),tarif_transport_km:n});
  if(!hasil) return;
  render(); toast('Tarif transport disimpan: '+rp(n)+' per kilometer');
}

/* Tarif transport per kilometer. Ubah di Profil Usaha bila berubah. */
function tarifKm(){
  const n=Number((DB.pengaturan||[])[0]?.tarif_transport_km);
  return n>0?n:1300;
}

/* Isian menyesuaikan jenis bonus: transport cukup diisi jaraknya */
function ubahJenisBonus(){
  const jenis=document.getElementById('b_jenis')?.value;
  const kotak=document.getElementById('b_isian'); if(!kotak) return;

  if(jenis==='transport'){
    kotak.innerHTML=`<div class="grid g2">
      <div class="field"><label for="b_km">Jarak tempuh (kilometer)</label>
        <input type="number" id="b_km" step="0.1" min="0" placeholder="2" oninput="hitungTransport()"></div>
      <div class="field"><label>Nominal per terapis</label>
        <input id="b_nominal" type="number" readonly></div>
    </div>
    <p class="hint" id="b_hitung" style="margin:-4px 0 14px">
      Tarif ${rp(tarifKm())} per kilometer. Isi jaraknya, nominalnya dihitung sendiri.</p>`;
    hitungTransport();
  }else{
    kotak.innerHTML=`<div class="field"><label for="b_nominal">Nominal per terapis</label>
      <input type="number" id="b_nominal" placeholder="50000"></div>`;
  }
}

function hitungTransport(){
  const km=Number(document.getElementById('b_km')?.value)||0;
  const nominal=Math.round(km*tarifKm());
  const isi=document.getElementById('b_nominal');
  if(isi) isi.value=nominal||'';
  const ket=document.getElementById('b_hitung');
  if(ket) ket.innerHTML=km
    ? `${km} km × ${rp(tarifKm())} = <strong class="rp">${rp(nominal)}</strong> untuk tiap terapis yang dipilih.`
    : `Tarif ${rp(tarifKm())} per kilometer. Isi jaraknya, nominalnya dihitung sendiri.`;
}

function gambarTerapisBonus(pesananId){
  const item=DB.item.filter(i=>i.pesanan_id===pesananId);
  const kotak=document.getElementById('b_terapis');
  const semua=item.length>1&&BON.terapis.length===item.length;
  kotak.innerHTML=`<div class="row">
    ${item.length>1?`<button type="button" class="btn ${semua?'':'ghost'} sm" style="border-radius:999px"
       onclick="pilihSemuaBonus('${pesananId}')">${semua?'✓ ':''}Semua terapis</button>`:''}
    ${item.map(i=>{const on=BON.terapis.includes(i.terapis_id);
      return `<button type="button" class="btn ${on?'':'ghost'} sm" style="border-radius:999px"
        onclick="pilihTerapisBonus('${i.terapis_id}','${pesananId}')">${on?'✓ ':''}${esc(nm('karyawan',i.terapis_id))}</button>`;
    }).join('')}</div>`;
}
function pilihTerapisBonus(id,pesananId){
  BON.terapis = BON.terapis.includes(id) ? BON.terapis.filter(x=>x!==id) : [...BON.terapis,id];
  gambarTerapisBonus(pesananId);
}
function pilihSemuaBonus(pesananId){
  const item=DB.item.filter(i=>i.pesanan_id===pesananId);
  BON.terapis = BON.terapis.length===item.length ? [] : item.map(i=>i.terapis_id);
  gambarTerapisBonus(pesananId);
}

          `<option value="${j}" ${b.jenis===j?'selected':''}>${cap(j)}</option>`).join('')}</select></div>

    <div class="field"><label for="ub_ket">Keterangan</label>
      <input id="ub_ket" value="${esc(b.deskripsi||'')}"></div>

    {kaki:`<button class="btn" onclick="simpanUbahBonus('${bonusId}','${pesananId}')">Simpan</button>
      <button class="btn ghost" onclick="bonusOrder('${pesananId}')">Batal</button>`});
  ubahJenisBonusEdit();
}
let BONUS_EDIT=null;

/* Isian pada panel ubah bonus, ikut menyesuaikan jenisnya */
function ubahJenisBonusEdit(){
  const jenis=document.getElementById('ub_jenis')?.value;
  const kotak=document.getElementById('ub_isian'); if(!kotak) return;
  const b=BONUS_EDIT||{};

  if(jenis==='transport'){
    const km=Number(b.jarak_km)|| (b.nominal?Math.round(b.nominal/tarifKm()*10)/10:'');
    kotak.innerHTML=`<div class="grid g2">
      <div class="field"><label for="ub_km">Jarak tempuh (kilometer)</label>
        <input type="number" id="ub_km" step="0.1" min="0" value="${km||''}" oninput="hitungTransportEdit()"></div>
      <div class="field"><label>Nominal</label>
        <input id="ub_nominal" type="number" readonly value="${b.nominal||0}"></div>
    </div>
    <p class="hint" id="ub_hitung" style="margin:-4px 0 14px"></p>`;
    hitungTransportEdit();
  }else{
    kotak.innerHTML=`<div class="field"><label for="ub_nominal">Nominal</label>
      <input type="number" id="ub_nominal" value="${b.nominal||0}"></div>`;
  }
}
function hitungTransportEdit(){
  const km=Number(document.getElementById('ub_km')?.value)||0;
  const nominal=Math.round(km*tarifKm());
  const isi=document.getElementById('ub_nominal');
  if(isi) isi.value=nominal||'';
  const ket=document.getElementById('ub_hitung');
  if(ket) ket.innerHTML=km
    ? `${km} km × ${rp(tarifKm())} = <strong class="rp">${rp(nominal)}</strong>`
    : `Tarif ${rp(tarifKm())} per kilometer.`;
}

async function simpanUbahBonus(bonusId,pesananId){
  const nominal=Number(document.getElementById('ub_nominal').value)||0;
  if(!nominal) return toast('Isi nominalnya');
  const jenis=document.getElementById('ub_jenis').value;
  const km=Number(document.getElementById('ub_km')?.value)||0;
  let ket=document.getElementById('ub_ket').value.trim();
  if(!ket&&jenis==='transport'&&km) ket=`Transport ${km} km × ${rp(tarifKm())}`;
  const hasil=await simpanSebagian('bonus',bonusId,{
    jenis, nominal, jarak_km:jenis==='transport'&&km?km:null,
    deskripsi:ket||null});
  if(!hasil) return;
  render(); bonusOrder(pesananId); toast('Bonus diperbarui');
}
async function hapusBonus(bonusId,pesananId){
  const b=get('bonus',bonusId);
  if(b&&b.dibayar) return toast('Bonus ini sudah dibayarkan, tidak bisa dihapus');
  if(!await hapus('bonus',bonusId)) return;
  render(); bonusOrder(pesananId); toast('Bonus dihapus');
}

async function simpanBonusOrder(pesananId){
  const p=get('pesanan',pesananId);
  const nominal=Number(document.getElementById('b_nominal').value)||0;
  if(!nominal) return toast('Isi nominal bonusnya');
  if(!BON.terapis.length) return toast('Pilih minimal satu terapis');
  const btn=document.getElementById('b_simpan'); btn.disabled=true; btn.textContent='Menyimpan…';
  const jenis=document.getElementById('b_jenis').value;
  const km=Number(document.getElementById('b_km')?.value)||0;
  let ket=document.getElementById('b_ket').value.trim();
  if(!ket) ket = jenis==='transport'&&km
    ? `Transport ${km} km × ${rp(tarifKm())}`
    : cap(jenis)+' dari order '+p.nomor;
  let n=0;
  for(const idTer of BON.terapis){
    const item=DB.item.find(i=>i.pesanan_id===p.id&&i.terapis_id===idTer);
    const hasil=await simpan('bonus',{id:uid(),karyawan_id:idTer,pesanan_id:p.id,
      pesanan_item_id:item?.id||null,jenis,periode:String(p.tanggal).slice(0,7),
      deskripsi:ket,nominal,jarak_km:jenis==='transport'&&km?km:null,
      status:'disetujui',dibayar:false,dibuat_oleh:ME.id});
    if(hasil) n++;
  }
  render();
  if(n) bonusOrder(p.id); else closeModal();
  toast(n?`Bonus ${rp(nominal)} diberikan ke ${n} terapis`:'Bonus gagal disimpan');
}

/* Ubah order yang sudah dibuat */
/* ---------- Mengubah isi order yang sudah tersimpan ---------- */

/* Ganti layanan pada sebuah pekerjaan */
async function gantiLayanan(itemId, layananBaru){
  const i=get('item',itemId); if(!i||i.layanan_id===layananBaru) return;
  const l=get('layanan',layananBaru)||{};
  const harga=l.harga_manual?Number(i.harga||0):Number(l.harga||0);
  const hasil=await simpanSebagian('item',itemId,{
    layanan_id:layananBaru, harga, diskon:0, durasi:l.durasi_menit||0,
    terapis_id:l.butuh_terapis===false?null:i.terapis_id,
    komisi:(l.butuh_terapis!==false&&i.terapis_id)?komisiUntuk(i.terapis_id,{...l,harga},0):0});
  if(!hasil) return;
  if(!LIVE){ const x=get('item',itemId); if(x) x.subtotal=harga; }
  await sesuaikanOrder(i.pesanan_id);
  render(); ubahOrder(i.pesanan_id);
  toast('Layanan diganti menjadi '+(l.nama||'-'));
}

/* Ubah nominal sebuah pekerjaan */
async function ubahHargaItem(itemId, pesananId, nilai){
  const i=get('item',itemId); if(!i) return;
  const harga=Number(nilai)||0;
  if(harga===Number(i.harga)) return;
  const l=get('layanan',i.layanan_id)||{};
  const hasil=await simpanSebagian('item',itemId,{harga,
    komisi:i.terapis_id?komisiUntuk(i.terapis_id,{...l,harga},0):0});
  if(!hasil) return;
  if(!LIVE){ const x=get('item',itemId); if(x) x.subtotal=harga; }
  await sesuaikanOrder(pesananId);
  render(); ubahOrder(pesananId);
  toast('Nominal diperbarui');
}

/* Tambah layanan ke order yang sudah tersimpan */
async function tambahItemOrder(pesananId){
  const id=document.getElementById('u_tambahLay')?.value;
  const l=get('layanan',id); if(!l) return toast('Pilih layanan dulu');
  const harga=l.harga_manual?0:Number(l.harga||0);
  const ruangan=DB.item.find(i=>i.pesanan_id===pesananId)?.ruangan||'Rumah pelanggan';
  const hasil=await simpanItem({id:uid(),pesanan_id:pesananId,layanan_id:id,
    terapis_id:null,ruangan,qty:1,harga,diskon:0,
    durasi:l.durasi_menit||0,komisi:0,status:'menunggu'});
  if(!hasil) return;
  await sesuaikanOrder(pesananId);
  render(); ubahOrder(pesananId);
  toast(l.harga_manual?'Layanan ditambahkan. Isi nominalnya.':'Layanan ditambahkan. Pilih terapisnya.');
}

/* Hapus sebuah pekerjaan dari order */
async function hapusItem(itemId, pesananId){
  const sisa=DB.item.filter(i=>i.pesanan_id===pesananId&&i.id!==itemId&&i.status!=='batal');
  if(!sisa.length) return toast('Order harus punya minimal satu layanan');
  const i=get('item',itemId);
  if(i&&i.status==='selesai') return toast('Pekerjaan yang sudah selesai tidak bisa dihapus');
  if(!await hapus('item',itemId)) return;
  await sesuaikanOrder(pesananId);
  render(); ubahOrder(pesananId);
  toast('Layanan dihapus dari order');
}

/* Hitung ulang nilai order setelah isinya berubah */
async function sesuaikanOrder(pesananId){
  const p=get('pesanan',pesananId); if(!p) return;
  const item=DB.item.filter(i=>i.pesanan_id===pesananId&&i.status!=='batal');
  const kotor=item.reduce((a,i)=>a+Number(i.harga||0),0);
  const disk=Math.min(Number(p.diskon||0),kotor);
  await simpanSebagian('pesanan',pesananId,{subtotal:kotor,diskon:disk,total:Math.max(0,kotor-disk)});
  await sebarUlangDiskon(pesananId);
}

/* Mengganti terapis: yang lama diberi tahu bahwa tugasnya dialihkan */
async function gantiTerapis(itemId,terapisBaru){
  const i=get('item',itemId);
  const lama=i.terapis_id;
  if(lama===(terapisBaru||null)) return;
  const l=get('layanan',i.layanan_id)||{};
  const bersih=Math.max(0,Number(i.harga||0)-Number(i.diskon||0));
  const hasil=await simpanSebagian('item',itemId,{terapis_id:terapisBaru||null,
    komisi:terapisBaru?komisiUntuk(terapisBaru,{...l,harga:bersih},0):0});
  if(!hasil) return;
  if(!LIVE){
    const p=get('pesanan',i.pesanan_id)||{};
    const ket=`${l.nama||'Layanan'} untuk ${nm('pelanggan',p.pelanggan_id)}`;
    if(lama) await simpan('notifikasi',{id:uid(),karyawan_id:lama,
      judul:'Orderan dialihkan ke terapis lain',
      pesan:ket+' — tugas ini tidak lagi menjadi bagian Anda.',tipe:'order',
      created_at:new Date().toISOString(),dibaca:false});
    if(terapisBaru) await simpan('notifikasi',{id:uid(),karyawan_id:terapisBaru,
      judul:'Ada orderan baru untuk Anda',pesan:ket,tipe:'order',
      created_at:new Date().toISOString(),dibaca:false});
  }
  render();
  toast(terapisBaru
    ? (lama?'Dialihkan ke '+nm('karyawan',terapisBaru)+'. Terapis sebelumnya diberi tahu.'
           :'Ditugaskan ke '+nm('karyawan',terapisBaru))
    : 'Penugasan dilepas');
}

async function ubahItem(itemId,status){
  const i=get('item',itemId);
  await simpanSebagian('item',itemId,{status});
  if(!LIVE) await segarkanStatusOrder(i.pesanan_id);
  render(); toast('Status pekerjaan diperbarui');
}

/* Mode demo: status order dihitung sendiri dari status tiap pekerjaan */
async function segarkanStatusOrder(pesananId){
  const p=get('pesanan',pesananId); if(!p||p.status==='batal') return;
  const item=DB.item.filter(i=>i.pesanan_id===pesananId&&i.status!=='batal');
  let baru='dijadwalkan';
  if(item.length){
    if(item.every(i=>i.status==='selesai')) baru=statusAkhir(p,'selesai');
    else if(item.some(i=>i.status==='berjalan'||i.status==='selesai')) baru='dikerjakan';
  }
  if(baru!==p.status) await simpanSebagian('pesanan',pesananId,{status:baru});
}

/* Keterangan pada pos berharga manual, misalnya asal dan tujuan transport */
async function ubahCatatanItem(itemId, teks){
  await simpanSebagian('item',itemId,{catatan:teks.trim()||null});
}

/* Diskon disebar ulang ke tiap pekerjaan, lalu komisinya dihitung ulang */
async function sebarUlangDiskon(pesananId){
  const p=get('pesanan',pesananId); if(!p) return;
  const item=DB.item.filter(i=>i.pesanan_id===pesananId&&i.status!=='batal');
  if(!item.length) return;
  const bagian=sebarDiskon(item,p.diskon||0);
  for(let i=0;i<item.length;i++){
    const it=item[i], g=bagian[i], l=get('layanan',it.layanan_id)||{};
    await simpanSebagian('item',it.id,{diskon:g.diskon,
      komisi:it.terapis_id?komisiUntuk(it.terapis_id,{...l,harga:g.subtotal},0):0});
    // mode demo tidak punya kolom terhitung, jadi subtotal disetel di sini
    if(!LIVE){ const x=get('item',it.id); if(x) x.subtotal=g.subtotal; }
  }
}

async function simpanUbahOrder(pesananId){
  const p=get('pesanan',pesananId);
  const nama=document.getElementById('u_nama').value.trim();
  if(!nama) return toast('Nama pelanggan tidak boleh kosong');

  // data pelanggan ikut diperbarui
  const pel=get('pelanggan',p.pelanggan_id);
  if(pel){
    const hp=document.getElementById('u_hp').value.trim();
    const alamat=document.getElementById('u_alamat').value.trim();
    if(nama!==pel.nama||hp!==(pel.telepon||'')||alamat!==(pel.alamat||'')){
      await simpanSebagian('pelanggan',pel.id,{nama,telepon:hp||null,alamat:alamat||null});
    }
  }

  // ruangan tersimpan pada tiap pekerjaan
  const ruangan=document.getElementById('u_room').value.trim();
  for(const i of DB.item.filter(x=>x.pesanan_id===pesananId)){
    if((i.ruangan||'')!==ruangan) await simpanSebagian('item',i.id,{ruangan:ruangan||null});
  }

  const item=DB.item.filter(i=>i.pesanan_id===p.id&&i.status!=='batal');
  const kotor=item.reduce((a,i)=>a+Number(i.harga||0),0);
  const disk=Math.min(Number(document.getElementById('u_disk').value)||0, kotor);

  const hasil=await simpanSebagian('pesanan',pesananId,{
    cabang_id:document.getElementById('u_cab').value,
    tgl_kerja:document.getElementById('u_tgl').value,
    jam_kerja:document.getElementById('u_jam').value,
    jam:document.getElementById('u_jam').value,
    status:document.getElementById('u_status').value,
    rekening_id:document.getElementById('u_bayar').value,
    metode_bayar:metodeDari(document.getElementById('u_bayar').value),
    diskon:disk, subtotal:kotor, total:Math.max(0,kotor-disk),
    catatan:document.getElementById('u_cat').value.trim()||null});
  if(!hasil) return;

  // diskon dibagi ulang ke tiap layanan, komisi ikut menyesuaikan
  await sebarUlangDiskon(pesananId);

  closeModal(); render(); toast('Order '+p.nomor+' diperbarui');
}

/* Dua tombol ringkas untuk tiap baris order */
function tombolWa(pesananId){
  return `<div class="row" style="flex-wrap:nowrap">
    <button class="btn ghost sm" onclick="waPelanggan('${pesananId}')">WA Customer</button>
    <button class="btn ghost sm" onclick="waTerapis('${pesananId}')">WA Terapis</button></div>`;
}
function bukaWa(tautan){
  // sebagian peramban memblokir jendela baru; sediakan jalur cadangan
  const w=window.open(tautan,'_blank','noopener');
  if(!w||w.closed||typeof w.closed==='undefined') location.href=tautan;
}
function waPelanggan(pesananId){
  try{
    const p=get('pesanan',pesananId);
    if(!p) return toast('Order tidak ditemukan');
    const pel=get('pelanggan',p.pelanggan_id)||{};
    if(!pel.telepon) return toast('Nomor HP '+(pel.nama||'pelanggan')+' belum diisi di data pelanggan');
    bukaWa(tautanWa(pel.telepon,pesanPelanggan(p)));
  }catch(e){ console.error(e); toast('Gagal menyiapkan pesan: '+e.message); }
}
function waTerapis(pesananId){
  try{
  const p=get('pesanan',pesananId);
  if(!p) return toast('Order tidak ditemukan');
  const item=DB.item.filter(i=>i.pesanan_id===p.id&&i.terapis_id);
  if(!item.length) return toast('Order ini belum punya terapis. Tugaskan lewat tombol Ubah.');
  // satu terapis bisa memegang beberapa layanan; kirim satu pesan saja per orang
  const idUnik=[...new Set(item.map(i=>i.terapis_id))];
  const punya=idUnik.filter(id=>get('karyawan',id)?.telepon);
  if(!punya.length) return toast('Terapis pada order ini belum punya nomor HP di data karyawan');
  if(punya.length===1){
    const k=get('karyawan',punya[0]);
    return bukaWa(tautanWa(k.telepon,pesanTerapis(p,k.id)));
  }
  bukaPanel(`<h3 style="font-size:19px;margin-bottom:4px">Kirim ke terapis</h3>
    <p class="hint" style="margin-bottom:14px">${esc(p.nomor)} · ${idUnik.length} terapis bertugas</p>
    ${idUnik.map(id=>{const k=get('karyawan',id)||{};
      return k.telepon
        ? `<a class="btn amber" style="width:100%;margin-bottom:8px" target="_blank" rel="noopener"
             href="${tautanWa(k.telepon,pesanTerapis(p,id))}">${esc(k.nama)}</a>`
        : `<p class="hint" style="margin-bottom:8px">${esc(k.nama||'Terapis')} belum punya nomor HP.</p>`;}).join('')}`,
    {kaki: `<button class="btn ghost" onclick="closeModal()">Tutup</button>`});
  }catch(e){ console.error(e); toast('Gagal menyiapkan pesan: '+e.message); }
}

function kirimOrder(pesananId){
  const p=get('pesanan',pesananId);
  const pel=get('pelanggan',p.pelanggan_id)||{};
  const item=DB.item.filter(i=>i.pesanan_id===p.id);
  bukaPanel(`<h3 style="font-size:20px;margin-bottom:4px">Order tersimpan</h3>
    <p class="hint" style="margin-bottom:14px">${esc(p.nomor)} · ${rp(p.total)}</p>
    <div class="card" style="background:var(--mist);box-shadow:none;padding:14px;white-space:pre-wrap;
      font-size:12.5px;line-height:1.65;margin-bottom:14px">${esc(pesanPelanggan(p))}</div>

    
    ${pel.telepon?'':'<p class="hint" style="margin-top:8px">Nomor HP pelanggan belum diisi.</p>'}
    <p class="hint" style="margin-top:10px">Pesan ke terapis sengaja tidak memuat nomor HP pelanggan.</p>
    <button class="btn ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Selesai</button>`, {kaki: `${pel.telepon?`<a class="btn" style="flex:1" target="_blank" rel="noopener"
          href="${tautanWa(pel.telepon,pesanPelanggan(p))}">WA Customer</a>`
        :`<button class="btn" style="flex:1" disabled>WA Customer</button>`}
      <button class="btn amber" style="flex:1" onclick="waTerapis('${p.id}')">WA Terapis</button>`})
}

function formKas(){
  bukaPanel(`<h3 style="font-size:20px;margin-bottom:4px">Catat kas manual</h3>
   <p class="hint" style="margin-bottom:14px">Untuk perpindahan uang yang bukan biaya usaha.</p>
   <div class="field"><label>Tanggal</label><input type="date" id="k_tgl" value="${today()}"></div>
   <div class="field"><label>Cabang</label><select id="k_cab" ${opsiRef('cabang').length<2?'disabled':''}>${opsiRef('cabang').map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join('')}</select></div>
   <div class="field"><label>Jenis</label>
     <select id="k_jns" onchange="document.getElementById('k_tujuanBox').style.display=this.value==='pindah'?'block':'none'">
       <option value="masuk">Kas masuk</option><option value="keluar">Kas keluar</option>
       <option value="pindah">Pindah dana antar rekening</option></select></div>
   <div class="field"><label for="k_rek">Rekening</label><select id="k_rek">${opsiRekening(rekeningKode('BCA')?.id)}</select></div>
   <div class="field" id="k_tujuanBox" style="display:none"><label for="k_tujuan">Pindah ke</label>
     <select id="k_tujuan">${opsiRekening(rekeningKode('TUNAI')?.id)}</select>
     <p class="hint" style="margin-top:6px">Misalnya setoran tunai ke BCA: rekening Tunai, pindah ke BCA.</p></div>
   <div class="field"><label>Kategori</label>
     <select id="k_kat">
       <option>Modal awal</option><option>Setoran ke bank</option><option>Tarik tunai dari bank</option>
       <option>Penarikan pemilik</option><option>Pemasukan lain</option><option>Koreksi saldo</option>
     </select></div>
   <p class="hint" style="margin:-4px 0 12px">Untuk biaya operasional seperti sewa atau belanja bahan,
     pakai menu <a href="#" onclick="closeModal();openForm('pengeluaran');return false">Pengeluaran</a>
     agar masuk laporan laba sesuai kategorinya.</p>
   <div class="field"><label>Nominal</label><input type="number" id="k_nom"></div>

   <div class="field"><label>Keterangan</label><textarea id="k_ket" rows="2"></textarea></div>`, {kaki: `<button class="btn" onclick="simpanKas()">Simpan</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>`})
}
async function simpanKas(){
  const n=Number(k_nom.value); if(!n) return toast('Isi nominal');
  const rek=document.getElementById('k_rek').value, jenis=k_jns.value;
  const dasar={tanggal:k_tgl.value,cabang_id:k_cab.value||ME.cabang_id,nominal:n,dibuat_oleh:ME.id};

  if(jenis==='pindah'){
    const tujuan=document.getElementById('k_tujuan').value;
    if(tujuan===rek) return toast('Rekening asal dan tujuan tidak boleh sama');
    const asalN=daftarRekening().find(r=>r.id===rek)?.nama, tujuanN=daftarRekening().find(r=>r.id===tujuan)?.nama;
    const ket=k_ket.value||`Pindah dana ${asalN} ke ${tujuanN}`;
    const a=await simpan('kas',{id:uid(),...dasar,jenis:'keluar',kategori:'Pindah dana',sumber:'pindah',
      rekening_id:rek,metode:metodeDari(rek),keterangan:ket});
    if(!a) return;
    await simpan('kas',{id:uid(),...dasar,jenis:'masuk',kategori:'Pindah dana',sumber:'pindah',
      rekening_id:tujuan,metode:metodeDari(tujuan),keterangan:ket});
    closeModal(); render(); return toast(`Dana ${rp(n)} dipindah dari ${asalN} ke ${tujuanN}`);
  }

  await simpan('kas',{id:uid(),...dasar,jenis,kategori:k_kat.value||'Lain-lain',sumber:'manual',
    rekening_id:rek,metode:metodeDari(rek),keterangan:k_ket.value});
  closeModal(); render(); toast('Kas tercatat');
}
</script>
