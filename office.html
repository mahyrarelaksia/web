<!DOCTYPE html>
<html lang="id-ID">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahyra Relaksia — Portal Office</title>
<link rel="manifest" href="/manifest-office.json">
<meta name="theme-color" content="#1F4C86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mahyra Office">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="/icon-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--jade:#2F6FBF;--jade-2:#4C8FD6;--sky:#7FBCE8;--deep:#1F4C86;--mist:#F2F6FC;--paper:#fff;
--ink:#1E3356;--muted:#7A8CA8;--line:#E4EBF5;--amber:#D9A05C;--rose:#BC8298;--ok:#4A9E85;--warn:#C08A4A;--bad:#C0707E;
--r:18px;--sh:0 1px 2px rgba(31,64,120,.05),0 10px 30px rgba(31,64,120,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--mist);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(130% 100% at 10% 0%,#8FC6EC 0%,#4C8FD6 42%,#1F4C86 100%)}
.card-login{background:var(--paper);border-radius:24px;padding:32px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(20,52,100,.28)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mark{width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid #E4EBF5;display:grid;place-items:center;overflow:hidden;padding:3px;box-shadow:0 6px 16px rgba(47,111,191,.16);flex:none}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
aside .mark{background:rgba(255,255,255,.94);border-color:rgba(255,255,255,.55)}
.tagline{color:var(--muted);font-size:13px;margin-bottom:20px}
.card-login .field{margin-bottom:16px}
.card-login label{font-size:13px;margin-bottom:7px;color:var(--muted)}
.card-login input{padding:15px 17px;font-size:16.5px;border-radius:14px;border-width:1.5px}
.card-login .btn{padding:15px 22px;font-size:15.5px;border-radius:14px}
.card-login .tagline{font-size:14px}
.versi{text-align:center;font-size:11.5px;color:var(--muted);margin-top:16px;letter-spacing:.03em}
.versi b{font-weight:600;color:var(--jade)}

#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(178deg,#4C8FD6 0%,#2F6FBF 45%,#1F4C86 100%);color:#DCEAF8;
 padding:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
 overflow:hidden;align-self:start}
/* kepala sidebar tetap terlihat saat daftar menu digulir */
.aside-kepala{flex:none;padding:18px 12px 10px;background:linear-gradient(178deg,#4C8FD6,#3C7FCB);
 box-shadow:0 6px 16px rgba(16,44,80,.18);position:relative;z-index:2}
.aside-menu{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 12px 18px;
 display:flex;flex-direction:column;gap:4px;scrollbar-width:thin}
.aside-menu::-webkit-scrollbar{width:5px}
.aside-menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.24);border-radius:5px}
aside .brand{color:#fff;padding:0 8px 12px}
.navgrp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#A9C9EA;margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;cursor:pointer;font-size:13.5px}
.nav:hover{background:rgba(255,255,255,.13);color:#fff}
.nav.on{background:#fff;color:var(--jade);font-weight:600}
.nav .ic{width:22px;display:grid;place-items:center;flex:none;opacity:.9}
.nav.on .ic{opacity:1}
main{padding:22px;max-width:1400px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;
 flex-wrap:wrap;position:sticky;top:0;z-index:25;background:var(--mist);padding:14px 0 12px;margin-top:-14px;
 box-shadow:0 8px 12px -8px rgba(31,64,120,.12)}
.topbar h1{font-size:26px}.topbar p{color:var(--muted);font-size:13px;margin-top:2px}
.who{display:flex;align-items:center;gap:10px;background:var(--paper);padding:8px 12px;border-radius:14px;box-shadow:var(--sh)}
.av{width:36px;height:36px;border-radius:12px;background:linear-gradient(150deg,#7FBCE8,#2F6FBF);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.mobbar{display:none}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.stat{position:relative;padding-left:18px}
.stat:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:linear-gradient(180deg,#7FBCE8,#2F6FBF)}
.stat.a:before{background:var(--amber)}.stat.r:before{background:var(--rose)}.stat.g:before{background:var(--ok)}
.stat .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-family:Fraunces,serif;font-size:24px;margin-top:4px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head h3{font-size:17px}
.btn{border:0;background:var(--jade);color:#fff;padding:10px 17px;border-radius:12px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{background:var(--jade-2)}
.btn.ghost{background:transparent;color:var(--jade);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mist)}
.btn.amber{background:var(--amber)}.btn.rose{background:var(--rose)}.btn.sm{padding:6px 10px;font-size:12px}
.btn.besar{padding:14px 20px;font-size:14.5px;border-radius:13px;font-weight:600;
 display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade-2);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field{margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}tbody tr:hover{background:#F7FAFE}.tw{overflow-x:auto}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--mist);color:var(--muted)}
.tag.ok{background:#E4F4EE;color:var(--ok)}.tag.warn{background:#FBF1E1;color:var(--warn)}
.tag.bad{background:#FAEAEC;color:var(--bad)}.tag.info{background:#E8F1FC;color:#2F6FBF}
.tag.lunas{background:linear-gradient(135deg,#1E7A5A,#2F6FBF);color:#fff}
.rp{font-variant-numeric:tabular-nums;font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .disp{font-size:18px;color:var(--ink);margin-bottom:6px}
.bar{height:7px;border-radius:7px;background:var(--mist);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7FBCE8,#2F6FBF);border-radius:7px}
.modal{position:fixed;inset:0;background:rgba(23,52,96,.45);backdrop-filter:blur(3px);display:none;
 place-items:center;padding:16px;z-index:120;overscroll-behavior:contain}
.modal.on{display:grid}
.sheet{background:var(--paper);border-radius:22px;width:100%;max-width:620px;
 max-height:min(86vh,760px);display:flex;flex-direction:column;padding:0;overflow:hidden;position:relative}
.sheet>*{padding-left:22px;padding-right:22px}
.sheet-isi{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
 padding-top:20px;padding-bottom:16px;flex:1;min-height:0}
.sheet-kaki{border-top:1px solid var(--line);background:var(--paper);padding-top:12px;padding-bottom:14px;
 display:flex;gap:8px;flex-wrap:wrap;flex:none}
.sheet-kaki .btn{flex:1;min-width:120px}
.sheet-tutup{position:absolute;top:12px;right:12px;z-index:5;width:34px;height:34px;border-radius:50%;
 border:1px solid #F0D4D8;background:#FBEBEC;color:#C0392B;cursor:pointer;padding:0;
 display:flex;align-items:center;justify-content:center;line-height:0;transition:.16s}
.sheet-tutup svg{display:block}
.sheet-tutup:hover{background:#C0392B;border-color:#C0392B;color:#fff;transform:scale(1.05)}
.sheet-tutup:active{transform:scale(.94)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.err{background:#FAEAEC;color:var(--bad);padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
.err.on{display:block}

/* ---------- Ajakan pasang aplikasi ---------- */
.pasang{position:fixed;left:50%;transform:translateX(-50%) translateY(150%);bottom:14px;z-index:110;
 pointer-events:none;
 width:calc(100% - 24px);max-width:460px;background:#fff;border:1px solid var(--line);border-radius:20px;
 padding:15px 16px;box-shadow:0 20px 48px rgba(16,44,80,.26);display:flex;gap:13px;align-items:flex-start;
 transition:transform .38s cubic-bezier(.2,.8,.3,1)}
.pasang.on{transform:translateX(-50%) translateY(0);pointer-events:auto}
.pasang img{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);padding:3px;
 object-fit:contain;flex:none;background:#fff}
.pasang h5{font-size:14.5px;font-weight:600;line-height:1.3}
.pasang p{font-size:12.5px;color:var(--muted);margin:3px 0 10px;line-height:1.5}
.pasang .aksi{display:flex;gap:8px;flex-wrap:wrap}
.pasang .aksi .btn{padding:9px 16px;font-size:13px}
.pasang .tutup{position:absolute;top:9px;right:11px;background:none;border:0;color:var(--muted);
 font-size:17px;cursor:pointer;line-height:1;padding:4px}
.langkah-ios{background:var(--mist);border-radius:12px;padding:11px 13px;margin-top:8px;font-size:12.5px;line-height:1.7}
.langkah-ios b{font-weight:600}
.pop{position:fixed;left:50%;transform:translateX(-50%) translateY(-140%);top:12px;z-index:130;
 pointer-events:none;
 width:calc(100% - 28px);max-width:440px;background:#fff;border-radius:18px;padding:14px 16px;
 box-shadow:0 18px 44px rgba(16,44,80,.28);border:1px solid var(--line);
 display:flex;gap:12px;align-items:flex-start;transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.pop.on{transform:translateX(-50%) translateY(0);pointer-events:auto}
.pop .ikon{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:19px;
 background:linear-gradient(150deg,#4C8FD6,#1F4C86);color:#fff}
.pop h5{font-size:14px;font-weight:600}
.pop p{font-size:12.5px;color:var(--muted);margin-top:2px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
 padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:99;
 pointer-events:none;max-width:calc(100% - 28px);text-align:center}
.toast.on{opacity:1}
.hanya-mobil{display:none}
/* ---- Tampilan aplikasi untuk layar kecil ---- */
.tabbar{display:none}
.lonceng{position:relative;width:36px;height:36px;border-radius:12px;flex:none;cursor:pointer;
 background:var(--mist);border:1px solid var(--line);color:var(--jade);
 display:grid;place-items:center;font-size:16px;-webkit-tap-highlight-color:transparent}
.lonceng:active{transform:scale(.94)}
.lonceng svg{display:block}
.lonceng .titik{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;
 background:#C0707E;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;
 padding:0 5px;border:2px solid #fff}
.notif-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.notif-item:last-child{border-bottom:0}
.notif-item.baru{background:linear-gradient(90deg,rgba(47,111,191,.08),transparent);
 margin:0 -8px;padding:12px 8px;border-radius:10px}
.notif-item h5{font-size:13.5px;font-weight:600;line-height:1.35}
@media(max-width:760px){
  aside{display:none}
  /* Semua kotak selebar layar, tidak ada yang meluber ke samping */
  html,body{max-width:100%;overflow-x:clip}   /* clip, bukan hidden: hidden mematikan header menempel */
  #app,.shell,main,.card{max-width:100%}
  .card{padding:14px;border-radius:16px}
  .grid{gap:10px}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}
  .stat .val{font-size:18px}
  .stat .lbl{font-size:10px}
  .stat .sub{font-size:11px}
  .head h3{font-size:15px}
  .tw{overflow-x:visible}
  /* Tabel diubah jadi kartu supaya tidak perlu digeser */
  table,thead,tbody,tr,th,td{display:block;width:100%}
  thead{display:none}
  tbody tr{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;background:#fff}
  tbody tr:hover{background:#fff}
  tbody td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:12px;
    align-items:center;font-size:12.5px;text-align:right}
  tbody td:before{content:attr(data-label);color:var(--muted);font-size:11.5px;font-weight:500;
    text-align:left;flex:none;max-width:46%}
  tbody td:first-child{font-weight:600;font-size:13.5px;padding-bottom:7px;margin-bottom:5px;
    border-bottom:1px solid var(--line)}
  tbody td:empty{display:none}
  tbody td .row{justify-content:flex-end}
  .btn{padding:9px 14px;font-size:12.5px}
  /* Panel jadi lembar bawah: ada ruang kosong di atas untuk menutup */
  .modal{place-items:end center;padding:0}
  .modal .sheet{max-height:82vh;border-radius:22px 22px 0 0;align-self:flex-end;
    box-shadow:0 -10px 40px rgba(16,44,80,.3)}
  .modal .sheet>*{padding-left:16px;padding-right:16px}
  .modal .sheet-isi{padding-top:26px}
  .modal .sheet-kaki{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .modal .sheet{padding-bottom:0}
  /* garis pegangan di atas panel */
  .modal .sheet:before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:40px;height:4px;border-radius:4px;background:var(--line);z-index:2}
  .shell{grid-template-columns:1fr}
  #app{padding-bottom:0}

  .mobbar{display:flex;align-items:center;gap:10px;
    background:linear-gradient(170deg,#4C8FD6,#2F6FBF 60%,#1F4C86);
    color:#fff;padding:calc(13px + env(safe-area-inset-top)) 14px 15px;
    position:fixed;top:0;left:0;right:0;z-index:70;border-radius:0 0 22px 22px;
    box-shadow:0 8px 24px rgba(31,76,134,.22)}
  /* ruang untuk header yang menempel, diberikan pada isi halaman */
  main{padding:calc(78px + env(safe-area-inset-top)) 14px 96px}
  .mobbar .judul{flex:1;min-width:0}
  .mobbar .judul b{font-size:14.5px;display:block;line-height:1.2}
  .mobbar .judul span{font-size:11px;color:#DCEAF8}
  .mobbar .lonceng{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.34);color:#fff}
  .mobbar .lonceng .titik{border-color:#2F6FBF}
  .who{display:none}
  .topbar{margin-bottom:10px;position:static;background:none;padding:0;margin-top:0}
  .topbar h1{font-size:19px}
  body.panel-buka .tabbar{transform:translateY(110%)}
  .tabbar{position:fixed;bottom:0;left:0;right:0;width:100%;z-index:90;display:grid;
    transition:transform .25s ease;pointer-events:auto;
    grid-template-columns:repeat(5,1fr);align-items:end;background:#fff;
    border-top:1px solid var(--line);margin:0;
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 22px rgba(31,64,120,.1)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;
    padding:6px 2px;border-radius:12px;cursor:pointer;color:#93A4BD;font-size:9.5px;font-weight:600;
    line-height:1.2;text-align:center;min-width:0;min-height:46px;position:relative;z-index:1;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
  .tab:active{background:var(--mist)}
  .tab span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .tab .ic{height:22px;display:grid;place-items:center}
  .tab .ic svg{display:block}
  .tab.on{color:var(--jade)}
  .tab.pusat{color:var(--jade);position:relative}
  .tab.pusat{overflow:visible}
  .tab.pusat .ic{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    width:54px;height:54px;border-radius:20px;display:grid;place-items:center;
    color:#fff;background:linear-gradient(150deg,#8FC6EC,#2F6FBF 62%,#1F4C86);border:4px solid #fff;
    box-shadow:0 8px 20px rgba(47,111,191,.38);pointer-events:none}
  /* area sentuh tombol tengah dilebarkan ke atas bilah */
  .tab.pusat:before{content:'';position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    width:70px;height:70px;border-radius:24px}
  .tab.pusat span:last-child{margin-top:38px}
  .tab.pusat:active .ic{transform:scale(.94)}
  .menulist{display:grid;gap:6px;margin-top:6px}
  .menulist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);
    background:#fff;padding:13px 14px;border-radius:14px;cursor:pointer;font-weight:600;font-size:13.5px}
  .menulist .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;
    background:#E8F1FC;color:var(--jade)}
}
.libur-tiga{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.libur-hari{border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff}
.libur-hari.ada{border-color:#C6DAF0;background:linear-gradient(165deg,#F4F9FF,#EAF2FC)}
.libur-hari .kepala{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
.libur-hari .kepala strong{font-size:13.5px}
.libur-hari .orang{display:flex;flex-direction:column;gap:5px}
.nama-libur{font-size:12.5px;font-weight:600;color:var(--laut,#1B4A82);
 background:#fff;border:1px solid #CFE0F5;border-radius:9px;padding:5px 9px;line-height:1.35}
.nama-libur i{display:block;font-style:normal;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px}
.rekap-libur{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.rekap-libur:last-child{border-bottom:0}
.rekap-libur .nama{font-size:13px;font-weight:600;min-width:112px;flex:none}
.rekap-libur .tanggal{display:flex;flex-wrap:wrap;gap:5px}
.rekap-libur .tanggal span{font-size:11.5px;border:1px solid var(--line);border-radius:8px;
 padding:3px 8px;background:var(--mist);white-space:nowrap;font-variant-numeric:tabular-nums}
.rekap-libur .tanggal .kini{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}
@media(max-width:640px){
  .libur-tiga{grid-template-columns:1fr}
  .rekap-libur{flex-direction:column;gap:6px}
  .rekap-libur .nama{min-width:0}
}
.omzet-utama{background:linear-gradient(150deg,#F2F8FF,#E8F1FC 60%,#DDEBFA);border:1px solid #CFE0F5}
.omzet-nilai{font-family:Fraunces,serif;font-size:34px;color:var(--laut,#1B4A82);line-height:1.1;margin:4px 0 12px}
.omzet-rinci{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:12px;
 border-top:1px solid rgba(47,111,191,.18)}
.omzet-rinci div{display:flex;flex-direction:column;gap:2px}
.omzet-rinci span{font-size:11px;color:var(--muted)}
.omzet-rinci b{font-size:14px;font-variant-numeric:tabular-nums}
@media(max-width:560px){.omzet-nilai{font-size:27px}.omzet-rinci{grid-template-columns:1fr 1fr}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   MAHYRA RELAKSIA — PORTAL OFFICE
   Isi dua baris di bawah untuk memakai database Supabase sungguhan.
   Jika dibiarkan kosong, aplikasi berjalan dalam mode demo (data di memori).
   ===================================================================== */
const SUPABASE_URL = "https://jhkidgjeaxqzuyctxlbi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_T10nHuCNq8dEv2xjmEenGg_bA_n_17P";

const NAMA_APP = "Mahyra Office";
const VERSI_APP = "2026.09.20.2";
const LIVE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

/* =====================================================================
   PWA — pasang ke layar utama & notifikasi
   Ajakan muncul di tiap perangkat yang belum memasangnya, termasuk saat
   masuk dari ponsel lain. Setelah dipasang, ajakan berhenti muncul.
   ===================================================================== */
let SIAP_PASANG = null;

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js')
    .catch(e => console.warn('Service worker gagal dipasang:', e)));
}

const sudahTerpasang = () =>
  matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

const iniIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent)
  && !/crios|fxios/i.test(navigator.userAgent);

addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); SIAP_PASANG = e;
  if (!sudahTerpasang()) setTimeout(() => ajakPasang(), 2500);
});

addEventListener('appinstalled', () => {
  tutupAjakan();
  try { localStorage.setItem('mahyra_terpasang', '1'); } catch (_) {}
  if (typeof toast === 'function') toast('Aplikasi terpasang di layar utama');
});

function ajakPasang(){
  if (sudahTerpasang()) return;
  const kotak = document.getElementById('ajakPasang');
  if (!kotak) return;
  const iosMode = iniIOS() && !SIAP_PASANG;
  if (!SIAP_PASANG && !iosMode) return;      // peramban belum siap memasang

  kotak.innerHTML = `
    <button class="tutup" onclick="tutupAjakan(true)" aria-label="Tutup">&times;</button>
    <img src="/icon-192.png" alt="Ikon aplikasi">
    <div style="flex:1;min-width:0">
      <h5>Pasang ${NAMA_APP} di ponsel ini</h5>
      <p>Bisa dibuka langsung dari layar utama seperti aplikasi biasa,
         terbuka lebih cepat, dan notifikasi tetap masuk.</p>
      ${iosMode ? `<div class="langkah-ios">
          1. Ketuk tombol <b>Bagikan</b> di bawah layar<br>
          2. Pilih <b>Tambahkan ke Layar Utama</b><br>
          3. Ketuk <b>Tambah</b></div>
        <div class="aksi" style="margin-top:9px">
          <button class="btn ghost" onclick="tutupAjakan(true)">Mengerti</button></div>`
        : `<div class="aksi">
          <button class="btn" onclick="pasangSekarang()">Pasang sekarang</button>
          <button class="btn ghost" onclick="tutupAjakan(true)">Nanti saja</button></div>`}
    </div>`;
  kotak.classList.add('on');
}

async function pasangSekarang(){
  if (!SIAP_PASANG) return tutupAjakan(true);
  SIAP_PASANG.prompt();
  const { outcome } = await SIAP_PASANG.userChoice;
  SIAP_PASANG = null;
  tutupAjakan(outcome !== 'accepted');
}

function tutupAjakan(tunda){
  const k = document.getElementById('ajakPasang');
  if (k) k.classList.remove('on');
  // ditunda 30 menit, lalu ditawarkan lagi selama aplikasi belum dipasang
  if (tunda) { try { localStorage.setItem('mahyra_tunda_pasang', Date.now() + 18e5); } catch (_) {} }
}


/* ---------- Web Push: notifikasi tetap masuk walau aplikasi ditutup ----------
   Isi VAPID_PUBLIC dengan kunci publik dari Edge Function kirim-push.
   Dibiarkan kosong berarti hanya notifikasi saat aplikasi terbuka. */
const VAPID_PUBLIC = "BCOauUBOVvtOXdEjb_pMs5Mvnq0kdVPlqnDoDwvvWrxQq99XXFZ2yoy1O45bCzE2jHiECy-Cyuxn5R8um8ZuhG4";

function urlBase64ToUint8Array(base64){
  const pad='='.repeat((4-base64.length%4)%4);
  const b64=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const mentah=atob(b64), arr=new Uint8Array(mentah.length);
  for(let i=0;i<mentah.length;i++) arr[i]=mentah.charCodeAt(i);
  return arr;
}
async function daftarPush(){
  if(!VAPID_PUBLIC || !LIVE || !ME) return;
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if(Notification.permission !== 'granted') return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)
      });
    }
    const j=sub.toJSON();
    await sb.from('push_langganan').upsert({
      karyawan_id:ME.id, endpoint:j.endpoint,
      p256dh:j.keys.p256dh, auth:j.keys.auth,
      perangkat:navigator.userAgent.slice(0,120), dipakai:new Date().toISOString()
    },{onConflict:'endpoint'});
  }catch(e){ console.warn('Langganan notifikasi dilewati:',e); }
}
/* Peramban kadang memperbarui langganan sendiri */
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data && e.data.tipe==='push-berubah') daftarPush();
  });
}

/* Dipanggil setelah berhasil masuk */
function cekPasang(){
  if (sudahTerpasang()) return;
  const coba = () => {
    if (sudahTerpasang()) return;
    let tunda = 0;
    try { tunda = Number(localStorage.getItem('mahyra_tunda_pasang') || 0); } catch (_) {}
    if (Date.now() >= tunda) ajakPasang();
  };
  setTimeout(coba, 2500);
  setInterval(coba, 3e5);          // periksa tiap 5 menit; muncul lagi setelah 30 menit
}

/* Izin notifikasi, diminta setelah masuk agar tidak mengagetkan */
async function mintaIzinNotif(){
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch (_) {}
  }
  if (Notification.permission === 'granted') await daftarPush();
  else if (Notification.permission === 'denied')
    console.warn('Izin notifikasi ditolak. Aktifkan lewat pengaturan situs di peramban.');
}

/* Keadaan notifikasi di perangkat ini, untuk ditampilkan pada halaman profil */
async function statusNotif(){
  const hasil = { izin:'tidak didukung', langganan:false, vapid:!!VAPID_PUBLIC, catatan:'' };
  if (!('Notification' in window)) { hasil.catatan='Peramban ini tidak mendukung notifikasi.'; return hasil; }
  hasil.izin = Notification.permission;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    hasil.catatan='Peramban tidak mendukung notifikasi latar belakang.'; return hasil; }
  try {
    const reg = await navigator.serviceWorker.ready;
    hasil.langganan = !!(await reg.pushManager.getSubscription());
  } catch (_) {}
  if (!hasil.vapid) hasil.catatan='Kunci VAPID belum dipasang di berkas aplikasi.';
  else if (hasil.izin === 'denied') hasil.catatan='Izin ditolak. Aktifkan lewat pengaturan situs di peramban.';
  else if (hasil.izin === 'default') hasil.catatan='Izin belum diberikan. Ketuk tombol di bawah.';
  else if (!hasil.langganan) hasil.catatan='Perangkat belum terdaftar. Ketuk tombol di bawah.';
  else hasil.catatan='Notifikasi aktif, termasuk saat aplikasi ditutup.';
  return hasil;
}
async function aktifkanNotif(){

/* Kirim notifikasi lewat service worker supaya tetap muncul di latar belakang */
async function notifSistem(judul, pesan, url){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker.ready;
    reg.active && reg.active.postMessage({ tipe:'notif', judul, pesan, url, tag:'mahyra-order' });
  } catch (_) {
    try { new Notification(judul, { body: pesan, icon: 'logo.png' }); } catch (__) {}
  }
}

/* Owner dan admin selalu penuh; sisanya mengikuti tabel hak_akses. */
function boleh(modul,aksi='lihat'){
  if(!ME) return false;
  if(modul==='targetsaya') return aksi==='lihat'&&skemaKaryawan(ME).tipe==='cs';   // gaji & target sendiri
  if(modul==='rekening') modul='kasbank';                  // rekening dikelola lewat izin Kas Bank
  if(ME.role==='owner') return true;                       // pemilik selalu penuh
  const baris=(DB.hak_akses||[]).filter(x=>x.jabatan_id===ME.jabatan_id);
  // Jabatan belum pernah diatur sama sekali -> jaring pengaman untuk owner & admin.
  // Jabatan yang sudah punya baris izin tetap tunduk penuh pada centangannya.
  if(!baris.length) return ME.role==='owner'||ME.role==='admin';
  const h=baris.find(x=>x.modul===modul);
  return h?!!h[aksi]:false;                                // yang tidak dicentang = tidak boleh
}
/* Lingkup mengikuti jabatan, bukan kolom role. */
function lingkupSaya(){
  if(!ME) return 'cabang';
  const j=get('jabatan',ME.jabatan_id);
  if(j&&j.lingkup) return j.lingkup;
  return ME.role==='owner'?'semua':'cabang';
}
/* Saring baris yang di luar cabang pengguna (cadangan tampilan; RLS tetap penjaga utamanya) */
const TABEL_BERSAMA=['jabatan','shift','pelanggan','aturan_bonus','kategori_pengeluaran','hak_akses'];
/* Layanan tanpa cabang berlaku di mana saja */
const layananCabang=cabangId=>DB.layanan.filter(l=>l.aktif!==false&&(!l.cabang_id||l.cabang_id===cabangId));
function dalamLingkup(r,key){
  const L=lingkupSaya(); if(L==='semua') return true;
  if(key==='cabang') return r.id===ME.cabang_id;           // tabel cabang dikenali lewat id-nya
  if(TABEL_BERSAMA.includes(key)) return true;             // data acuan dipakai semua cabang
  if(key==='layanan') return !r.cabang_id||r.cabang_id===ME.cabang_id;
  if(r.cabang_id!==undefined&&r.cabang_id!==null) return r.cabang_id===ME.cabang_id;
  if(r.karyawan_id!==undefined&&r.karyawan_id!==null){
    if(L==='sendiri') return r.karyawan_id===ME.id;
    return get('karyawan',r.karyawan_id)?.cabang_id===ME.cabang_id;
  }
  if(r.pesanan_id) return get('pesanan',r.pesanan_id)?.cabang_id===ME.cabang_id;
  return true;
}
/* Pilihan cabang & karyawan pada formulir ikut dibatasi lingkup */
function opsiRef(ref){
  if(ref==='rekening') return daftarRekening();
  const L=lingkupSaya(), daftar=DB[ref]||[];
  if(L==='semua') return daftar;
  if(ref==='cabang')   return daftar.filter(o=>o.id===ME.cabang_id);
  if(ref==='karyawan') return daftar.filter(o=>o.cabang_id===ME.cabang_id);
  return daftar;
}

/* Tanggal menurut waktu perangkat, bukan UTC.
   Memakai toISOString membuat jam 00.00–07.00 WIB terbaca sebagai hari kemarin. */
const today=()=>{ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const tglLokal=d=>{ const x=new Date(d);

  const log=DB.absen_log.filter(x=>x.karyawan_id===a.karyawan_id
    &&String(x.tanggal).slice(0,10)===String(a.tanggal).slice(0,10));
  if(!log.length) return '<span class="hint">—</span>';
  const titik=log.find(x=>x.lat);

       onclick="lihatBukti('${a.karyawan_id}','${String(a.tanggal).slice(0,10)}')">Lihat ${log.length} catatan</a></div>`;

async function lihatBukti(karyawanId,tanggal){
  const log=DB.absen_log.filter(x=>x.karyawan_id===karyawanId&&String(x.tanggal).slice(0,10)===tanggal)
    .sort((a,b)=>new Date(a.waktu)-new Date(b.waktu));
  sheet.innerHTML='<p class="hint" style="text-align:center;padding:26px">Memuat bukti…</p>';
  modal.classList.add('on');
  if(LIVE){
    const perlu=log.filter(a=>FOTO[a.id]===undefined).map(a=>a.id);
    if(perlu.length){
      const {data}=await sb.from('absen_log').select('id,foto').in('id',perlu);
      (data||[]).forEach(d=>FOTO[d.id]=d.foto);
      perlu.forEach(id=>{ if(FOTO[id]===undefined) FOTO[id]=null; });
    }
  }else log.forEach(a=>FOTO[a.id]=a.foto||null);
  bukaPanel(`<h3 style="font-size:19px;margin-bottom:3px">Bukti kehadiran</h3>
    <p class="hint" style="margin-bottom:14px">${esc(nm('karyawan',karyawanId))} · ${tgl(tanggal)}</p>
    ${log.map(a=>{
      const i=a.pesanan_item_id?get('item',a.pesanan_item_id):null;
      const foto=FOTO[a.id];
      return `<div class="list-item">
        ${foto?`<img src="${foto}" alt="Foto" style="width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--line)">`:'<span class="dot" style="margin-top:8px"></span>'}
        <div style="flex:1;min-width:0">

          <div class="hint">${esc(i?nm('layanan',i.layanan_id):'—')}</div>
          <div class="hint" style="word-break:break-word">${esc(a.alamat||'Lokasi tidak tercatat')}${a.akurasi_meter?' · ±'+a.akurasi_meter+' m':''}</div>

}

async function muatSemua(){

/* Nama, jabatan, dan cabang semua karyawan — tanpa data pribadi.
   Jabatan yang tidak memegang modul Karyawan (misalnya Finance) tetap perlu
   tahu siapa penerima komisi, bonus, dan gaji. */
async function muatNamaKaryawan(){
  if(!LIVE) return;
  const {data,error}=await sb.rpc('daftar_nama_karyawan');
  if(error){ console.warn('Daftar nama karyawan belum tersedia. Jalankan skrip 37.',error.message); return; }
  for(const r of data||[]){
    if(!DB.karyawan.some(k=>k.id===r.id))
      DB.karyawan.push({id:r.id,nama:r.nama,jabatan_id:r.jabatan_id,cabang_id:r.cabang_id,
        role:r.role,status:r.status,_ringkas:true});
    if(r.jabatan_id&&!DB.jabatan.some(j=>j.id===r.jabatan_id))
      DB.jabatan.push({id:r.jabatan_id,nama:r.jabatan_nama,_ringkas:true});
    if(r.cabang_id&&!DB.cabang.some(c=>c.id===r.cabang_id))
      DB.cabang.push({id:r.cabang_id,nama:r.cabang_nama,kode:'',_ringkas:true});
  }
}
const GENERATED={item:['subtotal'],izin:['jumlah_hari']};
function bersihkan(key,row){
  const r={...row}; (GENERATED[key]||[]).forEach(f=>delete r[f]);
  if(key==='absensi') ['jam_masuk','jam_pulang'].forEach(f=>{
    if(/^\d{2}:\d{2}$/.test(r[f]||'')) r[f]=String(r.tanggal).slice(0,10)+'T'+r[f]+':00';
  });
  Object.keys(r).forEach(k=>{ if(r[k]==='') r[k]=null; });
  return r;
}
/* Menyimpan sebagian kolom saja. Mengirim seluruh baris sering ditolak
   aturan akses karena ikut menyentuh kolom yang tidak boleh diubah. */
/* Menyimpan satu pekerjaan. Bila database menolak karena ada kolom yang
   belum dikenal, kolom itu dibuang lalu dicoba lagi — supaya order tetap
   tersimpan meski skrip terbaru belum sempat dijalankan. */
async function simpanItem(baris){
  // subtotal adalah kolom terhitung di database: harga − diskon
  const isi={...baris, subtotal:Math.max(0,Number(baris.harga||0)*(baris.qty||1)-Number(baris.diskon||0))};
  const hasil=await simpan('item',isi);
  if(hasil) return hasil;

  const cadangan={...isi};
  ['diskon','catatan','durasi'].forEach(k=>delete cadangan[k]);
  const ulang=await simpan('item',cadangan);
  if(ulang) console.warn('Pekerjaan tersimpan tanpa kolom tambahan. Jalankan skrip SQL terbaru.');
  return ulang;
}

async function simpanSebagian(key,id,patch){
  if(LIVE){
    const bersih=bersihkan(key,{...patch});
    delete bersih.id;
    const {data,error}=await sb.from(TBL[key]).update(bersih).eq('id',id).select().single();
    if(error){
      console.error('Gagal memperbarui '+TBL[key]+':',error,patch);
      if(/row-level security/i.test(error.message||'')) jelaskanPenolakan(key,{id,...patch});
      else toast('Gagal menyimpan ('+TBL[key]+'): '+error.message);
      return null;
    }
    const i=DB[key].findIndex(x=>x.id===id);
    if(i>=0) DB[key][i]=data; else DB[key].push(data);
    return data;
  }
  const i=DB[key].findIndex(x=>x.id===id);
  if(i>=0){ DB[key][i]={...DB[key][i],...patch}; return DB[key][i]; }
  return null;
}

async function simpan(key,row){
  if(LIVE){ const {data,error}=await sb.from(TBL[key]).upsert(bersihkan(key,row)).select().single();
    if(error){ console.error('Gagal menyimpan ke '+TBL[key]+':',error,row);
      const rls=/row-level security/i.test(error.message||'');
      if(rls) jelaskanPenolakan(key,row); else toast('Gagal menyimpan ('+TBL[key]+'): '+error.message);
      return null; }
    const i=DB[key].findIndex(x=>x.id===data.id); i>=0?DB[key][i]=data:DB[key].push(data); return data; }
  const i=DB[key].findIndex(x=>x.id===row.id); i>=0?DB[key][i]=row:DB[key].push(row); return row;
}
async function hapus(key,id){
  if(LIVE){ const {error}=await sb.from(TBL[key]).delete().eq('id',id);
    if(error){ console.error(error); toast('Gagal hapus: '+error.message); return false; } }
  DB[key]=DB[key].filter(x=>x.id!==id); return true;
}

/* Saat aturan akses menolak, tanyakan ke database syarat mana yang jatuh */
async function jelaskanPenolakan(key,row){
  const modul=({item:'order',pesanan:'order',jadwal:'jadwal',hak_akses:'akses'})[key]||key;
  let isi='<p class="hint">Tidak bisa mengambil rincian dari database.</p>';
  try{
    const {data,error}=await sb.rpc('uji_tulis',{p_modul:modul,p_cabang:row.cabang_id||null});
    if(!error&&data){
      const b=[['Dikenali sebagai',(data.saya||'-')+' · role '+(data.role||'-')+' · status '+(data.status||'-'),!!data.saya],
        ['Lingkup data',(data.lingkup||'-')+(data.cabang_saya?'':' · tanpa cabang'),true],
        ['1. Diakui orang kantor',data.syarat_1_is_office?'ya':'TIDAK',!!data.syarat_1_is_office],
        ['2. Izin modul '+modul,data.syarat_2_boleh_tambah?'boleh menambah':'TIDAK dicentang',!!data.syarat_2_boleh_tambah],
        ['3. Batas cabang',data.syarat_3_cabang_boleh?'lolos':'TIDAK — baris di luar cabang Anda',!!data.syarat_3_cabang_boleh]];
      isi=b.map(([l,v,ok])=>`<div class="list-item"><div style="flex:1">${l}</div>
        <span class="tag ${ok?'ok':'bad'}">${esc(v)}</span></div>`).join('');
    }else if(error) isi=`<p class="hint">${esc(error.message)} — jalankan 15_layanan_cabang.sql di SQL Editor.</p>`;
  }catch(e){}
  bukaPanel(`<h3 style="font-size:19px;margin-bottom:4px">Penyimpanan ditolak aturan akses</h3>
    <p class="hint" style="margin-bottom:14px">Tabel <strong>${esc(TBL[key]||key)}</strong>.
      Syarat yang bertanda merah di bawah inilah penyebabnya.</p>
    ${isi}`, {kaki: `<button class="btn ghost" style="width:100%;margin-top:14px" onclick="closeModal()">Tutup</button>`})
}

async function tandaiDibaca(){
  NOTIF.forEach(n=>NOTIF_DILIHAT.add(n.id));
  simpanDilihat(); gambarLonceng();
  if(LIVE){
    const perlu=(DB.notifikasi||[]).filter(n=>n.karyawan_id===ME.id&&!n.dibaca).map(n=>n.id);
    if(perlu.length){ await sb.from('notifikasi').update({dibaca:true}).in('id',perlu);
      DB.notifikasi.forEach(n=>{ if(perlu.includes(n.id)) n.dibaca=true; }); }
  }
}

let AUDIO=null;
function siapkanAudio(){
  if(AUDIO) return AUDIO;
  try{ AUDIO=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ }
  return AUDIO;
}
function deringNotif(){
  const ac=siapkanAudio(); if(!ac) return;
  if(ac.state==='suspended') ac.resume();
  const mulai=ac.currentTime;
  [[880,0],[1174.7,0.13],[1567.98,0.26]].forEach(([hz,jeda])=>{
    const osc=ac.createOscillator(), gain=ac.createGain();
    osc.type='sine'; osc.frequency.value=hz;
    gain.gain.setValueAtTime(0, mulai+jeda);
    gain.gain.linearRampToValueAtTime(0.20, mulai+jeda+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, mulai+jeda+0.45);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(mulai+jeda); osc.stop(mulai+jeda+0.5);
  });
}
['click','touchstart'].forEach(ev=>addEventListener(ev, function sekali(){
  siapkanAudio(); removeEventListener(ev, sekali);
}, {once:true, passive:true}));

function tampilkanPop(n){
  const ip=document.getElementById('icPop'); if(ip&&!ip.innerHTML) ip.innerHTML=ikon('lonceng',20);
  POP_ANTRE=n;
  const j=document.getElementById('popJudul'), p=document.getElementById('popPesan');
  if(!j) return;
  j.textContent=n.judul; p.textContent=n.pesan||'';
  const k=document.getElementById('popNotif'); k.classList.add('on');
  clearTimeout(jedaNotif); jedaNotif=setTimeout(()=>k.classList.remove('on'),8000);
  try{ navigator.vibrate&&navigator.vibrate([120,70,120]); }catch(_){}
  deringNotif();
  notifSistem(n.judul, n.pesan, '/office');
}
function dariPop(){ document.getElementById('popNotif').classList.remove('on'); if(POP_ANTRE) bukaNotif(); }
async function periksaNotif(pertama){
  if(LIVE) await muatTabel(['notifikasi']);
  const sebelum=new Set(NOTIF.map(n=>n.id));
  NOTIF=notifSaya(); gambarLonceng();
  if(pertama) return;
  const baru=NOTIF.filter(n=>!sebelum.has(n.id)&&!NOTIF_DILIHAT.has(n.id));
  if(baru.length) tampilkanPop(baru[0]);
}

let ME=null, PAGE='dash', SEARCH='';

/* Cari data karyawan milik akun yang baru login.
   Urutan: RPC profil_saya() (bisa menautkan otomatis lewat email) -> muat tabel -> cocokkan manual. */
async function ambilProfil(userId,email){
  let k=null;
  try{
    const {data,error}=await sb.rpc('profil_saya');
    if(!error&&data){ const r=Array.isArray(data)?data[0]:data; if(r&&r.id) k=r; }
  }catch(e){ /* fungsi belum dipasang, lanjut cara biasa */ }
  await muatSemua();
  if(!k) k=DB.karyawan.find(x=>x.user_id===userId)
        ||DB.karyawan.find(x=>String(x.email||'').toLowerCase()===email);
  if(k&&!k.user_id){ const r=await simpan('karyawan',{...k,user_id:userId}); if(r) k=r; }
  return k;
}
async function masuk(){
  const email=em.value.trim().toLowerCase(), pass=pw.value, err=loginErr;
  btnLogin.disabled=true; btnLogin.textContent='Memeriksa…'; err.classList.remove('on');
  try{
    if(LIVE){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw new Error('Email atau kata sandi salah.');
      const k=await ambilProfil(data.user.id,email);
      if(!k) throw new Error('Login berhasil, tetapi email ini belum terhubung ke data karyawan. Jalankan 04_profil_login.sql lalu 03_akun_admin.sql di Supabase, atau minta admin menautkannya lewat menu Karyawan.');
      if(k.role==='terapis') throw new Error('Akun terapis. Gunakan Portal Terapis.');
      if(k.status!=='aktif') throw new Error('Akun nonaktif. Hubungi admin.');
      ME=k;
      if(!DB.karyawan.some(x=>x.id===k.id)) DB.karyawan.push(k);
    }else{
      seedDemo();
      const akun=AKUN_DEMO[email];
      if(!akun||akun.pw!==pass) throw new Error('Email atau kata sandi salah.');
      ME=get('karyawan',akun.id);
    }
    simpanan('tulis','mahyra_versi_office',VERSI_APP);
    simpanan('tulis','mahyra_sidik_office',sidikAkses(ME));
    bukaAplikasi();
  }catch(e){ err.textContent=e.message; err.classList.add('on'); }
  btnLogin.disabled=false; btnLogin.textContent='Masuk';
}
function bukaAplikasi(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  meName.textContent=ME.nama; meRole.textContent=nm('jabatan',ME.jabatan_id); meAv.textContent=ME.nama[0];
  const mn=document.getElementById('mobNama'), mp=document.getElementById('mobPeran');
  if(mn) mn.textContent=ME.nama;
  if(mp) mp.textContent=nm('jabatan',ME.jabatan_id)+' · '+nm('cabang',ME.cabang_id);
  try{ muatModel(); }catch(e){ console.warn('Model biaya dilewati:',e); }
  buildSide(); buildTab(); go(halamanPertama());
  muatDilihat(); periksaNotif(true);
  setInterval(()=>periksaNotif(false), 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) periksaNotif(false); });
  addEventListener('focus', ()=>periksaNotif(false));
  addEventListener('online', ()=>periksaNotif(false));
  cekPasang(); mintaIzinNotif();
}

}

/* Sesi disimpan di perangkat supaya tidak perlu login berulang —
   penting agar notifikasi tetap masuk tanpa membuka aplikasi dulu. */
function simpanan(aksi,kunci,nilai){
  try{
    if(aksi==='hapus'){ localStorage.removeItem('mahyra_versi_office');
      localStorage.removeItem('mahyra_sidik_office'); return; }
    if(aksi==='baca') return localStorage.getItem(kunci);
    localStorage.setItem(kunci,nilai);
  }catch(e){ return null; }
}
const sidikAkses=k=>[k.role,k.jabatan_id,k.cabang_id,k.status].join('|');

(async function pulihkanSesi(){
  if(!LIVE) return;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return;

    const versiLama=simpanan('baca','mahyra_versi_office');
    if(versiLama&&versiLama!==VERSI_APP){
      await sb.auth.signOut(); simpanan('hapus');
      simpanan('tulis','mahyra_versi_office',VERSI_APP);
      return pesanLogin('Aplikasi baru saja diperbarui. Silakan masuk sekali lagi.');
    }
    simpanan('tulis','mahyra_versi_office',VERSI_APP);

    const kotak=document.querySelector('#login .card-login');
    if(kotak) kotak.innerHTML='<p class="hint" style="text-align:center;padding:26px">Membuka sesi Anda…</p>';

    const k=await ambilProfil(session.user.id,String(session.user.email||'').toLowerCase());
    if(!k||k.role==='terapis'||k.status!=='aktif'){
      await sb.auth.signOut(); simpanan('hapus');
      return pesanLogin('Akun Anda tidak berlaku untuk portal ini.');
    }
    const sidik=sidikAkses(k), sidikLama=simpanan('baca','mahyra_sidik_office');
    if(sidikLama&&sidikLama!==sidik){
      await sb.auth.signOut(); simpanan('hapus');
      simpanan('tulis','mahyra_sidik_office',sidik);
      return pesanLogin('Hak akses Anda diperbarui. Silakan masuk sekali lagi.');
    }
    simpanan('tulis','mahyra_sidik_office',sidik);

    ME=k;
    if(!DB.karyawan.some(x=>x.id===k.id)) DB.karyawan.push(k);
    bukaAplikasi();
  }catch(e){ console.warn('Sesi tidak bisa dipulihkan:',e); pesanLogin(''); }
})();

function pesanLogin(teks){
  if(teks){ try{ sessionStorage.setItem('mahyra_pesan_office',teks); }catch(_){} }
  location.reload();
}

const TAB_PILIHAN=[
  ['dash','dash','Beranda'], ['audit','audit','Audit'], ['targetsaya','target','Target'], ['m_pelanggan','pelanggan','Pelanggan'],
  ['order','order','Daftar order'],
  ['m_absensi','absensi','Absensi'], ['kas','kas','Kas'], ['laporan','laporan','Laporan']];
function daftarTab(){
  let bisa=TAB_PILIHAN.filter(([id])=>boleh(id.startsWith('m_')?id.slice(2):id,'lihat'));
  // audit menempati tombol tengah bila pengguna tidak membuat order
  if(!boleh('order','tambah')&&boleh('audit','lihat')) bisa=bisa.filter(([id])=>id!=='audit');
  // kasir tidak mengaudit
  if(boleh('order','tambah')&&!boleh('audit','ubah')) bisa=bisa.filter(([id])=>id!=='audit');
  // CS: menu Target menggantikan Pelanggan; Pelanggan tetap ada di Lainnya
  if(boleh('targetsaya')) bisa=bisa.filter(([id])=>id!=='m_pelanggan');
  return { kiri:bisa.slice(0,2), kanan:bisa.slice(2,3),
           buat:boleh('order','tambah'), lihatOrder:boleh('order','lihat') };
}
function buildTab(){
  const bar=document.getElementById('tabbar'); if(!bar) return;
  const {kiri,kanan,buat,lihatOrder}=daftarTab();
  const sel=n=>`<div class="tab" id="tb_${n[0]}" onclick="go('${n[0]}')">
    <span class="ic">${ikon(n[1],21)}</span><span>${n[2]}</span></div>`;
  const kosong='<div class="tab" style="visibility:hidden"><span class="ic"></span><span>·</span></div>';
  const tengah = buat
    ? `<div class="tab pusat" id="tb_order" onclick="formOrder()">
         <span class="ic">${ikon('tambah',26)}</span><span>Buat order</span></div>`
    : boleh('audit','lihat')
      ? `<div class="tab pusat" id="tb_audit" onclick="go('audit')">
           <span class="ic">${ikon('audit',26)}</span><span>Audit</span></div>`
    : lihatOrder
      ? `<div class="tab" id="tb_order" onclick="go('order')"><span class="ic">${ikon('order',21)}</span><span>Order</span></div>`
      : kosong;

  const sisiKiri  = [...kiri.map(sel)];  while(sisiKiri.length<2)  sisiKiri.push(kosong);
  const sisiKanan = [...kanan.map(sel)]; while(sisiKanan.length<1) sisiKanan.push(kosong);

  bar.innerHTML = sisiKiri.join('') + tengah + sisiKanan.join('')
    + `<div class="tab" id="tb_menu" onclick="bukaMenuOffice()"><span class="ic">${ikon('menu',21)}</span><span>Lainnya</span></div>`;
}

function go(p){
  // pengaman: pastikan tidak ada sisa keadaan panel yang menyembunyikan menu
  document.body.classList.remove('panel-buka');
  document.body.style.overflow='';
  PAGE=p; SEARCH='';
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('on'));
  document.getElementById('nv_'+p)?.classList.add('on');
  document.querySelectorAll('.tab').forEach(n=>n.classList.remove('on'));
  (document.getElementById('tb_'+p)||document.getElementById('tb_menu'))?.classList.add('on');
  document.querySelector('aside')?.classList.remove('open');
  render(); window.scrollTo(0,0); }

                  bonus_target1_order:0,bonus_target2_order:0,bonus_service_motor:0,bonus_bpjs:0},

   ${m.info?`<div class="card" style="background:var(--mist);box-shadow:none;padding:12px;margin-bottom:16px">
     <p class="hint" style="margin:0">${m.info}</p></div>`:''}
   ${m.fields.map(f=>fieldHtml(f,r[f.k])).join('')}`, {kaki: `<button class="btn" onclick="saveForm()">Simpan</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>
     ${id&&boleh(key,'hapus')?`<button class="btn rose" style="margin-left:auto" onclick="delRow('${key}','${id}')">Hapus</button>`:''}`})
}
function fieldHtml(f,v){
  const id='f_'+f.k,t=f.t||'text';let inp;
  if(t==='area')inp=`<textarea id="${id}" rows="2">${esc(v||'')}</textarea>`;
  else if(t==='sel')inp=`<select id="${id}">${f.o.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(t==='ref')inp=`<select id="${id}"><option value="">— pilih —</option>${opsiRef(f.ref).map(o=>`<option value="${o.id}" ${v===o.id?'selected':''}>${esc(o.nama)}</option>`).join('')}</select>`;
  else if(t==='bool')inp=`<select id="${id}"><option value="true" ${v?'selected':''}>Ya</option><option value="false" ${!v?'selected':''}>Tidak</option></select>`;
  else if(t==='date')inp=`<input id="${id}" type="date" value="${v?String(v).slice(0,10):today()}">`;
  else if(t==='time')inp=`<input id="${id}" type="time" value="${v||''}">`;
  else if(t==='num'||t==='rp')inp=`<input id="${id}" type="number" value="${v??''}">`;
  else inp=`<input id="${id}" value="${esc(v||'')}">`;
  return `<div class="field"><label for="${id}">${f.l}</label>${inp}</div>`;
}
async function saveForm(){
  const m=F[EDIT.mod]; const obj=EDIT.id?{...get(EDIT.mod,EDIT.id)}:{id:uid()};
  m.fields.forEach(f=>{const el=document.getElementById('f_'+f.k);let v=el.value;
    if(f.t==='bool')v=v==='true'; else if(f.t==='num'||f.t==='rp')v=Number(v)||0;
    else if(f.t==='ref'&&v==='')v=null;
    obj[f.k]=v;});
  if(!EDIT.id&&EDIT.mod==='pengeluaran') obj.nomor='PG-'+String(DB.pengeluaran.length+1).padStart(4,'0');
  const hasil=await simpan(EDIT.mod,obj);
  if(!hasil) return;                       // pesan galat sudah tampil, jendela tetap terbuka
  await m.after?.(hasil);
  closeModal(); render(); toast('Data tersimpan');
}
async function delRow(key,id){ if(!await hapus(key,id)) return; closeModal(); render(); toast('Data dihapus'); }

/* ---------- Panel: isi bisa digulir, tombol tetap di bawah ----------
   Semua pemanggilan sheet.innerHTML dibungkus otomatis, sehingga tombol
   Simpan dan Batal selalu terjangkau tanpa perlu menggulir. */
const _sheet = document.getElementById('sheet');
function bukaPanel(html, opsi){
  const { kaki, lebar } = opsi || {};
  _sheet.innerHTML =
    '<button class="sheet-tutup" onclick="closeModal()" aria-label="Tutup">'
      + '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" '
      + 'stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'
    + '<div class="sheet-isi">' + html + '</div>'
    + (kaki ? '<div class="sheet-kaki">' + kaki + '</div>' : '');
  if (lebar) _sheet.style.maxWidth = lebar;
  modal.classList.add('on');
  document.body.classList.add('panel-buka');
  document.body.style.overflow = 'hidden';
  const isi = _sheet.querySelector('.sheet-isi');
  if (isi) isi.scrollTop = 0;
}
function closeModal(){
  modal.classList.remove('on');
  document.body.classList.remove('panel-buka');
  document.body.style.overflow = '';
  _sheet.style.maxWidth = '';
}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
/* Jaga-jaga bila ada panel yang dibuka tanpa lewat bukaPanel */
new MutationObserver(()=>{
  const buka=modal.classList.contains('on');
  document.body.classList.toggle('panel-buka',buka);
  document.body.style.overflow=buka?'hidden':'';
}).observe(modal,{attributes:true,attributeFilter:['class']});
/* Tombol kembali ponsel menutup panel, bukan keluar aplikasi */
addEventListener('popstate',()=>{ if(modal.classList.contains('on')) closeModal(); });

function renderModule(key){
  // baris ringkas (hanya nama) tidak ditampilkan sebagai data lengkap
  const m=F[key]; let rows=DB[key].filter(r=>!r._ringkas&&dalamLingkup(r,key));
  if(SEARCH) rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(SEARCH.toLowerCase()));
  const bawah=m.bawah?m.bawah():'';
  return `<div class="card"><div class="head"><h3>${m.title}</h3>
    <div class="row"><input placeholder="Cari…" style="width:180px" value="${esc(SEARCH)}" oninput="SEARCH=this.value;render()">
      ${boleh(key,'tambah')?`<button class="btn" onclick="openForm('${key}')">Tambah</button>`:''}</div></div>
    ${tableHtml(rows,m.cols,boleh(key,'ubah')?key:null,boleh(key,'ubah')?m.extra:null)}</div>${bawah}`;
}
function tableHtml(rows,cols,key,extra){
  if(!rows.length) return `<div class="empty"><div class="disp">Belum ada data</div><div>Tambahkan entri pertama lewat tombol di atas.</div></div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c.l||cap(c.k)}</th>`).join('')}${key?'<th></th>':''}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${cols.map(c=>`<td data-label="${esc(c.l||cap(c.k))}">${cellVal(r,c)}</td>`).join('')}
      ${key?`<td data-label="Tindakan" style="text-align:right"><div class="row" style="justify-content:flex-end">
        ${extra?extra(r):''}<button class="btn ghost sm" onclick="openForm('${key}','${r.id}')">Ubah</button></div></td>`:''}
    </tr>`).join('')}</tbody></table></div>`;
}
function cellVal(r,c){ if(c.fn)return c.fn(r); const v=r[c.k];
  if(c.t==='rp')return `<span class="rp">${rp(v)}</span>`; if(c.t==='date')return tgl(v);
  if(c.t==='tag')return tagHtml(v); return esc(v??'-'); }
/* Lencana status pengerjaan dan pembayaran, dengan warna yang konsisten */
const STATUS_ORDER={
  dijadwalkan:{teks:'Dijadwalkan', kelas:'info'},
  dikerjakan :{teks:'Dikerjakan',  kelas:'warn'},
  selesai    :{teks:'Selesai',     kelas:'ok'},
  complete   :{teks:'Complete',    kelas:'lunas'},
  batal      :{teks:'Batal',       kelas:'bad'}
};
const STATUS_BAYAR={
  belum:{teks:'Belum dibayar', kelas:'warn'},
  lunas:{teks:'Sudah dibayar', kelas:'ok'},
  batal:{teks:'Dibatalkan',    kelas:'bad'}
};
const STATUS_AUDIT={
  belum    :{teks:'Belum dicek finance', kelas:'warn'},
  disetujui:{teks:'Disetujui finance',   kelas:'ok'},
  ditolak  :{teks:'Ditolak finance',     kelas:'bad'}
};
/* Tiga syarat menuju complete: selesai dikerjakan, sudah dibayar, disetujui finance */
function lencanaOrder(p){
  if(p.status==='complete') return `<span class="tag lunas">Complete</span>`;
  if(p.status==='batal')    return `<span class="tag bad">Batal</span>`;
  const s=STATUS_ORDER[p.status]||{teks:cap(p.status),kelas:'info'};
  const b=STATUS_BAYAR[p.status_bayar]||{teks:'Belum dibayar',kelas:'warn'};
  const a=STATUS_AUDIT[p.audit_status||'belum'];
  return `<span class="tag ${s.kelas}">${s.teks}</span>
    <span class="tag ${b.kelas}">${b.teks}</span>
    <span class="tag ${a.kelas}">${a.teks}</span>`;
}
/* Status akhir order menurut tiga syarat, dipakai mode demo */
function statusAkhir(p, statusKerja){
  const s=statusKerja||p.status;
  if(s==='batal') return 'batal';
  if((s==='selesai'||s==='complete')&&p.status_bayar==='lunas'&&p.audit_status==='disetujui') return 'complete';
  if(s==='complete') return 'selesai';
  return s;
}
function tagHtml(v){
  const ok=['aktif','selesai','disetujui','hadir','lunas','dibayar','final','owner','admin'],
        warn=['menunggu','berjalan','telat','draft','izin','cuti','manajer','kasir'],
        bad=['ditolak','alpa','batal','nonaktif','belum'];
  const c=ok.includes(v)?'ok':warn.includes(v)?'warn':bad.includes(v)?'bad':'info';
  return `<span class="tag ${c}">${cap(v||'-')}</span>`;
}
/* ---------------- Penyaring tanggal ---------------- */
let FIL={mode:'semua',dari:today(),sampai:today()};
const geser=n=>{const d=new Date();d.setDate(d.getDate()+n);return tglLokal(d)};
function setFilter(mode){
  FIL.mode=mode;
  if(mode==='hari')    { FIL.dari=today();   FIL.sampai=today(); }
  if(mode==='besok')   { FIL.dari=geser(1);  FIL.sampai=geser(1); }
  if(mode==='kemarin') { FIL.dari=geser(-1); FIL.sampai=geser(-1); }
  render();
}
function setRentang(sisi,nilai){ FIL[sisi]=nilai; FIL.mode='rentang'; render(); }
function dalamFilter(tanggal){
  if(FIL.mode==='semua') return true;
  const d=String(tanggal||'').slice(0,10);
  return d>=FIL.dari&&d<=FIL.sampai;
}
function barisFilter(){
  const b=[['semua','Semua'],['kemarin','Kemarin'],['hari','Hari ini'],['besok','Besok'],['rentang','Rentang']];
  return `<div class="filter">
    ${b.map(([m,l])=>`<button class="btn ${FIL.mode===m?'':'ghost'} sm" onclick="setFilter('${m}')">${l}</button>`).join('')}
    ${FIL.mode==='rentang'?`<span class="rentang">
      <input type="date" value="${FIL.dari}" onchange="setRentang('dari',this.value)">
      <span class="hint">sampai</span>
      <input type="date" value="${FIL.sampai}" onchange="setRentang('sampai',this.value)"></span>`:''}
  </div>`;
}
const stat=(l,v,s,cls='')=>`<div class="card stat ${cls}"><div class="lbl">${l}</div><div class="val">${v}</div>${s?`<div class="sub">${s}</div>`:''}</div>`;

   <div class="field"><label for="ak_pw">Kata sandi ${k.user_id?'baru':''}</label>
     <input id="ak_pw" type="text" value="${k.user_id?'':'mahyra'+Math.floor(1000+Math.random()*9000)}" placeholder="minimal 6 karakter"></div>
   <p class="hint">Catat dan sampaikan kata sandi ini ke terapis. Minta mereka menggantinya setelah masuk pertama kali.
     Bila Edge Function <strong>kelola-akun</strong> belum dipasang, akun tetap dibuat lewat jalur cadangan —
     pastikan opsi <em>Confirm email</em> di Authentication → Providers → Email sudah dimatikan.</p>`, {kaki: `<button class="btn" id="akBtn" onclick="simpanAkun('${karyawanId}')">${k.user_id?'Perbarui akun':'Buat akun'}</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>
     ${k.user_id?`<button class="btn rose" style="margin-left:auto" onclick="cabutAkun('${karyawanId}')">Cabut akses</button>`:''}`})
}
async function simpanAkun(karyawanId){
  const k=get('karyawan',karyawanId), email=ak_em.value.trim().toLowerCase(), pass=ak_pw.value.trim(), err=akErr;
  err.classList.remove('on');
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Format email belum benar.';err.classList.add('on');return}
  if(!k.user_id&&pass.length<6){err.textContent='Kata sandi minimal 6 karakter.';err.classList.add('on');return}
  akBtn.disabled=true; akBtn.textContent='Menyimpan…';
  let catatan='';
  try{
    if(LIVE){
      let hasil=null;
      try{
        const {data,error}=await sb.functions.invoke('kelola-akun',{body:{
          aksi:k.user_id?'ubah':'buat', karyawan_id:k.id, email, password:pass||null, user_id:k.user_id||null}});
        if(error) throw error;
        if(data?.error) throw new Error(data.error);
        hasil={user_id:data.user_id};
      }catch(eFn){
        const pesan=await pesanEdge(eFn);
        console.warn('kelola-akun gagal:',pesan,eFn);
        // Fungsi menjawab tapi menolak -> tampilkan alasan aslinya
        if(!edgeTidakAda(eFn)) throw new Error(pesan+petunjukEdge(pesan));
        console.warn('Edge Function kelola-akun tidak tersedia, memakai jalur cadangan.',eFn);
        if(k.user_id){
          if(email!==String(k.email||'').toLowerCase())
            throw new Error('Mengubah alamat email butuh Edge Function "kelola-akun". Pasang dulu lewat Dashboard → Edge Functions, atau ubah emailnya langsung di Authentication → Users.');
          const {error:eR}=await sb.auth.resetPasswordForEmail(email);
          if(eR) throw new Error(eR.message);
          hasil={user_id:k.user_id};
          catatan=' Tautan atur ulang sandi dikirim ke email terapis.';
        }else{
          const r=await buatAkunTanpaFungsi(email,pass);
          hasil={user_id:r.user_id};
          if(r.perluKonfirmasi) catatan=' Terapis harus mengeklik tautan konfirmasi di emailnya dulu. Untuk melewati langkah ini, matikan "Confirm email" di Authentication → Providers → Email.';
        }
      }
      await simpan('karyawan',{...k,email,user_id:hasil.user_id});
    }else{
      if(AKUN_DEMO[email]&&AKUN_DEMO[email].id!==k.id) throw new Error('Email sudah dipakai karyawan lain.');
      await simpan('karyawan',{...k,email,user_id:k.user_id||'u_'+uid()});
      AKUN_DEMO[email]={pw:pass,id:k.id};
    }
    closeModal(); render();
    toast('Akun siap: '+email+(pass&&!catatan?' / '+pass:'')+catatan);
  }catch(e){ err.textContent=e.message; err.classList.add('on'); }
  akBtn.disabled=false; akBtn.textContent='Simpan';
}

/* Apakah kegagalan ini karena Edge Function belum terpasang / tak terjangkau? */
function edgeTidakAda(e){
  const p=(e?.name||'')+' '+(e?.message||'');
  return /FunctionsFetchError|Failed to send|Failed to fetch|NetworkError/i.test(p);
}

/* supabase-js menyembunyikan isi jawaban saat status non-2xx; ambil pesan aslinya. */
async function pesanEdge(e){
  const ctx=e?.context;
  if(ctx){
    try{ const j=await ctx.clone().json(); if(j&&(j.error||j.message)) return String(j.error||j.message); }catch(_){}
    try{ const s=await ctx.clone().text(); if(s) return (ctx.status?ctx.status+' — ':'')+s.slice(0,300); }catch(_){}
    if(ctx.status) return 'Fungsi menjawab dengan status '+ctx.status+'.';
  }
  return e?.message||String(e);
}

/* Saran perbaikan berdasarkan pesan yang diterima */
function petunjukEdge(p){
  const s=String(p).toLowerCase();
  if(/hanya owner|403|forbidden/.test(s))
    return ' — Akun Anda belum terbaca sebagai owner/admin/manajer oleh fungsi tersebut. Jalankan 05_perbaikan_akses.sql lalu 03_akun_admin.sql, keluar, dan login ulang.';
  if(/belum masuk|401|unauthorized|jwt/.test(s))
    return ' — Sesi tidak terkirim. Coba keluar lalu login ulang. Jika masih sama, matikan opsi "Verify JWT" pada fungsi kelola-akun, atau pasang ulang versi terbaru kelola-akun.ts.';
  if(/service_role|env|undefined/.test(s))
    return ' — Fungsi kekurangan variabel lingkungan. Pasang ulang memakai kelola-akun.ts versi terbaru.';
  if(/already registered|already been registered|duplicate/.test(s))
    return ' — Email ini sudah terdaftar di Authentication. Pakai email lain, atau tautkan user yang ada lewat SQL.';
  return '';
}

/* Jalur cadangan: buat akun lewat signUp pada klien terpisah,
   supaya sesi admin yang sedang login tidak ikut tergantikan. */
async function buatAkunTanpaFungsi(email,password){
  const tamu=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,
    {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mahyra-tamu'}});
  const {data,error}=await tamu.auth.signUp({email,password});
  if(error) throw new Error(error.message);
  if(!data.user) throw new Error('Akun tidak terbentuk. Periksa pengaturan Authentication di Supabase.');
  return {user_id:data.user.id, perluKonfirmasi:!data.session};
}
async function cabutAkun(karyawanId){
  const k=get('karyawan',karyawanId); let catatan='';
  if(LIVE){
    try{
      const {error}=await sb.functions.invoke('kelola-akun',{body:{aksi:'hapus',user_id:k.user_id}});
      if(error) throw error;
    }catch(e){
      if(!edgeTidakAda(e)) return toast('Gagal mencabut akses: '+await pesanEdge(e));
      catatan=' Akun auth-nya masih ada; hapus manual di Authentication → Users bila perlu.';
    }
  }
  await simpan('karyawan',{...k,user_id:null});
  closeModal(); render(); toast('Akses login dicabut.'+catatan);
}

audit(){
  const semua=DB.pesanan.filter(p=>dalamLingkup(p,'pesanan')&&dalamFilter(p.tgl_kerja||p.tanggal)&&p.status!=='batal');
  const hitung=s=>semua.filter(p=>(p.audit_status||'belum')===s).length;
  const lunasBelum=semua.filter(p=>p.status_bayar==='lunas'&&(p.audit_status||'belum')==='belum');

  const saring=AUDIT_FIL.status, cab=AUDIT_FIL.cabang;
  const rows=semua.filter(p=>{
    const a=p.audit_status||'belum';
    if(saring==='siap' && !(p.status_bayar==='lunas'&&a==='belum')) return false;
    if(!['siap','semua'].includes(saring) && a!==saring) return false;
    if(cab && p.cabang_id!==cab) return false;
    return true;
  }).sort((a,b)=>{
    // yang siap diperiksa lebih dulu, lalu tanggal terbaru
    const siap=x=>x.status_bayar==='lunas'&&(x.audit_status||'belum')==='belum'?0:1;
    if(siap(a)!==siap(b)) return siap(a)-siap(b);
    return String((b.tgl_kerja||b.tanggal)+(b.jam_kerja||'')).localeCompare(String((a.tgl_kerja||a.tanggal)+(a.jam_kerja||'')));
  });

  const pil=[['siap','Siap diperiksa',lunasBelum.length],['belum','Belum dicek',hitung('belum')],
             ['disetujui','Disetujui',hitung('disetujui')],['ditolak','Ditolak',hitung('ditolak')],
             ['semua','Semua',semua.length]];

  return `<div class="grid g4">
      ${stat('Siap diperiksa',lunasBelum.length,'sudah bayar, belum dicek','a')}
      ${stat('Disetujui',hitung('disetujui'),rp(sum(semua.filter(p=>p.audit_status==='disetujui'),'total')),'g')}
      ${stat('Ditolak',hitung('ditolak'),'dikembalikan ke kasir')}
      ${stat('Nilai menunggu',rp(sum(lunasBelum,'total')),lunasBelum.length+' order')}
    </div>

    <div class="card" style="margin-top:14px">
      ${barisFilter()}
      <div class="filter" style="margin-top:4px">
        ${pil.map(([k,l,n])=>`<button class="btn ${saring===k?'':'ghost'} sm"
          onclick="AUDIT_FIL.status='${k}';render()">${l} <span style="opacity:.7">${n}</span></button>`).join('')}
        <select style="width:auto;padding:6px 10px;font-size:12.5px" onchange="AUDIT_FIL.cabang=this.value;render()">
          <option value="">Semua cabang</option>
          ${DB.cabang.map(c=>`<option value="${c.id}" ${cab===c.id?'selected':''}>${esc(c.nama)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div style="margin-top:14px">
      ${rows.length?rows.map(p=>kartuAudit(p)).join('')
        :'<div class="card empty"><div class="disp">Tidak ada order</div><div>Tidak ada order yang cocok dengan penyaring ini.</div></div>'}
    </div>`;
},

gaji(){
  const per=GAJI_FIL.periode, berjalan=per===periode();
  const [y,m]=per.split('-').map(Number);
  const namaBln=new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});

  const karyawan=DB.karyawan.filter(k=>k.status==='aktif'&&dalamLingkup(k,'karyawan')
    &&(!GAJI_FIL.cabang||k.cabang_id===GAJI_FIL.cabang));
  const baris=karyawan.map(k=>rincianGaji(k,per)).filter(g=>g.ada);
  const tanpaSkema=karyawan.filter(k=>!skemaBerlaku(k));
  const slip=Object.fromEntries(DB.gaji.filter(g=>g.periode===per).map(g=>[g.karyawan_id,g]));

  const total=sum(baris,'total');
  const terapis=baris.filter(g=>g.k.role==='terapis');
  const staf=baris.filter(g=>g.k.role!=='terapis');
  const dibayar=Object.values(slip).filter(g=>g.status==='dibayar');
  const draft=Object.values(slip).filter(g=>g.status==='draft');
  const contoh=baris[0];

  // pilihan periode: enam bulan terakhir
  const opsiPer=[...Array(6)].map((_,i)=>{const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');});

  return `<div class="card omzet-utama">
    <div class="head"><h3>${berjalan?'Gaji yang harus dibayar per hari ini':'Gaji '+namaBln}</h3>
      <span class="tag ${berjalan?'warn':'info'}">${berjalan?'realtime · '+hariTgl(today()):'periode selesai'}</span></div>
    <div class="filter" style="margin-top:2px">
      <select style="width:auto;padding:6px 10px;font-size:12.5px" onchange="GAJI_FIL.periode=this.value;render()">
        ${opsiPer.map(p=>`<option value="${p}" ${p===per?'selected':''}>${new Date(p+'-01T00:00')
          .toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`).join('')}</select>
      <select style="width:auto;padding:6px 10px;font-size:12.5px" onchange="GAJI_FIL.cabang=this.value;render()">
        <option value="">Semua cabang</option>
        ${DB.cabang.filter(c=>dalamLingkup(c,'cabang')).map(c=>
          `<option value="${c.id}" ${GAJI_FIL.cabang===c.id?'selected':''}>${esc(c.nama)}</option>`).join('')}</select>
    </div>
    <div class="omzet-nilai">${rp(total)}</div>
    <div class="omzet-rinci">
      <div><span>Terapis · ${terapis.length} orang</span><b>${rp(sum(terapis,'total'))}</b></div>
      <div><span>Staf kantor · ${staf.length} orang</span><b>${rp(sum(staf,'total'))}</b></div>

      {k:'sesuai',l:'Penyesuaian',fn:r=>r.sesuai>0?`<span class="tag warn">+ ${rp(r.sesuai)}</span>`:'—'},
      {k:'total',l:berjalan?'Per hari ini':'Total',fn:r=>`<strong class="rp">${rp(r.total)}</strong>`},
      {k:'slip',l:'Slip',fn:r=>{const g=slip[r.k.id];

laporan(){
  const per=LAP_FIL.periode, cab=LAP_FIL.cabang||'semua';
  const simpanCab=CAB_BIAYA; CAB_BIAYA=cab;           // model biaya mengikuti cabang laporan
  const R=hitungRealisasi(cab,per,modelAktif());
  CAB_BIAYA=simpanCab;
  const pesanan=DB.pesanan.filter(p=>['selesai','complete'].includes(p.status)
    &&String(p.tgl_kerja||p.tanggal).startsWith(per)&&(cab==='semua'?dalamLingkup(p,'pesanan'):p.cabang_id===cab));
  const idP=new Set(pesanan.map(p=>p.id));
  const item=DB.item.filter(i=>idP.has(i.pesanan_id)&&i.status==='selesai');
  const diskon=sum(pesanan,'diskon');

  const perLayanan=DB.layanan.map(l=>{const it=item.filter(i=>i.layanan_id===l.id);
    return {nama:l.nama,n:it.length,omzet:it.reduce((a,i)=>a+Number(i.subtotal??i.harga??0),0)}})
    .filter(x=>x.n).sort((a,b)=>b.omzet-a.omzet);
  const perRekening=daftarRekening().map(r=>{const d=pesanan.filter(p=>rekeningOrder(p)?.id===r.id);
    return {nama:r.nama,n:d.length,total:sum(d,'total')}}).filter(x=>x.n);
  const perCabang=DB.cabang.filter(c=>dalamLingkup(c,'cabang')).map(c=>{const d=pesanan.filter(p=>p.cabang_id===c.id);
    return {nama:c.nama,n:d.length,total:sum(d,'total'),rata:d.length?sum(d,'total')/d.length:0}}).filter(x=>x.n);
  const perTerapis=DB.karyawan.filter(k=>k.role==='terapis').map(k=>{const it=item.filter(i=>i.terapis_id===k.id);
    return {nama:k.nama,n:it.length,omzet:it.reduce((a,i)=>a+Number(i.subtotal??i.harga??0),0),
      komisi:it.reduce((a,i)=>a+Number(i.komisi||0),0)}}).filter(x=>x.n).sort((a,b)=>b.n-a.n);

  const sdm=R.komisi+R.bonus+R.upah+R.gajiStaf;
  const opsiPer=[...Array(6)].map((_,i)=>{const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');});
  const persen=(a,b)=>b?Math.round(a/b*1000)/10+'%':'—';

  return `<div class="filter">
      <select style="width:auto;padding:6px 10px;font-size:12.5px" onchange="LAP_FIL.periode=this.value;render()">
        ${opsiPer.map(p=>`<option value="${p}" ${p===per?'selected':''}>${new Date(p+'-01T00:00')
          .toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`).join('')}</select>
      <select style="width:auto;padding:6px 10px;font-size:12.5px" onchange="LAP_FIL.cabang=this.value;render()">
        <option value="">Semua cabang</option>
        ${DB.cabang.filter(c=>dalamLingkup(c,'cabang')).map(c=>
          `<option value="${c.id}" ${LAP_FIL.cabang===c.id?'selected':''}>${esc(c.nama)}</option>`).join('')}</select>
    </div>

    <div class="grid g4">
      ${stat('Pendapatan',rp(R.omzet),R.jmlOrder+' order selesai','g')}
      ${stat('Rata-rata per order',rp(R.harga),diskon?'diskon '+rp(diskon):'setelah diskon')}
      ${stat('Biaya karyawan',rp(sdm),persen(sdm,R.omzet)+' dari pendapatan','a')}
      ${stat('Laba bersih',rp(R.laba),persen(R.laba,R.omzet)+' dari pendapatan',R.laba>=0?'g':'r')}
    </div>

    <div class="card" style="margin-top:14px"><div class="head"><h3>Laba rugi</h3>
      <button class="btn ghost sm" onclick="go('biaya')">Rincian struktur biaya</button></div>
      ${tableHtml([
        {pos:'Pendapatan layanan',n:R.omzet,ket:R.jmlOrder+' order, sudah dikurangi diskon'},
        {pos:'Komisi terapis',n:-R.komisi,ket:'sesuai skema gaji'},
        {pos:'Upah, gaji pokok & jaminan minimal terapis',n:-R.upah},
        {pos:'Bonus terapis',n:-R.bonus,ket:'order, target, service motor, BPJS'},
        {pos:'Gaji Customer Service & staf kantor',n:-R.gajiStaf,ket:R.gajiCS?'termasuk CS '+rp(R.gajiCS):''},
        {pos:'Biaya operasional',n:-R.pengeluaran,ket:'pengeluaran disetujui'},
        {pos:'Penyusutan & perkiraan biaya lain',n:-R.manual,ket:'diisi di Struktur Biaya'},
        {pos:'Laba bersih',n:R.laba,ket:persen(R.laba,R.omzet)+' dari pendapatan',tebal:true}
      ].filter(r=>r.n||r.tebal),
      [{k:'pos',l:'Pos',fn:r=>r.tebal?`<strong>${r.pos}</strong>`:`${r.pos}${r.ket?`<div class="hint">${esc(r.ket)}</div>`:''}`},
       {k:'n',l:'Nominal',fn:r=>`<span class="rp" style="color:${r.n<0?'var(--bad)':'var(--ok)'};${r.tebal?'font-weight:700':''}">${rp(r.n)}</span>`},
       {k:'p',l:'% pendapatan',fn:r=>`<span class="hint">${persen(Math.abs(r.n),R.omzet)}</span>`}])}
    </div>

    <div class="grid g2" style="margin-top:14px">
      <div class="card"><div class="head"><h3>Layanan terlaris</h3></div>
        ${tableHtml(perLayanan,[{k:'nama',l:'Layanan'},{k:'n',l:'Terjual'},{k:'omzet',l:'Omzet',t:'rp'}])}</div>
      <div class="card"><div class="head"><h3>Pembayaran per rekening</h3></div>
        ${tableHtml(perRekening,[{k:'nama',l:'Rekening'},{k:'n',l:'Order'},{k:'total',l:'Total',t:'rp'}])}</div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><div class="head"><h3>Per cabang</h3></div>
        ${tableHtml(perCabang,[{k:'nama',l:'Cabang'},{k:'n',l:'Order'},{k:'total',l:'Omzet',t:'rp'},{k:'rata',l:'Rata-rata',t:'rp'}])}</div>
      <div class="card"><div class="head"><h3>Kinerja terapis</h3></div>
        ${tableHtml(perTerapis,[{k:'nama',l:'Terapis'},{k:'n',l:'Order'},{k:'omzet',l:'Omzet',t:'rp'},{k:'komisi',l:'Komisi',t:'rp'}])}</div>
    </div>`;
},

    ${stat('Modul tersedia',MODUL.length,'bisa diatur per jabatan','g')}</div>
