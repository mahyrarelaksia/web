<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahyra Relaksia — Portal Office</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--jade:#2F6FBF;--jade-2:#4C8FD6;--sky:#7FBCE8;--deep:#1F4C86;--mist:#F2F6FC;--paper:#fff;
--ink:#1E3356;--muted:#7A8CA8;--line:#E4EBF5;--amber:#D9A05C;--rose:#BC8298;--ok:#4A9E85;--warn:#C08A4A;--bad:#C0707E;
--r:18px;--sh:0 1px 2px rgba(31,64,120,.05),0 10px 30px rgba(31,64,120,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--mist);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(130% 100% at 10% 0%,#8FC6EC 0%,#4C8FD6 42%,#1F4C86 100%)}
.card-login{background:var(--paper);border-radius:24px;padding:32px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(20,52,100,.28)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mark{width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid #E4EBF5;display:grid;place-items:center;overflow:hidden;padding:3px;box-shadow:0 6px 16px rgba(47,111,191,.16);flex:none}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
aside .mark{background:rgba(255,255,255,.94);border-color:rgba(255,255,255,.55)}
.tagline{color:var(--muted);font-size:13px;margin-bottom:20px}
.card-login .field{margin-bottom:16px}
.card-login label{font-size:13px;margin-bottom:7px;color:var(--muted)}
.card-login input{padding:15px 17px;font-size:16.5px;border-radius:14px;border-width:1.5px}
.card-login .btn{padding:15px 22px;font-size:15.5px;border-radius:14px}
.card-login .tagline{font-size:14px}

#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(178deg,#4C8FD6 0%,#2F6FBF 45%,#1F4C86 100%);color:#DCEAF8;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{color:#fff;padding:0 8px 14px}
.navgrp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#A9C9EA;margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;cursor:pointer;font-size:13.5px}
.nav:hover{background:rgba(255,255,255,.13);color:#fff}
.nav.on{background:#fff;color:var(--jade);font-weight:600}
.nav .ic{width:18px;text-align:center}
main{padding:22px;max-width:1400px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{font-size:26px}.topbar p{color:var(--muted);font-size:13px;margin-top:2px}
.who{display:flex;align-items:center;gap:10px;background:var(--paper);padding:8px 12px;border-radius:14px;box-shadow:var(--sh)}
.av{width:36px;height:36px;border-radius:12px;background:linear-gradient(150deg,#7FBCE8,#2F6FBF);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.mobbar{display:none}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.stat{position:relative;padding-left:18px}
.stat:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:linear-gradient(180deg,#7FBCE8,#2F6FBF)}
.stat.a:before{background:var(--amber)}.stat.r:before{background:var(--rose)}.stat.g:before{background:var(--ok)}
.stat .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-family:Fraunces,serif;font-size:24px;margin-top:4px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head h3{font-size:17px}
.btn{border:0;background:var(--jade);color:#fff;padding:10px 17px;border-radius:12px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{background:var(--jade-2)}
.btn.ghost{background:transparent;color:var(--jade);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mist)}
.btn.amber{background:var(--amber)}.btn.rose{background:var(--rose)}.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade-2);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field{margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}tbody tr:hover{background:#F7FAFE}.tw{overflow-x:auto}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--mist);color:var(--muted)}
.tag.ok{background:#E4F4EE;color:var(--ok)}.tag.warn{background:#FBF1E1;color:var(--warn)}
.tag.bad{background:#FAEAEC;color:var(--bad)}.tag.info{background:#E8F1FC;color:#2F6FBF}
.rp{font-variant-numeric:tabular-nums;font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .disp{font-size:18px;color:var(--ink);margin-bottom:6px}
.bar{height:7px;border-radius:7px;background:var(--mist);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7FBCE8,#2F6FBF);border-radius:7px}
.modal{position:fixed;inset:0;background:rgba(23,52,96,.45);backdrop-filter:blur(3px);display:none;place-items:center;padding:16px;z-index:50}
.modal.on{display:grid}
.sheet{background:var(--paper);border-radius:22px;width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:22px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.err{background:#FAEAEC;color:var(--bad);padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
.err.on{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:99}
.toast.on{opacity:1}
.hanya-mobil{display:none}
.biaya-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pos{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.pos .kepala{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.pos .kepala h4{font-size:14.5px;font-weight:600}
.pos .kepala .nilai{font-family:Fraunces,serif;font-size:19px;color:var(--laut,#1B4A82)}
.baris{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin-bottom:7px}
.baris label{margin:0;font-size:12.5px;font-weight:400;color:var(--ink)}
.baris label small{display:block;color:var(--muted);font-size:11px}
.baris input{padding:7px 10px;font-size:13px;text-align:right;border-radius:9px}
.rinci-tabel{width:100%;font-size:12.5px}
.rinci-tabel input{padding:6px 8px;font-size:12.5px;border-radius:8px}
.rinci-tabel th{font-size:10.5px;padding:4px 6px}
.rinci-tabel td{padding:4px 6px;border:0}
.pita-alokasi{height:10px;border-radius:6px;background:var(--mist);overflow:hidden;margin-top:6px}
.pita-alokasi i{display:block;height:100%}
.arus{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.arus:last-child{border-bottom:0}
.arus .kiri{display:flex;gap:9px;align-items:center;min-width:0;flex:1}
.arus .titik{width:9px;height:9px;border-radius:3px;flex:none}
.laba-besar{font-family:Fraunces,serif;font-size:30px;line-height:1.1}
@media(max-width:860px){.biaya-grid{grid-template-columns:1fr}.baris{grid-template-columns:1fr 110px}}
.filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filter .rentang{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filter input{width:auto;padding:7px 10px;font-size:13px;border-radius:10px}
.kartu-order{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#fff}
.kartu-order .atas{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.kartu-order .nomor{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--muted)}
.kartu-order h4{font-size:15px;font-weight:600}
.kartu-order dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:8px 0}
.kartu-order dt{color:var(--muted)}
.kartu-order dd{text-align:right}
.kartu-order .kaki{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.kartu-order .kaki .btn{flex:1;min-width:96px}
.list-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list-item:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--jade);margin-top:6px;flex:none}
@media(max-width:760px){.hanya-desktop{display:none}.hanya-mobil{display:block}}
@media(max-width:900px){.shell{grid-template-columns:1fr}
aside{position:fixed;left:-260px;width:250px;z-index:60;transition:.22s}
aside.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
main{padding:14px}
.mobbar{display:flex;align-items:center;gap:10px;background:var(--jade);color:#fff;padding:11px 14px;position:sticky;top:0;z-index:20}
.mobbar button{background:rgba(255,255,255,.15);border:0;color:#fff;padding:7px 11px;border-radius:9px;cursor:pointer}
.g4,.g3,.g2{grid-template-columns:1fr 1fr}.topbar h1{font-size:21px}}
@media(max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <div class="card-login">
    <div class="brand"><div class="mark"><img src="logo.png" alt="Mahyra Relaksia"></div>
      <div><h2 style="font-size:20px">Mahyra Relaksia</h2></div></div>
    <p class="tagline">Masuk dengan email dan kata sandi kantor.</p>
    <div class="err" id="loginErr"></div>
    <div class="field"><label for="em">Email</label><input id="em" type="email" placeholder="admin@mahyra.id" autocomplete="username"></div>
    <div class="field"><label for="pw">Kata sandi</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')masuk()"></div>
    <button class="btn" style="width:100%" id="btnLogin" onclick="masuk()">Masuk</button>
  </div>
</div>

<div id="app">
  <div class="mobbar"><button onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
    <strong style="font-family:Fraunces,serif">Office</strong></div>
  <div class="shell">
    <aside id="side"></aside>
    <main>
      <div class="topbar">
        <div><h1 id="pgTitle">Dashboard</h1><p id="pgSub"></p></div>
        <div class="who"><div class="av" id="meAv">M</div>
          <div><div style="font-weight:600" id="meName"></div><div class="hint" id="meRole"></div></div>
          <button class="btn ghost sm" onclick="keluar()">Keluar</button></div>
      </div>
      <div id="view"></div>
    </main>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   MAHYRA RELAKSIA — PORTAL OFFICE
   Isi dua baris di bawah untuk memakai database Supabase sungguhan.
   Jika dibiarkan kosong, aplikasi berjalan dalam mode demo (data di memori).
   ===================================================================== */
const SUPABASE_URL = "https://jhkidgjeaxqzuyctxlbi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_T10nHuCNq8dEv2xjmEenGg_bA_n_17P";

const LIVE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = LIVE ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* nama tabel di Supabase untuk tiap kunci lokal */
const TBL={cabang:'cabang',jabatan:'jabatan',karyawan:'karyawan',layanan:'layanan',pelanggan:'pelanggan',
 shift:'shift',jadwal:'jadwal_kerja',pesanan:'pesanan',item:'pesanan_item',absensi:'absensi',izin:'izin',
 komisi:'komisi',bonus:'bonus',aturan_bonus:'aturan_bonus',gaji:'gaji',kasbon:'kasbon',
 kategori_pengeluaran:'kategori_pengeluaran',pengeluaran:'pengeluaran',kas:'kas',target:'target',
 hak_akses:'hak_akses',absen_log:'absen_log'};

/* ------------------ MODUL & MESIN HAK AKSES ------------------ */
const MODUL=[
 ['dash','Dashboard'],['order','Order & Kasir'],['pelanggan','Pelanggan'],['layanan','Layanan & Tarif'],
 ['jadwal','Jadwal Kerja'],['shift','Shift Kerja'],['karyawan','Karyawan'],['jabatan','Jabatan'],
 ['cabang','Cabang'],['absensi','Absensi'],['izin','Izin & Cuti'],['kasbon','Kasbon'],
 ['kas','Kas'],['pengeluaran','Pengeluaran'],['komisi','Komisi'],['bonus','Bonus'],['gaji','Penggajian'],
 ['laporan','Laporan'],['biaya','Struktur Biaya & Laba'],['aturan_bonus','Aturan Bonus'],['target','Target'],
 ['kategori_pengeluaran','Kategori Biaya'],['pengaturan','Profil Usaha'],['akses','Hak Akses & Peran']];
const AKSI=[['lihat','Lihat'],['tambah','Tambah'],['ubah','Ubah'],['hapus','Hapus']];
const LINGKUP=[['semua','Semua cabang'],['cabang','Cabang sendiri'],['sendiri','Data sendiri']];

/* Owner dan admin selalu penuh; sisanya mengikuti tabel hak_akses. */
function boleh(modul,aksi='lihat'){
  if(!ME) return false;
  if(ME.role==='owner') return true;                       // pemilik selalu penuh
  // Tabel izin sama sekali kosong (belum dipasang) -> jaring pengaman untuk admin
  if(!DB.hak_akses.length) return ME.role==='admin';
  const baris=DB.hak_akses.filter(x=>x.jabatan_id===ME.jabatan_id);
  if(!baris.length) return false;                          // jabatan ini belum diberi izin apa pun
  const h=baris.find(x=>x.modul===modul);
  return h?!!h[aksi]:false;                                // yang tidak dicentang = tidak boleh
}
/* Lingkup mengikuti jabatan, bukan kolom role. */
function lingkupSaya(){
  if(!ME) return 'cabang';
  const j=get('jabatan',ME.jabatan_id);
  if(j&&j.lingkup) return j.lingkup;
  return ME.role==='owner'?'semua':'cabang';
}
/* Saring baris yang di luar cabang pengguna (cadangan tampilan; RLS tetap penjaga utamanya) */
const TABEL_BERSAMA=['jabatan','shift','pelanggan','aturan_bonus','kategori_pengeluaran','hak_akses'];
/* Layanan tanpa cabang berlaku di mana saja */
const layananCabang=cabangId=>DB.layanan.filter(l=>l.aktif!==false&&(!l.cabang_id||l.cabang_id===cabangId));
function dalamLingkup(r,key){
  const L=lingkupSaya(); if(L==='semua') return true;
  if(key==='cabang') return r.id===ME.cabang_id;           // tabel cabang dikenali lewat id-nya
  if(TABEL_BERSAMA.includes(key)) return true;             // data acuan dipakai semua cabang
  if(key==='layanan') return !r.cabang_id||r.cabang_id===ME.cabang_id;
  if(r.cabang_id!==undefined&&r.cabang_id!==null) return r.cabang_id===ME.cabang_id;
  if(r.karyawan_id!==undefined&&r.karyawan_id!==null){
    if(L==='sendiri') return r.karyawan_id===ME.id;
    return get('karyawan',r.karyawan_id)?.cabang_id===ME.cabang_id;
  }
  if(r.pesanan_id) return get('pesanan',r.pesanan_id)?.cabang_id===ME.cabang_id;
  return true;
}
/* Pilihan cabang & karyawan pada formulir ikut dibatasi lingkup */
function opsiRef(ref){
  const L=lingkupSaya(), daftar=DB[ref]||[];
  if(L==='semua') return daftar;
  if(ref==='cabang')   return daftar.filter(o=>o.id===ME.cabang_id);
  if(ref==='karyawan') return daftar.filter(o=>o.cabang_id===ME.cabang_id);
  return daftar;
}

/* --------------------------- utilitas --------------------------- */
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16)}));
const rp=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
const today=()=>new Date().toISOString().slice(0,10);
const periode=()=>today().slice(0,7);
const jam=()=>new Date().toTimeString().slice(0,5);
const tgl=d=>d?new Date(String(d).slice(0,10)+'T00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)};
const cap=s=>String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const jamDari=v=>{ if(!v) return '--.--';
  const s=String(v);
  if(/^\d{2}:\d{2}/.test(s)) return s.slice(0,5).replace(':','.');
  const d=new Date(s); return isNaN(d)?'--.--':d.toTimeString().slice(0,5).replace(':','.'); };
/* Foto dan titik lokasi dari catatan check in/out */
function buktiAbsen(a){
  const log=DB.absen_log.filter(x=>x.karyawan_id===a.karyawan_id
    &&String(x.tanggal).slice(0,10)===String(a.tanggal).slice(0,10));
  if(!log.length) return '<span class="hint">—</span>';
  const titik=log.find(x=>x.lat);
  return `<div style="min-width:0">
    <div class="hint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">
      ${esc((titik?.alamat)||'Lokasi tidak tercatat')}</div>
    <a class="hint" style="color:var(--jade);font-weight:600;cursor:pointer"
       onclick="lihatBukti('${a.karyawan_id}','${String(a.tanggal).slice(0,10)}')">Lihat ${log.length} catatan</a></div>`;
}
async function lihatBukti(karyawanId,tanggal){
  const log=DB.absen_log.filter(x=>x.karyawan_id===karyawanId&&String(x.tanggal).slice(0,10)===tanggal)
    .sort((a,b)=>new Date(a.waktu)-new Date(b.waktu));
  sheet.innerHTML='<p class="hint" style="text-align:center;padding:26px">Memuat bukti…</p>';
  modal.classList.add('on');
  if(LIVE){
    const perlu=log.filter(a=>FOTO[a.id]===undefined).map(a=>a.id);
    if(perlu.length){
      const {data}=await sb.from('absen_log').select('id,foto').in('id',perlu);
      (data||[]).forEach(d=>FOTO[d.id]=d.foto);
      perlu.forEach(id=>{ if(FOTO[id]===undefined) FOTO[id]=null; });
    }
  }else log.forEach(a=>FOTO[a.id]=a.foto||null);
  sheet.innerHTML=`<h3 style="font-size:19px;margin-bottom:3px">Bukti kehadiran</h3>
    <p class="hint" style="margin-bottom:14px">${esc(nm('karyawan',karyawanId))} · ${tgl(tanggal)}</p>
    ${log.map(a=>{
      const i=a.pesanan_item_id?get('item',a.pesanan_item_id):null;
      const foto=FOTO[a.id];
      return `<div class="list-item">
        ${foto?`<img src="${foto}" alt="Foto" style="width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--line)">`:'<span class="dot" style="margin-top:8px"></span>'}
        <div style="flex:1;min-width:0">
          <strong>${jamDari(a.waktu)}</strong> ${a.tipe==='masuk'?'<span class="tag ok">Check in</span>':'<span class="tag warn">Check out</span>'}

const KOLOM={absen_log:'id,karyawan_id,pesanan_item_id,cabang_id,tanggal,tipe,waktu,lat,lng,alamat,akurasi_meter'};
const FOTO={};
async function muatSemua(){
  if(!LIVE) return;
  const galat=[];
  await Promise.all(Object.keys(TBL).map(async k=>{
    const {data,error}=await sb.from(TBL[k]).select(KOLOM[k]||'*');
    if(error){ console.error('Gagal memuat '+TBL[k]+':',error); galat.push(TBL[k]+' ('+error.message+')'); }
    else DB[k]=data||[];
  }));
  if(galat.length){
    console.error('Tabel yang gagal dibaca:',galat);
    toast('Sebagian tabel tidak bisa dibaca. Buka Pengaturan → Diagnosa koneksi.');
  }
  return galat;
}
const GENERATED={item:['subtotal'],izin:['jumlah_hari']};
function bersihkan(key,row){
  const r={...row}; (GENERATED[key]||[]).forEach(f=>delete r[f]);
  if(key==='absensi') ['jam_masuk','jam_pulang'].forEach(f=>{
    if(/^\d{2}:\d{2}$/.test(r[f]||'')) r[f]=String(r.tanggal).slice(0,10)+'T'+r[f]+':00';
  });
  Object.keys(r).forEach(k=>{ if(r[k]==='') r[k]=null; });
  return r;
}
async function simpan(key,row){
  if(LIVE){ const {data,error}=await sb.from(TBL[key]).upsert(bersihkan(key,row)).select().single();
    if(error){ console.error('Gagal menyimpan ke '+TBL[key]+':',error,row);
      const rls=/row-level security/i.test(error.message||'');
      if(rls) jelaskanPenolakan(key,row); else toast('Gagal menyimpan ('+TBL[key]+'): '+error.message);
      return null; }
    const i=DB[key].findIndex(x=>x.id===data.id); i>=0?DB[key][i]=data:DB[key].push(data); return data; }
  const i=DB[key].findIndex(x=>x.id===row.id); i>=0?DB[key][i]=row:DB[key].push(row); return row;
}
async function hapus(key,id){
  if(LIVE){ const {error}=await sb.from(TBL[key]).delete().eq('id',id);
    if(error){ console.error(error); toast('Gagal hapus: '+error.message); return false; } }
  DB[key]=DB[key].filter(x=>x.id!==id); return true;
}

/* Saat aturan akses menolak, tanyakan ke database syarat mana yang jatuh */
async function jelaskanPenolakan(key,row){
  const modul=({item:'order',pesanan:'order',jadwal:'jadwal',hak_akses:'akses'})[key]||key;
  let isi='<p class="hint">Tidak bisa mengambil rincian dari database.</p>';
  try{
    const {data,error}=await sb.rpc('uji_tulis',{p_modul:modul,p_cabang:row.cabang_id||null});
    if(!error&&data){
      const b=[['Dikenali sebagai',(data.saya||'-')+' · role '+(data.role||'-')+' · status '+(data.status||'-'),!!data.saya],
        ['Lingkup data',(data.lingkup||'-')+(data.cabang_saya?'':' · tanpa cabang'),true],
        ['1. Diakui orang kantor',data.syarat_1_is_office?'ya':'TIDAK',!!data.syarat_1_is_office],
        ['2. Izin modul '+modul,data.syarat_2_boleh_tambah?'boleh menambah':'TIDAK dicentang',!!data.syarat_2_boleh_tambah],
        ['3. Batas cabang',data.syarat_3_cabang_boleh?'lolos':'TIDAK — baris di luar cabang Anda',!!data.syarat_3_cabang_boleh]];
      isi=b.map(([l,v,ok])=>`<div class="list-item"><div style="flex:1">${l}</div>
        <span class="tag ${ok?'ok':'bad'}">${esc(v)}</span></div>`).join('');
    }else if(error) isi=`<p class="hint">${esc(error.message)} — jalankan 15_layanan_cabang.sql di SQL Editor.</p>`;
  }catch(e){}
  sheet.innerHTML=`<h3 style="font-size:19px;margin-bottom:4px">Penyimpanan ditolak aturan akses</h3>
    <p class="hint" style="margin-bottom:14px">Tabel <strong>${esc(TBL[key]||key)}</strong>.
      Syarat yang bertanda merah di bawah inilah penyebabnya.</p>
    ${isi}
    <button class="btn ghost" style="width:100%;margin-top:14px" onclick="closeModal()">Tutup</button>`;
  modal.classList.add('on');
}

let ME=null, PAGE='dash', SEARCH='';

/* Cari data karyawan milik akun yang baru login.
   Urutan: RPC profil_saya() (bisa menautkan otomatis lewat email) -> muat tabel -> cocokkan manual. */
async function ambilProfil(userId,email){
  let k=null;
  try{
    const {data,error}=await sb.rpc('profil_saya');
    if(!error&&data){ const r=Array.isArray(data)?data[0]:data; if(r&&r.id) k=r; }
  }catch(e){ /* fungsi belum dipasang, lanjut cara biasa */ }
  await muatSemua();
  if(!k) k=DB.karyawan.find(x=>x.user_id===userId)
        ||DB.karyawan.find(x=>String(x.email||'').toLowerCase()===email);
  if(k&&!k.user_id){ const r=await simpan('karyawan',{...k,user_id:userId}); if(r) k=r; }
  return k;
}
async function masuk(){
  const email=em.value.trim().toLowerCase(), pass=pw.value, err=loginErr;
  btnLogin.disabled=true; btnLogin.textContent='Memeriksa…'; err.classList.remove('on');
  try{
    if(LIVE){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw new Error('Email atau kata sandi salah.');
      const k=await ambilProfil(data.user.id,email);
      if(!k) throw new Error('Login berhasil, tetapi email ini belum terhubung ke data karyawan. Jalankan 04_profil_login.sql lalu 03_akun_admin.sql di Supabase, atau minta admin menautkannya lewat menu Karyawan.');
      if(k.role==='terapis') throw new Error('Akun terapis. Gunakan Portal Terapis.');
      if(k.status!=='aktif') throw new Error('Akun nonaktif. Hubungi admin.');
      ME=k;
      if(!DB.karyawan.some(x=>x.id===k.id)) DB.karyawan.push(k);
    }else{
      seedDemo();
      const akun=AKUN_DEMO[email];
      if(!akun||akun.pw!==pass) throw new Error('Email atau kata sandi salah.');
      ME=get('karyawan',akun.id);
    }
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    meName.textContent=ME.nama; meRole.textContent=nm('jabatan',ME.jabatan_id); meAv.textContent=ME.nama[0];
    muatModel();
    buildSide(); go(halamanPertama());
  }catch(e){ err.textContent=e.message; err.classList.add('on'); }
  btnLogin.disabled=false; btnLogin.textContent='Masuk';
}

function buildSide(){
  side.innerHTML=`<div class="brand"><div class="mark"><img src="logo.png" alt="Mahyra Relaksia"></div><div><strong style="font-family:Fraunces,serif">Mahyra</strong>
    <div style="font-size:11px;color:#A9C9EA">Portal Office</div></div></div>
    <div style="margin:0 8px 6px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.1);font-size:11.5px;line-height:1.5">
      <div style="color:#fff;font-weight:600">${esc(nm('jabatan',ME.jabatan_id))}</div>
      <div style="color:#A9C9EA">${lingkupSaya()==='semua'?'Semua cabang':esc(nm('cabang',ME.cabang_id))}</div></div>`
   +MENU.map(([g,it])=>{
      const isi=it.filter(([id])=>boleh(id.startsWith('m_')?id.slice(2):id,'lihat'));
      if(!isi.length) return '';
      return `<div class="navgrp">${g}</div>`+isi.map(([id,ic,l])=>
        `<div class="nav" id="nv_${id}" onclick="go('${id}')"><span class="ic">${ic}</span>${l}</div>`).join('');
     }).join('');
}
/* Halaman pembuka = menu pertama yang diizinkan untuk jabatan ini */
function halamanPertama(){
  for(const [,isi] of MENU)
    for(const [id] of isi)
      if(boleh(id.startsWith('m_')?id.slice(2):id,'lihat')) return id;
  return 'tanpa_akses';
}
function go(p){ PAGE=p; SEARCH='';
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('on'));
  document.getElementById('nv_'+p)?.classList.add('on');
  document.querySelector('aside').classList.remove('open'); render(); window.scrollTo(0,0); }

/* ------------------------ form & tabel ------------------------ */
let EDIT={mod:null,id:null};
function openForm(key,id){
  const m=F[key]; EDIT={mod:key,id};
  const BAWAAN={karyawan:{role:'kasir',status:'aktif',cabang_id:ME.cabang_id},
                jabatan:{lingkup:'cabang',level:1},
                pengeluaran:{cabang_id:ME.cabang_id,status:'menunggu'},
                jadwal:{cabang_id:ME.cabang_id},absensi:{cabang_id:ME.cabang_id},
                target:{cabang_id:ME.cabang_id,periode:periode()},
                bonus:{periode:periode(),status:'menunggu'}};
  const r=id?get(key,id):{cabang_id:ME.cabang_id,...(BAWAAN[key]||{})};
  sheet.innerHTML=`<h3 style="font-size:20px;margin-bottom:4px">${id?'Ubah':'Tambah'} ${m.title}</h3>
   <p class="hint" style="margin-bottom:16px">${m.sub}</p>
   ${m.fields.map(f=>fieldHtml(f,r[f.k])).join('')}
   <div class="row" style="margin-top:8px"><button class="btn" onclick="saveForm()">Simpan</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>
     ${id&&boleh(key,'hapus')?`<button class="btn rose" style="margin-left:auto" onclick="delRow('${key}','${id}')">Hapus</button>`:''}</div>`;
  modal.classList.add('on');
}
function fieldHtml(f,v){
  const id='f_'+f.k,t=f.t||'text';let inp;
  if(t==='area')inp=`<textarea id="${id}" rows="2">${esc(v||'')}</textarea>`;
  else if(t==='sel')inp=`<select id="${id}">${f.o.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(t==='ref')inp=`<select id="${id}"><option value="">— pilih —</option>${opsiRef(f.ref).map(o=>`<option value="${o.id}" ${v===o.id?'selected':''}>${esc(o.nama)}</option>`).join('')}</select>`;
  else if(t==='bool')inp=`<select id="${id}"><option value="true" ${v?'selected':''}>Ya</option><option value="false" ${!v?'selected':''}>Tidak</option></select>`;
  else if(t==='date')inp=`<input id="${id}" type="date" value="${v?String(v).slice(0,10):today()}">`;
  else if(t==='time')inp=`<input id="${id}" type="time" value="${v||''}">`;
  else if(t==='num'||t==='rp')inp=`<input id="${id}" type="number" value="${v??''}">`;
  else inp=`<input id="${id}" value="${esc(v||'')}">`;
  return `<div class="field"><label for="${id}">${f.l}</label>${inp}</div>`;
}
async function saveForm(){
  const m=F[EDIT.mod]; const obj=EDIT.id?{...get(EDIT.mod,EDIT.id)}:{id:uid()};
  m.fields.forEach(f=>{const el=document.getElementById('f_'+f.k);let v=el.value;
    if(f.t==='bool')v=v==='true'; else if(f.t==='num'||f.t==='rp')v=Number(v)||0;
    else if(f.t==='ref'&&v==='')v=null;
    obj[f.k]=v;});
  if(!EDIT.id&&EDIT.mod==='pengeluaran') obj.nomor='PG-'+String(DB.pengeluaran.length+1).padStart(4,'0');
  const hasil=await simpan(EDIT.mod,obj);
  if(!hasil) return;                       // pesan galat sudah tampil, jendela tetap terbuka
  await m.after?.(hasil);
  closeModal(); render(); toast('Data tersimpan');
}
async function delRow(key,id){ if(!await hapus(key,id)) return; closeModal(); render(); toast('Data dihapus'); }
function closeModal(){ modal.classList.remove('on'); }
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

function renderModule(key){
  const m=F[key]; let rows=DB[key].filter(r=>dalamLingkup(r,key));
  if(SEARCH) rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(SEARCH.toLowerCase()));
  return `<div class="card"><div class="head"><h3>${m.title}</h3>
    <div class="row"><input placeholder="Cari…" style="width:180px" value="${esc(SEARCH)}" oninput="SEARCH=this.value;render()">
      ${boleh(key,'tambah')?`<button class="btn" onclick="openForm('${key}')">Tambah</button>`:''}</div></div>
    ${tableHtml(rows,m.cols,boleh(key,'ubah')?key:null,boleh(key,'ubah')?m.extra:null)}</div>`;
}
function tableHtml(rows,cols,key,extra){
  if(!rows.length) return `<div class="empty"><div class="disp">Belum ada data</div><div>Tambahkan entri pertama lewat tombol di atas.</div></div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c.l||cap(c.k)}</th>`).join('')}${key?'<th></th>':''}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${cols.map(c=>`<td>${cellVal(r,c)}</td>`).join('')}
      ${key?`<td style="text-align:right"><div class="row" style="justify-content:flex-end">
        ${extra?extra(r):''}<button class="btn ghost sm" onclick="openForm('${key}','${r.id}')">Ubah</button></div></td>`:''}
    </tr>`).join('')}</tbody></table></div>`;
}
function cellVal(r,c){ if(c.fn)return c.fn(r); const v=r[c.k];
  if(c.t==='rp')return `<span class="rp">${rp(v)}</span>`; if(c.t==='date')return tgl(v);
  if(c.t==='tag')return tagHtml(v); return esc(v??'-'); }
function tagHtml(v){
  const ok=['aktif','selesai','disetujui','hadir','lunas','dibayar','final','owner','admin'],
        warn=['menunggu','berjalan','telat','draft','izin','cuti','manajer','kasir'],
        bad=['ditolak','alpa','batal','nonaktif','belum'];
  const c=ok.includes(v)?'ok':warn.includes(v)?'warn':bad.includes(v)?'bad':'info';
  return `<span class="tag ${c}">${cap(v||'-')}</span>`;
}
/* ---------------- Penyaring tanggal ---------------- */
let FIL={mode:'semua',dari:today(),sampai:today()};
const geser=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function setFilter(mode){
  FIL.mode=mode;
  if(mode==='hari')    { FIL.dari=today();   FIL.sampai=today(); }
  if(mode==='besok')   { FIL.dari=geser(1);  FIL.sampai=geser(1); }
  if(mode==='kemarin') { FIL.dari=geser(-1); FIL.sampai=geser(-1); }
  render();
}
function setRentang(sisi,nilai){ FIL[sisi]=nilai; FIL.mode='rentang'; render(); }
function dalamFilter(tanggal){
  if(FIL.mode==='semua') return true;
  const d=String(tanggal||'').slice(0,10);
  return d>=FIL.dari&&d<=FIL.sampai;
}
function barisFilter(){
  const b=[['semua','Semua'],['kemarin','Kemarin'],['hari','Hari ini'],['besok','Besok'],['rentang','Rentang']];
  return `<div class="filter">
    ${b.map(([m,l])=>`<button class="btn ${FIL.mode===m?'':'ghost'} sm" onclick="setFilter('${m}')">${l}</button>`).join('')}
    ${FIL.mode==='rentang'?`<span class="rentang">
      <input type="date" value="${FIL.dari}" onchange="setRentang('dari',this.value)">
      <span class="hint">sampai</span>
      <input type="date" value="${FIL.sampai}" onchange="setRentang('sampai',this.value)"></span>`:''}

const stat=(l,v,s,cls='')=>`<div class="card stat ${cls}"><div class="lbl">${l}</div><div class="val">${v}</div>${s?`<div class="sub">${s}</div>`:''}</div>`;

     Bila Edge Function <strong>kelola-akun</strong> belum dipasang, akun tetap dibuat lewat jalur cadangan —
     pastikan opsi <em>Confirm email</em> di Authentication → Providers → Email sudah dimatikan.</p>
   <div class="row" style="margin-top:14px"><button class="btn" id="akBtn" onclick="simpanAkun('${karyawanId}')">${k.user_id?'Perbarui akun':'Buat akun'}</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>
     ${k.user_id?`<button class="btn rose" style="margin-left:auto" onclick="cabutAkun('${karyawanId}')">Cabut akses</button>`:''}</div>`;
  modal.classList.add('on');
}
async function simpanAkun(karyawanId){
  const k=get('karyawan',karyawanId), email=ak_em.value.trim().toLowerCase(), pass=ak_pw.value.trim(), err=akErr;
  err.classList.remove('on');
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Format email belum benar.';err.classList.add('on');return}
  if(!k.user_id&&pass.length<6){err.textContent='Kata sandi minimal 6 karakter.';err.classList.add('on');return}
  akBtn.disabled=true; akBtn.textContent='Menyimpan…';
  let catatan='';
  try{
    if(LIVE){
      let hasil=null;
      try{
        const {data,error}=await sb.functions.invoke('kelola-akun',{body:{
          aksi:k.user_id?'ubah':'buat', karyawan_id:k.id, email, password:pass||null, user_id:k.user_id||null}});
        if(error) throw error;
        if(data?.error) throw new Error(data.error);
        hasil={user_id:data.user_id};
      }catch(eFn){
        const pesan=await pesanEdge(eFn);
        console.warn('kelola-akun gagal:',pesan,eFn);
        // Fungsi menjawab tapi menolak -> tampilkan alasan aslinya
        if(!edgeTidakAda(eFn)) throw new Error(pesan+petunjukEdge(pesan));
        console.warn('Edge Function kelola-akun tidak tersedia, memakai jalur cadangan.',eFn);
        if(k.user_id){
          if(email!==String(k.email||'').toLowerCase())
            throw new Error('Mengubah alamat email butuh Edge Function "kelola-akun". Pasang dulu lewat Dashboard → Edge Functions, atau ubah emailnya langsung di Authentication → Users.');
          const {error:eR}=await sb.auth.resetPasswordForEmail(email);
          if(eR) throw new Error(eR.message);
          hasil={user_id:k.user_id};
          catatan=' Tautan atur ulang sandi dikirim ke email terapis.';
        }else{
          const r=await buatAkunTanpaFungsi(email,pass);
          hasil={user_id:r.user_id};
          if(r.perluKonfirmasi) catatan=' Terapis harus mengeklik tautan konfirmasi di emailnya dulu. Untuk melewati langkah ini, matikan "Confirm email" di Authentication → Providers → Email.';
        }
      }
      await simpan('karyawan',{...k,email,user_id:hasil.user_id});
    }else{
      if(AKUN_DEMO[email]&&AKUN_DEMO[email].id!==k.id) throw new Error('Email sudah dipakai karyawan lain.');
      await simpan('karyawan',{...k,email,user_id:k.user_id||'u_'+uid()});
      AKUN_DEMO[email]={pw:pass,id:k.id};
    }
    closeModal(); render();
    toast('Akun siap: '+email+(pass&&!catatan?' / '+pass:'')+catatan);
  }catch(e){ err.textContent=e.message; err.classList.add('on'); }
  akBtn.disabled=false; akBtn.textContent='Simpan';
}

/* Apakah kegagalan ini karena Edge Function belum terpasang / tak terjangkau? */
function edgeTidakAda(e){
  const p=(e?.name||'')+' '+(e?.message||'');
  return /FunctionsFetchError|Failed to send|Failed to fetch|NetworkError/i.test(p);
}

/* supabase-js menyembunyikan isi jawaban saat status non-2xx; ambil pesan aslinya. */
async function pesanEdge(e){
  const ctx=e?.context;
  if(ctx){
    try{ const j=await ctx.clone().json(); if(j&&(j.error||j.message)) return String(j.error||j.message); }catch(_){}
    try{ const s=await ctx.clone().text(); if(s) return (ctx.status?ctx.status+' — ':'')+s.slice(0,300); }catch(_){}
    if(ctx.status) return 'Fungsi menjawab dengan status '+ctx.status+'.';
  }
  return e?.message||String(e);
}

/* Saran perbaikan berdasarkan pesan yang diterima */
function petunjukEdge(p){
  const s=String(p).toLowerCase();
  if(/hanya owner|403|forbidden/.test(s))
    return ' — Akun Anda belum terbaca sebagai owner/admin/manajer oleh fungsi tersebut. Jalankan 05_perbaikan_akses.sql lalu 03_akun_admin.sql, keluar, dan login ulang.';
  if(/belum masuk|401|unauthorized|jwt/.test(s))
    return ' — Sesi tidak terkirim. Coba keluar lalu login ulang. Jika masih sama, matikan opsi "Verify JWT" pada fungsi kelola-akun, atau pasang ulang versi terbaru kelola-akun.ts.';
  if(/service_role|env|undefined/.test(s))
    return ' — Fungsi kekurangan variabel lingkungan. Pasang ulang memakai kelola-akun.ts versi terbaru.';
  if(/already registered|already been registered|duplicate/.test(s))
    return ' — Email ini sudah terdaftar di Authentication. Pakai email lain, atau tautkan user yang ada lewat SQL.';
  return '';
}

/* Jalur cadangan: buat akun lewat signUp pada klien terpisah,
   supaya sesi admin yang sedang login tidak ikut tergantikan. */
async function buatAkunTanpaFungsi(email,password){
  const tamu=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,
    {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mahyra-tamu'}});
  const {data,error}=await tamu.auth.signUp({email,password});
  if(error) throw new Error(error.message);
  if(!data.user) throw new Error('Akun tidak terbentuk. Periksa pengaturan Authentication di Supabase.');
  return {user_id:data.user.id, perluKonfirmasi:!data.session};
}
async function cabutAkun(karyawanId){
  const k=get('karyawan',karyawanId); let catatan='';
  if(LIVE){
    try{
      const {error}=await sb.functions.invoke('kelola-akun',{body:{aksi:'hapus',user_id:k.user_id}});
      if(error) throw error;
    }catch(e){
      if(!edgeTidakAda(e)) return toast('Gagal mencabut akses: '+await pesanEdge(e));
      catatan=' Akun auth-nya masih ada; hapus manual di Authentication → Users bila perlu.';
    }
  }
  await simpan('karyawan',{...k,user_id:null});
  closeModal(); render(); toast('Akses login dicabut.'+catatan);
}

laporan(){
  const sel=DB.pesanan.filter(p=>p.status==='selesai'&&dalamLingkup(p,'pesanan'));
  const omzet=sum(sel,'total'), komisi=sum(DB.komisi,'nominal'),
    biaya=sum(DB.pengeluaran.filter(e=>e.status==='disetujui'),'nominal'), gj=sum(DB.gaji,'total_terima');
  const perLayanan=DB.layanan.map(l=>{const it=DB.item.filter(i=>i.layanan_id===l.id&&i.status==='selesai');
    return {nama:l.nama,n:it.length,omzet:sum(it,'subtotal')}}).filter(x=>x.n).sort((a,b)=>b.omzet-a.omzet);
  const perMetode=['tunai','transfer','qris','debit'].map(m=>({metode:cap(m),n:sel.filter(p=>p.metode_bayar===m).length,
    total:sum(sel.filter(p=>p.metode_bayar===m),'total')}));
  return `<div class="grid g4">
    ${stat('Pendapatan',rp(omzet),sel.length+' order selesai','g')}
    ${stat('Beban komisi',rp(komisi),'ke terapis','a')}
    ${stat('Beban operasional',rp(biaya),'pengeluaran disetujui','r')}
    ${stat('Laba berjalan',rp(omzet-komisi-biaya-gj),'setelah komisi, biaya & gaji')}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="head"><h3>Layanan terlaris</h3></div>
      ${tableHtml(perLayanan,[{k:'nama',l:'Layanan'},{k:'n',l:'Terjual'},{k:'omzet',t:'rp'}])}</div>
    <div class="card"><div class="head"><h3>Metode pembayaran</h3></div>
      ${tableHtml(perMetode,[{k:'metode'},{k:'n',l:'Transaksi'},{k:'total',t:'rp'}])}</div></div>
  <div class="card" style="margin-top:14px"><div class="head"><h3>Laba rugi berjalan</h3></div>
    ${tableHtml([{pos:'Pendapatan layanan',n:omzet},{pos:'Komisi terapis',n:-komisi},{pos:'Gaji & tunjangan',n:-gj},
      {pos:'Biaya operasional',n:-biaya},{pos:'Laba bersih',n:omzet-komisi-gj-biaya}],
      [{k:'pos',l:'Pos'},{k:'n',l:'Nominal',fn:r=>`<span class="rp" style="color:${r.n<0?'var(--bad)':'var(--ok)'}">${rp(r.n)}</span>`}])}</div>`;
},

    </div>

/* Data nyata sebagai dasar, boleh ditimpa simulasi */
function dasarBiaya(){
  const per=periode();
  const sel=DB.pesanan.filter(p=>p.status==='selesai'&&String(p.tanggal).startsWith(per)&&dalamLingkup(p,'pesanan'));
  const jmlOrderAsli=sel.length, omzetAsli=sum(sel,'total');
  const hargaAsli=jmlOrderAsli?Math.round(omzetAsli/jmlOrderAsli):0;
  const jmlTerapis=Math.max(1,DB.karyawan.filter(k=>k.role==='terapis'&&k.status==='aktif'&&dalamLingkup(k,'karyawan')).length);
  const jmlOrder=MODEL.order_manual>0?MODEL.order_manual:jmlOrderAsli;
  const harga=MODEL.harga_manual>0?MODEL.harga_manual:(hargaAsli||150000);
  return {jmlOrder,harga,jmlTerapis,jmlOrderAsli,hargaAsli,
    perHari:jmlOrder/(jmlTerapis*(MODEL.hari_kerja||26)),
    sumber:MODEL.order_manual>0?'simulasi':'data '+per};
}

function hitungBiaya(d,M){
  const omzet=d.jmlOrder*d.harga;
  const komisi=Math.round(omzet*(M.komisi_persen||0)/100);
  const transport=(M.transport_per_order||0)*d.jmlOrder;
  const hariEfektif=Math.min(M.hari_kerja||26,Math.ceil(d.jmlOrder/Math.max(1,d.jmlTerapis)));
  const gajiHadir=(M.gaji_hadir||0)*hariEfektif*d.jmlTerapis;
  const orderPerTerapis=d.jmlOrder/Math.max(1,d.jmlTerapis);
  let bonusSatu=0;
  if(M.target_bonus2>0&&orderPerTerapis>=M.target_bonus2) bonusSatu=M.bonus2||0;
  else if(M.target_bonus1>0&&orderPerTerapis>=M.target_bonus1) bonusSatu=M.bonus1||0;
  const bonus=bonusSatu*d.jmlTerapis;
  const cs=(M.cs_jumlah||0)*((M.cs_gaji||0)+(M.cs_tunjangan||0))+(M.cs_bonus_order||0)*d.jmlOrder;
  const alat=Math.round((M.alat||[]).reduce((a,x)=>a+((x.harga||0)/Math.max(1,x.umur||1))*(x.set||1),0)*d.jmlTerapis);
  const bahanPerOrder=(M.bahan||[]).reduce((a,x)=>a+((x.harga||0)/Math.max(1,x.cukup||1)),0);
  const bahan=Math.round(bahanPerOrder*d.jmlOrder);
  const lain=(M.iklan||0)+(M.lain||0);
  const total=komisi+transport+gajiHadir+bonus+cs+alat+bahan+lain;
  const laba=omzet-total;

  // titik impas: biaya tetap dibagi marjin per order
  const tetap=cs-(M.cs_bonus_order||0)*d.jmlOrder+alat+lain+bonus;
  const variabelPerOrder=d.harga*(M.komisi_persen||0)/100+(M.transport_per_order||0)
    +bahanPerOrder+(M.cs_bonus_order||0)+(M.gaji_hadir||0)/Math.max(1,orderPerTerapis||1);
  const marjin=d.harga-variabelPerOrder;
  const bep=marjin>0?tetap/marjin:0;

  const anggaran=[
    {nama:'Komisi terapis',nilai:komisi,catatan:M.komisi_persen+'% dari harga layanan'},
    {nama:'Transport terapis',nilai:transport,catatan:rp(M.transport_per_order)+' per order'},
    {nama:'Gaji kehadiran',nilai:gajiHadir,catatan:rp(M.gaji_hadir)+' × '+hariEfektif+' hari × '+d.jmlTerapis+' terapis'},
    {nama:'Bonus terapis',nilai:bonus,catatan:'ambang '+(M.target_bonus1||0)+' dan '+(M.target_bonus2||0)+' order'},
    {nama:'Gaji & bonus CS',nilai:cs,catatan:(M.cs_jumlah||0)+' orang'},
    ...(M.alat||[]).map(x=>({nama:x.nama||'Alat',
      nilai:Math.round(((x.harga||0)/Math.max(1,x.umur||1))*(x.set||1)*d.jmlTerapis),
      catatan:rp(x.harga)+' · '+(x.set||1)+' set · umur '+(x.umur||1)+' bulan'})),
    ...(M.bahan||[]).map(x=>({nama:x.nama||'Bahan',
      nilai:Math.round(((x.harga||0)/Math.max(1,x.cukup||1))*d.jmlOrder),
      catatan:rp(x.harga)+' cukup untuk '+(x.cukup||1)+' order'})),
    {nama:'Iklan',nilai:M.iklan||0,catatan:'tetap per bulan'},
    {nama:'Lain-lain',nilai:M.lain||0,catatan:'sewa, listrik, pulsa'}
  ].filter(a=>a.nilai>0);

  return {omzet,komisi,transport,gajiHadir,bonus,cs,alat,bahan,lain,total,laba,bep,
    bepHari:bep/Math.max(1,d.jmlTerapis*(M.hari_kerja||26)),anggaran};
}

/* Ringkasan skema gaji sebuah jabatan, untuk kolom tabel */
function ringkasSkema(j){
  const t=j.tipe_gaji||'bulanan', b=[];
  if(t==='harian')        b.push(rp(j.gaji_harian||0)+' / hari');
  else if(t==='training') b.push(rp(j.gaji_pokok_default||0)+' − '+rp(j.potongan_harian||0)+' / hari kosong');
  else                    b.push(rp(j.gaji_pokok_default||0)+' / bulan');
  if(j.fee_per_order>0)   b.push(rp(j.fee_per_order)+' / order');
  else if(j.persen_komisi>0) b.push(j.persen_komisi+'% komisi');
  return b.join(' · ');
}
/* Skema yang berlaku untuk seorang karyawan (penimpa karyawan menang) */
function skemaKaryawan(k){
  const j=get('jabatan',k.jabatan_id)||{};
  return { tipe:k.tipe_gaji||j.tipe_gaji||'bulanan',
    pokok:Number(k.gaji_pokok||0), harian:Number(k.gaji_harian??j.gaji_harian??0),
    potongan:Number(k.potongan_harian??j.potongan_harian??0),
    fee:Number(k.fee_per_order??j.fee_per_order??0),
    uangMakan:Number(j.uang_makan_harian||0) };
}
/* Hari kerja efektif: hari dengan minimal satu orderan selesai atau check in */
function hariEfektif(karyawanId,per){
  const hari=new Set();
  DB.item.filter(i=>i.terapis_id===karyawanId&&i.status==='selesai')
    .forEach(i=>{const d=String(i.jam_selesai||'').slice(0,10)||today(); if(d.startsWith(per)) hari.add(d)});
  DB.absensi.filter(a=>a.karyawan_id===karyawanId&&String(a.tanggal).startsWith(per)&&a.jam_masuk)
    .forEach(a=>hari.add(String(a.tanggal).slice(0,10)));
  DB.absen_log.filter(a=>a.karyawan_id===karyawanId&&String(a.tanggal).startsWith(per))
    .forEach(a=>hari.add(String(a.tanggal).slice(0,10)));
  return hari.size;
}

async function putusIzin(id,st){
  const i={...get('izin',id),status:st,approver_id:ME.id,tgl_approve:today()};
  await simpan('izin',i);
  if(st==='disetujui'){
    const d=new Date(i.tgl_mulai), akhir=new Date(i.tgl_selesai);
    while(d<=akhir){ const t=d.toISOString().slice(0,10);
      if(!DB.absensi.some(a=>a.karyawan_id===i.karyawan_id&&String(a.tanggal).slice(0,10)===t))
        await simpan('absensi',{id:uid(),karyawan_id:i.karyawan_id,cabang_id:get('karyawan',i.karyawan_id)?.cabang_id,
          tanggal:t,status:i.jenis==='sakit'?'sakit':i.jenis==='cuti'?'cuti':'izin',menit_telat:0,catatan:i.alasan});
      d.setDate(d.getDate()+1); }
  }
  render(); toast('Pengajuan '+st);
}
async function hitungGaji(){
  if(LIVE){ const {error}=await sb.rpc('generate_gaji',{p_periode:periode()});
    if(error) return toast('Gagal: '+error.message);
    const {data}=await sb.from('gaji').select('*'); DB.gaji=data||[]; render(); return toast('Gaji dihitung'); }
  const HK=26, per=periode();
  for(const k of DB.karyawan.filter(x=>x.status==='aktif')){
    const s=skemaKaryawan(k);
    const efektif=hariEfektif(k.id,per);
    const nOrder=DB.item.filter(i=>i.terapis_id===k.id&&i.status==='selesai'
      &&String(i.jam_selesai||today()).startsWith(per)).length;
    const kom=sum(DB.komisi.filter(c=>c.karyawan_id===k.id&&c.periode===per),'nominal');
    const bon=sum(DB.bonus.filter(b=>b.karyawan_id===k.id&&b.periode===per&&b.status==='disetujui'),'nominal');
    const ksb=sum(DB.kasbon.filter(x=>x.karyawan_id===k.id&&x.status==='disetujui'&&x.sisa>0),'cicilan');
    const um=s.uangMakan*efektif;
    let pokok=0, upah=0, pot=0;
    if(s.tipe==='harian'){ upah=s.harian*efektif; }
    else if(s.tipe==='training'){ pokok=s.pokok; pot=Math.max(0,s.potongan*(HK-efektif)); }
    else { pokok=s.pokok; pot=efektif<HK?Math.round(s.pokok/HK)*(HK-efektif):0; }
    const total=pokok+upah+Number(k.tunjangan||0)+um+kom+bon-pot-ksb;
    const lama=DB.gaji.find(g=>g.periode===per&&g.karyawan_id===k.id);
    if(lama&&lama.status!=='draft') continue;
    await simpan('gaji',{id:lama?.id||uid(),periode:per,karyawan_id:k.id,tipe_gaji:s.tipe,
      hari_kerja:HK,hari_hadir:efektif,hari_efektif:efektif,jml_order:nOrder,
      gaji_pokok:pokok,upah_harian:upah,tunjangan:Number(k.tunjangan||0),uang_makan:um,
      total_komisi:kom,total_bonus:bon,potongan_absen:pot,potongan_kasbon:ksb,
      total_terima:total,status:'draft'});
  }
  render(); toast('Gaji periode '+periode()+' dihitung');
}
async function bayarGaji(){
  for(const g of DB.gaji.filter(x=>x.periode===periode())){
    await simpan('gaji',{...g,status:'dibayar',tgl_bayar:today()});
    await simpan('kas',{id:uid(),tanggal:today(),cabang_id:get('karyawan',g.karyawan_id)?.cabang_id,jenis:'keluar',
      kategori:'Gaji & Tunjangan',sumber:'gaji',ref_id:g.id,nominal:g.total_terima,metode:'transfer',
      keterangan:'Gaji '+g.periode+' — '+nm('karyawan',g.karyawan_id)});
  }
  for(const c of DB.komisi.filter(x=>x.periode===periode()&&!x.dibayar)) await simpan('komisi',{...c,dibayar:true});
  for(const b of DB.bonus.filter(x=>x.periode===periode()&&!x.dibayar)) await simpan('bonus',{...b,dibayar:true});
  render(); toast('Gaji ditandai dibayar dan tercatat di kas');
}

/* daftar layanan mengikuti cabang yang dipilih */
function segarkanLayanan(){
  const cab=document.getElementById('o_cab').value||ME.cabang_id;
  const lay=document.getElementById('o_lay'), pilihan=lay.value;
  const daftar=layananCabang(cab);
  lay.innerHTML=daftar.map(l=>`<option value="${l.id}">${esc(l.nama)} — ${rp(l.harga)} · ${l.durasi_menit} mnt</option>`).join('')
    ||'<option value="">Belum ada layanan untuk cabang ini</option>';
  if(daftar.some(l=>l.id===pilihan)) lay.value=pilihan;
  gambarTerapis(); hitungOrder();
}

/* daftar terapis sebagai tombol pilih-banyak */
function gambarTerapis(){
  const daftar=opsiRef('karyawan').filter(k=>k.role==='terapis'&&k.status==='aktif');
  const kotak=document.getElementById('o_terapis');
  if(!daftar.length){ kotak.innerHTML='<p class="hint">Belum ada terapis aktif di cabang ini.</p>'; return; }
  kotak.innerHTML=`<div class="row">${daftar.map(k=>{
    const on=ORD.terapis.includes(k.id);
    return `<button type="button" class="btn ${on?'':'ghost'} sm" style="border-radius:999px"
      onclick="pilihTerapis('${k.id}')">${on?'✓ ':''}${esc(k.nama)}</button>`;}).join('')}</div>`;
}
function pilihTerapis(id){
  ORD.terapis = ORD.terapis.includes(id) ? ORD.terapis.filter(x=>x!==id) : [...ORD.terapis,id];
  gambarTerapis(); hitungOrder();
}

/* nama cocok -> isi kontak, alamat, dan tiru order terakhirnya */
function cekPelanggan(){
  const nama=document.getElementById('o_nama').value.trim().toLowerCase();
  const info=document.getElementById('o_infoPel');
  const p=DB.pelanggan.find(x=>String(x.nama||'').toLowerCase()===nama);
  if(!p){
    ORD.pelanggan_id=null;
    info.innerHTML=nama?'Nama baru — akan disimpan sebagai pelanggan baru.':'Pelanggan baru akan langsung disimpan ke daftar.';
    return;
  }
  ORD.pelanggan_id=p.id;
  document.getElementById('o_hp').value=p.telepon||'';
  document.getElementById('o_alamat').value=p.alamat||'';

  // order terakhir pelanggan ini
  const lama=DB.pesanan.filter(o=>o.pelanggan_id===p.id)
    .sort((a,b)=>String(b.tanggal+b.jam).localeCompare(String(a.tanggal+a.jam)))[0];
  let jejak='';
  if(lama){
    const item=DB.item.filter(i=>i.pesanan_id===lama.id);
    if(item.length){
      const lay=document.getElementById('o_lay');
      if([...lay.options].some(o=>o.value===item[0].layanan_id)) lay.value=item[0].layanan_id;
      ORD.terapis=item.map(i=>i.terapis_id).filter(id=>opsiRef('karyawan').some(k=>k.id===id));
      if(item[0].ruangan) document.getElementById('o_room').value=item[0].ruangan;
      gambarTerapis();
    }
    if(lama.metode_bayar) document.getElementById('o_bayar').value=lama.metode_bayar;
    if(lama.catatan) document.getElementById('o_cat').value=lama.catatan;
    jejak=` · order terakhir ${tgl(lama.tanggal)}: ${esc(DB.item.filter(i=>i.pesanan_id===lama.id).map(i=>nm('layanan',i.layanan_id)).join(', '))}`;
  }
  info.innerHTML=`<span class="tag ok">Pelanggan lama</span> ${p.total_kunjungan||0} kunjungan${jejak}
    ${p.catatan?`<br>Catatan terapi: ${esc(p.catatan)}`:''}`;
  hitungOrder();
}

function hitungOrder(){
  const l=get('layanan',document.getElementById('o_lay').value);
  const n=Math.max(1,ORD.terapis.length);
  const disk=Number(document.getElementById('o_disk').value)||0;
  const sub=(l?.harga||0)*n, total=Math.max(0,sub-disk);
  document.getElementById('o_total').innerHTML=`
    <div class="row" style="justify-content:space-between"><span class="hint">${esc(l?.nama||'-')} × ${n} terapis</span>
      <span class="rp">${rp(sub)}</span></div>
    ${disk?`<div class="row" style="justify-content:space-between"><span class="hint">Diskon</span>
      <span class="rp" style="color:var(--bad)">− ${rp(disk)}</span></div>`:''}
    <div class="row" style="justify-content:space-between;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px">
      <strong>Total</strong><strong class="rp" style="font-size:17px">${rp(total)}</strong></div>
    ${ORD.terapis.length>1?`<p class="hint" style="margin-top:6px">Dibuat ${ORD.terapis.length} pekerjaan terpisah, satu untuk tiap terapis.</p>`:''}`;
}

async function simpanOrder(){
  const nama=document.getElementById('o_nama').value.trim();
  if(!nama) return toast('Isi nama pelanggan dulu');
  if(!ORD.terapis.length) return toast('Pilih minimal satu terapis');
  const btn=document.getElementById('o_simpan'); btn.disabled=true; btn.textContent='Menyimpan…';

  const hp=document.getElementById('o_hp').value.trim();
  const alamat=document.getElementById('o_alamat').value.trim();

  // pelanggan: pakai yang ada, atau buat baru
  let pel=ORD.pelanggan_id?get('pelanggan',ORD.pelanggan_id):null;
  if(!pel){
    pel=await simpan('pelanggan',{id:uid(),kode:'P-'+String(DB.pelanggan.length+1).padStart(4,'0'),
      nama,telepon:hp,alamat,member:false,poin:0,total_kunjungan:0});
    if(!pel){ btn.disabled=false; btn.textContent='Simpan order'; return; }
  }else if(hp!==pel.telepon||alamat!==pel.alamat){
    pel=await simpan('pelanggan',{...pel,telepon:hp,alamat})||pel;
  }

  const l=get('layanan',document.getElementById('o_lay').value);
  const disk=Number(document.getElementById('o_disk').value)||0;
  const cab=get('cabang',document.getElementById('o_cab').value||ME.cabang_id);
  const sub=l.harga*ORD.terapis.length;
  const n=DB.pesanan.filter(p=>String(p.tanggal).slice(0,10)===today()).length+1;

  const p={id:uid(),nomor:'MHR-'+cab.kode+'-'+today().slice(2).replace(/-/g,'')+'-'+String(n).padStart(4,'0'),
    tanggal:today(),jam:document.getElementById('o_jam').value||jam(),cabang_id:cab.id,pelanggan_id:pel.id,
    kasir_id:ME.id,status:'berjalan',subtotal:sub,diskon:disk,total:Math.max(0,sub-disk),
    metode_bayar:document.getElementById('o_bayar').value,status_bayar:'belum',
    catatan:document.getElementById('o_cat').value};
  const tersimpan=await simpan('pesanan',p);
  if(!tersimpan){ btn.disabled=false; btn.textContent='Simpan order'; return; }

  const ruangan=document.getElementById('o_room').value;
  for(const idTer of ORD.terapis){
    const k=get('karyawan',idTer), j=get('jabatan',k?.jabatan_id)||{};
    const fee=k?.fee_per_order??j.fee_per_order??0;
    const persen=k?.persen_komisi||j.persen_komisi||l.komisi_persen||0;
    await simpan('item',{id:uid(),pesanan_id:p.id,layanan_id:l.id,terapis_id:idTer,ruangan,qty:1,
      harga:l.harga,durasi:l.durasi_menit,subtotal:l.harga,
      komisi:fee>0?fee:Math.round(l.harga*persen/100),status:'menunggu'});
  }
  render(); kirimOrder(p.id);
  toast('Order '+p.nomor+' dibuat');
}

/* ================= KIRIM DETAIL LEWAT WHATSAPP ================= */
const noWa=n=>{ let s=String(n||'').replace(/[^0-9]/g,'');
  if(s.startsWith('0')) s='62'+s.slice(1);
  if(s.startsWith('8')) s='62'+s;
  return s; };

function rincianOrder(p,{denganHp}){
  const item=DB.item.filter(i=>i.pesanan_id===p.id);
  const pel=get('pelanggan',p.pelanggan_id)||{};
  const lay=get('layanan',item[0]?.layanan_id)||{};
  const b=[];
  b.push('No. order  : '+p.nomor);
  b.push('Tanggal    : '+tgl(p.tanggal)+' pukul '+(p.jam||'-'));
  b.push('Layanan    : '+lay.nama+' ('+(lay.durasi_menit||0)+' menit)');
  b.push('Terapis    : '+item.map(i=>nm('karyawan',i.terapis_id)).join(', '));
  b.push('Pelanggan  : '+pel.nama);
  if(denganHp&&pel.telepon) b.push('No. HP     : '+pel.telepon);
  if(pel.alamat) b.push('Alamat     : '+pel.alamat);
  b.push('Total      : '+rp(p.total));
  b.push('Pembayaran : '+cap(p.metode_bayar));
  if(p.catatan) b.push('Catatan    : '+p.catatan);
  return b.join('\n');
}
function pesanPelanggan(p){
  const pel=get('pelanggan',p.pelanggan_id)||{};
  return `Halo ${pel.nama}, terima kasih sudah memesan di Mahyra Relaksia.\n\n`+
    rincianOrder(p,{denganHp:true})+
    `\n\nTerapis akan menghubungi sebelum berangkat. Mohon siapkan ruang sekitar 2x2 meter. Terima kasih.`;
}
function pesanTerapis(p,terapisId){
  return `Halo ${nm('karyawan',terapisId)}, ada orderan untuk Anda.\n\n`+
    rincianOrder(p,{denganHp:false})+
    `\n\nMohon konfirmasi kesiapan Anda dan lakukan check in lewat Portal Terapis saat mulai bekerja.`;
}
function tautanWa(nomor,pesan){
  return 'https://wa.me/'+noWa(nomor)+'?text='+encodeURIComponent(pesan);
}

/* Beri bonus langsung dari sebuah order.

let BON={terapis:[]};
function bonusOrder(pesananId){
  const p=get('pesanan',pesananId);
  const item=DB.item.filter(i=>i.pesanan_id===p.id);
  BON={terapis:item.map(i=>i.terapis_id)};          // bawaan: semua terapis
  const sudah=DB.bonus.filter(b=>b.pesanan_id===p.id);
  sheet.innerHTML=`<h3 style="font-size:20px;margin-bottom:4px">Bonus dari order</h3>
    <p class="hint" style="margin-bottom:16px">${esc(p.nomor)} · ${esc(nm('pelanggan',p.pelanggan_id))} · ${rp(p.total)}</p>

    <div class="field"><label>Terapis penerima</label><div id="b_terapis"></div>
      <p class="hint" style="margin-top:6px">Nominal di bawah diberikan ke tiap terapis yang dipilih.</p></div>

    <div class="grid g2">
      <div class="field"><label for="b_jenis">Jenis bonus</label><select id="b_jenis">
        <option value="tips">Tips</option><option value="transport">Transport</option>
        <option value="lembur">Lembur</option><option value="manual">Lainnya</option></select></div>
      <div class="field"><label for="b_nominal">Nominal per terapis</label>
        <input type="number" id="b_nominal" placeholder="50000"></div>
    </div>
    <div class="field"><label for="b_ket">Keterangan</label>
      <input id="b_ket" placeholder="Contoh: tips dari pelanggan"></div>

    ${sudah.length?`<div class="card" style="background:var(--mist);box-shadow:none;padding:12px;margin-bottom:12px">
      <div class="hint" style="margin-bottom:6px">Bonus yang sudah diberikan untuk order ini</div>
      ${sudah.map(b=>`<div class="list-item" style="padding:7px 0">
        <div style="flex:1">${esc(nm('karyawan',b.karyawan_id))} · ${esc(cap(b.jenis))}</div>
        <span class="rp">${rp(b.nominal)}</span></div>`).join('')}</div>`:''}

    <div class="row"><button class="btn" id="b_simpan" onclick="simpanBonusOrder('${p.id}')">Simpan bonus</button>
      <button class="btn ghost" onclick="closeModal()">Batal</button></div>`;
  modal.classList.add('on');
  gambarTerapisBonus(pesananId);
}
function gambarTerapisBonus(pesananId){
  const item=DB.item.filter(i=>i.pesanan_id===pesananId);
  const kotak=document.getElementById('b_terapis');
  const semua=item.length>1&&BON.terapis.length===item.length;
  kotak.innerHTML=`<div class="row">
    ${item.length>1?`<button type="button" class="btn ${semua?'':'ghost'} sm" style="border-radius:999px"
       onclick="pilihSemuaBonus('${pesananId}')">${semua?'✓ ':''}Semua terapis</button>`:''}
    ${item.map(i=>{const on=BON.terapis.includes(i.terapis_id);
      return `<button type="button" class="btn ${on?'':'ghost'} sm" style="border-radius:999px"
        onclick="pilihTerapisBonus('${i.terapis_id}','${pesananId}')">${on?'✓ ':''}${esc(nm('karyawan',i.terapis_id))}</button>`;
    }).join('')}</div>`;
}
function pilihTerapisBonus(id,pesananId){
  BON.terapis = BON.terapis.includes(id) ? BON.terapis.filter(x=>x!==id) : [...BON.terapis,id];
  gambarTerapisBonus(pesananId);
}
function pilihSemuaBonus(pesananId){
  const item=DB.item.filter(i=>i.pesanan_id===pesananId);
  BON.terapis = BON.terapis.length===item.length ? [] : item.map(i=>i.terapis_id);
  gambarTerapisBonus(pesananId);
}
async function simpanBonusOrder(pesananId){
  const p=get('pesanan',pesananId);
  const nominal=Number(document.getElementById('b_nominal').value)||0;
  if(!nominal) return toast('Isi nominal bonusnya');
  if(!BON.terapis.length) return toast('Pilih minimal satu terapis');
  const btn=document.getElementById('b_simpan'); btn.disabled=true; btn.textContent='Menyimpan…';
  const jenis=document.getElementById('b_jenis').value;
  const ket=document.getElementById('b_ket').value.trim()
    || cap(jenis)+' dari order '+p.nomor;
  let n=0;
  for(const idTer of BON.terapis){
    const item=DB.item.find(i=>i.pesanan_id===p.id&&i.terapis_id===idTer);
    const hasil=await simpan('bonus',{id:uid(),karyawan_id:idTer,pesanan_id:p.id,
      pesanan_item_id:item?.id||null,jenis,periode:String(p.tanggal).slice(0,7),
      deskripsi:ket,nominal,status:'disetujui',dibayar:false,dibuat_oleh:ME.id});
    if(hasil) n++;
  }
  closeModal(); render();
  toast(n?`Bonus ${rp(nominal)} diberikan ke ${n} terapis`:'Bonus gagal disimpan');
}

    tanggal:document.getElementById('u_tgl').value,

    status:document.getElementById('u_status').value,

    catatan:document.getElementById('u_cat').value});

        ? `<a class="btn amber" style="width:100%;margin-bottom:8px" target="_blank" rel="noopener"
             href="${tautanWa(k.telepon,pesanTerapis(p,k.id))}">${esc(k.nama)}</a>`
        : `<p class="hint" style="margin-bottom:8px">${esc(k.nama||'Terapis')} belum punya nomor HP.</p>`;}).join('')}
    <button class="btn ghost" style="width:100%;margin-top:6px" onclick="closeModal()">Tutup</button>`;
  modal.classList.add('on');
}

function kirimOrder(pesananId){
  const p=get('pesanan',pesananId);
  const pel=get('pelanggan',p.pelanggan_id)||{};
  const item=DB.item.filter(i=>i.pesanan_id===p.id);
  sheet.innerHTML=`<h3 style="font-size:20px;margin-bottom:4px">Order tersimpan</h3>
    <p class="hint" style="margin-bottom:14px">${esc(p.nomor)} · ${rp(p.total)}</p>
    <div class="card" style="background:var(--mist);box-shadow:none;padding:14px;white-space:pre-wrap;
      font-size:13px;line-height:1.6;margin-bottom:14px">${esc(rincianOrder(p,{denganHp:true}))}</div>

    <div class="row">
      ${pel.telepon?`<a class="btn" style="flex:1" target="_blank" rel="noopener"
          href="${tautanWa(pel.telepon,pesanPelanggan(p))}">WA Customer</a>`
        :`<button class="btn" style="flex:1" disabled>WA Customer</button>`}
      <button class="btn amber" style="flex:1" onclick="waTerapis('${p.id}')">WA Terapis</button>
    </div>
    ${pel.telepon?'':'<p class="hint" style="margin-top:8px">Nomor HP pelanggan belum diisi.</p>'}
    <p class="hint" style="margin-top:10px">Pesan ke terapis sengaja tidak memuat nomor HP pelanggan.</p>
    <button class="btn ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Selesai</button>`;
  modal.classList.add('on');
}

function formKas(){
  sheet.innerHTML=`<h3 style="font-size:20px;margin-bottom:16px">Catat kas manual</h3>
   <div class="field"><label>Tanggal</label><input type="date" id="k_tgl" value="${today()}"></div>
   <div class="field"><label>Cabang</label><select id="k_cab" ${opsiRef('cabang').length<2?'disabled':''}>${opsiRef('cabang').map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join('')}</select></div>
   <div class="field"><label>Jenis</label><select id="k_jns"><option value="masuk">Kas masuk</option><option value="keluar">Kas keluar</option></select></div>
   <div class="field"><label>Kategori</label><input id="k_kat" placeholder="Modal, setoran, penarikan…"></div>
   <div class="field"><label>Nominal</label><input type="number" id="k_nom"></div>
   <div class="field"><label>Metode</label><select id="k_met"><option>tunai</option><option>transfer</option><option>qris</option></select></div>
   <div class="field"><label>Keterangan</label><textarea id="k_ket" rows="2"></textarea></div>
   <div class="row"><button class="btn" onclick="simpanKas()">Simpan</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button></div>`;
  modal.classList.add('on');
}
async function simpanKas(){
  const n=Number(k_nom.value); if(!n) return toast('Isi nominal');
  await simpan('kas',{id:uid(),tanggal:k_tgl.value,cabang_id:k_cab.value||ME.cabang_id,jenis:k_jns.value,
    kategori:k_kat.value||'Lain-lain',sumber:'manual',nominal:n,metode:k_met.value,keterangan:k_ket.value,dibuat_oleh:ME.id});
  closeModal(); render(); toast('Kas tercatat');
}
</script>
</body>
