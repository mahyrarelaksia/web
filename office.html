h1,h2,h3,.disp{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}

.tagline{color:var(--muted);font-size:13px;margin-bottom:20px}

aside{background:linear-gradient(178deg,#4C8FD6 0%,#2F6FBF 45%,#1F4C86 100%);color:#DCEAF8;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}

.modal.on{display:grid}

/* ---------------------- lapisan penyimpanan ---------------------- */
async function muatSemua(){
  if(!LIVE) return;
  const galat=[];
  for(const k in TBL){
    const {data,error}=await sb.from(TBL[k]).select('*');
    if(error){ console.error('Gagal memuat '+TBL[k]+':',error); galat.push(TBL[k]+' ('+error.message+')'); }
    else DB[k]=data||[];
  }
  if(galat.length){
    console.error('Tabel yang gagal dibaca:',galat);
    toast('Sebagian tabel tidak bisa dibaca. Buka Pengaturan → Diagnosa koneksi.');
  }
  return galat;
}
const GENERATED={item:['subtotal'],izin:['jumlah_hari']};
function bersihkan(key,row){
  const r={...row}; (GENERATED[key]||[]).forEach(f=>delete r[f]);
  if(key==='absensi') ['jam_masuk','jam_pulang'].forEach(f=>{
    if(/^\d{2}:\d{2}$/.test(r[f]||'')) r[f]=String(r.tanggal).slice(0,10)+'T'+r[f]+':00';
  });
  Object.keys(r).forEach(k=>{ if(r[k]==='') r[k]=null; });
  return r;
}
async function simpan(key,row){
  if(LIVE){ const {data,error}=await sb.from(TBL[key]).upsert(bersihkan(key,row)).select().single();
    if(error){ console.error('Gagal menyimpan ke '+TBL[key]+':',error,row);
      toast('Gagal menyimpan ('+TBL[key]+'): '+error.message); return null; }
    const i=DB[key].findIndex(x=>x.id===data.id); i>=0?DB[key][i]=data:DB[key].push(data); return data; }
  const i=DB[key].findIndex(x=>x.id===row.id); i>=0?DB[key][i]=row:DB[key].push(row); return row;
}
async function hapus(key,id){
  if(LIVE){ const {error}=await sb.from(TBL[key]).delete().eq('id',id);
    if(error){ console.error(error); toast('Gagal hapus: '+error.message); return false; } }
  DB[key]=DB[key].filter(x=>x.id!==id); return true;
}

let ME=null, PAGE='dash', SEARCH='';

/* Cari data karyawan milik akun yang baru login.
   Urutan: RPC profil_saya() (bisa menautkan otomatis lewat email) -> muat tabel -> cocokkan manual. */
async function ambilProfil(userId,email){
  let k=null;
  try{
    const {data,error}=await sb.rpc('profil_saya');
    if(!error&&data){ const r=Array.isArray(data)?data[0]:data; if(r&&r.id) k=r; }
  }catch(e){ /* fungsi belum dipasang, lanjut cara biasa */ }
  await muatSemua();
  if(!k) k=DB.karyawan.find(x=>x.user_id===userId)
        ||DB.karyawan.find(x=>String(x.email||'').toLowerCase()===email);
  if(k&&!k.user_id){ const r=await simpan('karyawan',{...k,user_id:userId}); if(r) k=r; }
  return k;
}
async function masuk(){
  const email=em.value.trim().toLowerCase(), pass=pw.value, err=loginErr;
  btnLogin.disabled=true; btnLogin.textContent='Memeriksa…'; err.classList.remove('on');
  try{
    if(LIVE){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw new Error('Email atau kata sandi salah.');
      const k=await ambilProfil(data.user.id,email);
      if(!k) throw new Error('Login berhasil, tetapi email ini belum terhubung ke data karyawan. Jalankan 04_profil_login.sql lalu 03_akun_admin.sql di Supabase, atau minta admin menautkannya lewat menu Karyawan.');
      if(k.role==='terapis') throw new Error('Akun terapis. Gunakan Portal Terapis.');
      if(k.status!=='aktif') throw new Error('Akun nonaktif. Hubungi admin.');
      ME=k;
      if(!DB.karyawan.some(x=>x.id===k.id)) DB.karyawan.push(k);
    }else{
      seedDemo();
      const akun=AKUN_DEMO[email];
      if(!akun||akun.pw!==pass) throw new Error('Email atau kata sandi salah.');
      ME=get('karyawan',akun.id);
    }
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    meName.textContent=ME.nama; meRole.textContent=nm('jabatan',ME.jabatan_id); meAv.textContent=ME.nama[0];
    buildSide(); go('dash');
  }catch(e){ err.textContent=e.message; err.classList.add('on'); }
  btnLogin.disabled=false; btnLogin.textContent='Masuk';
}

let EDIT={mod:null,id:null};
function openForm(key,id){

  modal.classList.add('on');

function fieldHtml(f,v){
  const id='f_'+f.k,t=f.t||'text';let inp;
  if(t==='area')inp=`<textarea id="${id}" rows="2">${esc(v||'')}</textarea>`;
  else if(t==='sel')inp=`<select id="${id}">${f.o.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(t==='ref')inp=`<select id="${id}"><option value="">— pilih —</option>${DB[f.ref].map(o=>`<option value="${o.id}" ${v===o.id?'selected':''}>${esc(o.nama)}</option>`).join('')}</select>`;
  else if(t==='bool')inp=`<select id="${id}"><option value="true" ${v?'selected':''}>Ya</option><option value="false" ${!v?'selected':''}>Tidak</option></select>`;
  else if(t==='date')inp=`<input id="${id}" type="date" value="${v?String(v).slice(0,10):today()}">`;
  else if(t==='time')inp=`<input id="${id}" type="time" value="${v||''}">`;
  else if(t==='num'||t==='rp')inp=`<input id="${id}" type="number" value="${v??''}">`;
  else inp=`<input id="${id}" value="${esc(v||'')}">`;
  return `<div class="field"><label for="${id}">${f.l}</label>${inp}</div>`;
}
async function saveForm(){
  const m=F[EDIT.mod]; const obj=EDIT.id?{...get(EDIT.mod,EDIT.id)}:{id:uid()};
  m.fields.forEach(f=>{const el=document.getElementById('f_'+f.k);let v=el.value;
    if(f.t==='bool')v=v==='true'; else if(f.t==='num'||f.t==='rp')v=Number(v)||0;
    else if(f.t==='ref'&&v==='')v=null;
    obj[f.k]=v;});
  if(!EDIT.id&&EDIT.mod==='pengeluaran') obj.nomor='PG-'+String(DB.pengeluaran.length+1).padStart(4,'0');
  const hasil=await simpan(EDIT.mod,obj);
  if(!hasil) return;                       // pesan galat sudah tampil, jendela tetap terbuka
  await m.after?.(hasil);
  closeModal(); render(); toast('Data tersimpan');
}
async function delRow(key,id){ if(!await hapus(key,id)) return; closeModal(); render(); toast('Data dihapus'); }
function closeModal(){ modal.classList.remove('on'); }
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

function renderModule(key){
  const m=F[key]; let rows=DB[key].filter(dalamLingkup);
  if(SEARCH) rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(SEARCH.toLowerCase()));
  return `<div class="card"><div class="head"><h3>${m.title}</h3>
    <div class="row"><input placeholder="Cari…" style="width:180px" value="${esc(SEARCH)}" oninput="SEARCH=this.value;render()">
      ${boleh(key,'tambah')?`<button class="btn" onclick="openForm('${key}')">Tambah</button>`:''}</div></div>
    ${tableHtml(rows,m.cols,boleh(key,'ubah')?key:null,boleh(key,'ubah')?m.extra:null)}</div>`;
}
function tableHtml(rows,cols,key,extra){
  if(!rows.length) return `<div class="empty"><div class="disp">Belum ada data</div><div>Tambahkan entri pertama lewat tombol di atas.</div></div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c.l||cap(c.k)}</th>`).join('')}${key?'<th></th>':''}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${cols.map(c=>`<td>${cellVal(r,c)}</td>`).join('')}
      ${key?`<td style="text-align:right"><div class="row" style="justify-content:flex-end">
        ${extra?extra(r):''}<button class="btn ghost sm" onclick="openForm('${key}','${r.id}')">Ubah</button></div></td>`:''}
    </tr>`).join('')}</tbody></table></div>`;
}
function cellVal(r,c){ if(c.fn)return c.fn(r); const v=r[c.k];
  if(c.t==='rp')return `<span class="rp">${rp(v)}</span>`; if(c.t==='date')return tgl(v);
  if(c.t==='tag')return tagHtml(v); return esc(v??'-'); }
function tagHtml(v){
  const ok=['aktif','selesai','disetujui','hadir','lunas','dibayar','final','owner','admin'],
        warn=['menunggu','berjalan','telat','draft','izin','cuti','manajer','kasir'],
        bad=['ditolak','alpa','batal','nonaktif','belum'];
  const c=ok.includes(v)?'ok':warn.includes(v)?'warn':bad.includes(v)?'bad':'info';
  return `<span class="tag ${c}">${cap(v||'-')}</span>`;
}
const stat=(l,v,s,cls='')=>`<div class="card stat ${cls}"><div class="lbl">${l}</div><div class="val">${v}</div>${s?`<div class="sub">${s}</div>`:''}</div>`;

function formAkun(karyawanId){
  const k=get('karyawan',karyawanId);

   <div class="err" id="akErr"></div>
   <div class="field"><label>Karyawan</label><input value="${esc(k.nama)} · ${esc(nm('jabatan',k.jabatan_id))}" disabled></div>
   <div class="field"><label for="ak_em">Email login</label><input id="ak_em" type="email" value="${esc(k.email||'')}" placeholder="nama@mahyra.id"></div>
   <div class="field"><label for="ak_pw">Kata sandi ${k.user_id?'baru':''}</label>
     <input id="ak_pw" type="text" value="${k.user_id?'':'mahyra'+Math.floor(1000+Math.random()*9000)}" placeholder="minimal 6 karakter"></div>
   <p class="hint">Catat dan sampaikan kata sandi ini ke terapis. Minta mereka menggantinya setelah masuk pertama kali.
     Bila Edge Function <strong>kelola-akun</strong> belum dipasang, akun tetap dibuat lewat jalur cadangan —
     pastikan opsi <em>Confirm email</em> di Authentication → Providers → Email sudah dimatikan.</p>
   <div class="row" style="margin-top:14px"><button class="btn" id="akBtn" onclick="simpanAkun('${karyawanId}')">${k.user_id?'Perbarui akun':'Buat akun'}</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>
     ${k.user_id?`<button class="btn rose" style="margin-left:auto" onclick="cabutAkun('${karyawanId}')">Cabut akses</button>`:''}</div>`;
  modal.classList.add('on');
}
async function simpanAkun(karyawanId){
  const k=get('karyawan',karyawanId), email=ak_em.value.trim().toLowerCase(), pass=ak_pw.value.trim(), err=akErr;
  err.classList.remove('on');
  if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Format email belum benar.';err.classList.add('on');return}
  if(!k.user_id&&pass.length<6){err.textContent='Kata sandi minimal 6 karakter.';err.classList.add('on');return}
  akBtn.disabled=true; akBtn.textContent='Menyimpan…';
  let catatan='';
  try{
    if(LIVE){
      let hasil=null;
      try{
        const {data,error}=await sb.functions.invoke('kelola-akun',{body:{
          aksi:k.user_id?'ubah':'buat', karyawan_id:k.id, email, password:pass||null, user_id:k.user_id||null}});
        if(error) throw error;
        if(data?.error) throw new Error(data.error);
        hasil={user_id:data.user_id};
      }catch(eFn){
        const pesan=await pesanEdge(eFn);
        console.warn('kelola-akun gagal:',pesan,eFn);
        // Fungsi menjawab tapi menolak -> tampilkan alasan aslinya
        if(!edgeTidakAda(eFn)) throw new Error(pesan+petunjukEdge(pesan));
        console.warn('Edge Function kelola-akun tidak tersedia, memakai jalur cadangan.',eFn);
        if(k.user_id){
          if(email!==String(k.email||'').toLowerCase())
            throw new Error('Mengubah alamat email butuh Edge Function "kelola-akun". Pasang dulu lewat Dashboard → Edge Functions, atau ubah emailnya langsung di Authentication → Users.');
          const {error:eR}=await sb.auth.resetPasswordForEmail(email);
          if(eR) throw new Error(eR.message);
          hasil={user_id:k.user_id};
          catatan=' Tautan atur ulang sandi dikirim ke email terapis.';
        }else{
          const r=await buatAkunTanpaFungsi(email,pass);
          hasil={user_id:r.user_id};
          if(r.perluKonfirmasi) catatan=' Terapis harus mengeklik tautan konfirmasi di emailnya dulu. Untuk melewati langkah ini, matikan "Confirm email" di Authentication → Providers → Email.';
        }
      }
      await simpan('karyawan',{...k,email,user_id:hasil.user_id});
    }else{
      if(AKUN_DEMO[email]&&AKUN_DEMO[email].id!==k.id) throw new Error('Email sudah dipakai karyawan lain.');
      await simpan('karyawan',{...k,email,user_id:k.user_id||'u_'+uid()});
      AKUN_DEMO[email]={pw:pass,id:k.id};
    }
    closeModal(); render();
    toast('Akun siap: '+email+(pass&&!catatan?' / '+pass:'')+catatan);
  }catch(e){ err.textContent=e.message; err.classList.add('on'); }
  akBtn.disabled=false; akBtn.textContent='Simpan';
}

/* Apakah kegagalan ini karena Edge Function belum terpasang / tak terjangkau? */
function edgeTidakAda(e){
  const p=(e?.name||'')+' '+(e?.message||'');
  return /FunctionsFetchError|Failed to send|Failed to fetch|NetworkError/i.test(p);
}

/* supabase-js menyembunyikan isi jawaban saat status non-2xx; ambil pesan aslinya. */
async function pesanEdge(e){
  const ctx=e?.context;
  if(ctx){
    try{ const j=await ctx.clone().json(); if(j&&(j.error||j.message)) return String(j.error||j.message); }catch(_){}
    try{ const s=await ctx.clone().text(); if(s) return (ctx.status?ctx.status+' — ':'')+s.slice(0,300); }catch(_){}
    if(ctx.status) return 'Fungsi menjawab dengan status '+ctx.status+'.';
  }
  return e?.message||String(e);
}

/* Saran perbaikan berdasarkan pesan yang diterima */
function petunjukEdge(p){
  const s=String(p).toLowerCase();
  if(/hanya owner|403|forbidden/.test(s))
    return ' — Akun Anda belum terbaca sebagai owner/admin/manajer oleh fungsi tersebut. Jalankan 05_perbaikan_akses.sql lalu 03_akun_admin.sql, keluar, dan login ulang.';
  if(/belum masuk|401|unauthorized|jwt/.test(s))
    return ' — Sesi tidak terkirim. Coba keluar lalu login ulang. Jika masih sama, matikan opsi "Verify JWT" pada fungsi kelola-akun, atau pasang ulang versi terbaru kelola-akun.ts.';
  if(/service_role|env|undefined/.test(s))
    return ' — Fungsi kekurangan variabel lingkungan. Pasang ulang memakai kelola-akun.ts versi terbaru.';
  if(/already registered|already been registered|duplicate/.test(s))
    return ' — Email ini sudah terdaftar di Authentication. Pakai email lain, atau tautkan user yang ada lewat SQL.';
  return '';
}

/* Jalur cadangan: buat akun lewat signUp pada klien terpisah,
   supaya sesi admin yang sedang login tidak ikut tergantikan. */
async function buatAkunTanpaFungsi(email,password){
  const tamu=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,
    {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'mahyra-tamu'}});
  const {data,error}=await tamu.auth.signUp({email,password});
  if(error) throw new Error(error.message);
  if(!data.user) throw new Error('Akun tidak terbentuk. Periksa pengaturan Authentication di Supabase.');
  return {user_id:data.user.id, perluKonfirmasi:!data.session};
}
async function cabutAkun(karyawanId){
  const k=get('karyawan',karyawanId); let catatan='';
  if(LIVE){
    try{
      const {error}=await sb.functions.invoke('kelola-akun',{body:{aksi:'hapus',user_id:k.user_id}});
      if(error) throw error;
    }catch(e){
      if(!edgeTidakAda(e)) return toast('Gagal mencabut akses: '+await pesanEdge(e));
      catatan=' Akun auth-nya masih ada; hapus manual di Authentication → Users bila perlu.';
    }
  }
  await simpan('karyawan',{...k,user_id:null});
  closeModal(); render(); toast('Akses login dicabut.'+catatan);
}

/* ----------------------- pengelolaan izin ----------------------- */
let AKSES_JBT=null;
function izinBaris(jabatanId,modul){
  return DB.hak_akses.find(x=>x.jabatan_id===jabatanId&&x.modul===modul)
      || {jabatan_id:jabatanId,modul,lihat:false,tambah:false,ubah:false,hapus:false};
}
async function setIzin(modul,aksi,nilai){
  const lama=izinBaris(AKSES_JBT,modul);
  const baru={...lama,id:lama.id||uid(),[aksi]:nilai};
  if(nilai&&aksi!=='lihat') baru.lihat=true;              // tidak bisa mengubah tanpa melihat
  if(!nilai&&aksi==='lihat'){ baru.tambah=false; baru.ubah=false; baru.hapus=false; }
  const hasil=await simpan('hak_akses',baru);
  if(!hasil) return;
  render(); toast('Izin '+modul+' diperbarui');
}
async function terapkanPreset(jenis){
  for(const [m] of MODUL){
    const lama=izinBaris(AKSES_JBT,m);
    const nilai = jenis==='penuh' ? {lihat:true,tambah:true,ubah:true,hapus:true}
                : jenis==='baca'  ? {lihat:true,tambah:false,ubah:false,hapus:false}
                :                   {lihat:false,tambah:false,ubah:false,hapus:false};
    await simpan('hak_akses',{...lama,id:lama.id||uid(),jabatan_id:AKSES_JBT,modul:m,...nilai});
  }
  render(); toast('Izin jabatan diperbarui');
}
async function setLingkup(jabatanId,nilai){
  const j=get('jabatan',jabatanId);
  const hasil=await simpan('jabatan',{...j,lingkup:nilai});
  if(!hasil) return;
  render(); toast('Lingkup '+j.nama+' menjadi '+nilai);
}

/* Pemeriksaan koneksi & hak akses ke Supabase */
async function diagnosa(){
  const el=document.getElementById('hasilDiag');
  if(!LIVE){ el.innerHTML='<p class="hint">Aplikasi sedang berjalan dalam mode demo.</p>'; return; }
  el.innerHTML='<p class="hint">Memeriksa…</p>';
  const baris=[];
  const {data:{user}}=await sb.auth.getUser();
  baris.push({item:'Akun login',hasil:user?user.email:'tidak ada sesi',ok:!!user});
  const {data:prof,error:e0}=await sb.rpc('profil_saya');
  const p=Array.isArray(prof)?prof[0]:prof;
  baris.push({item:'profil_saya()',hasil:e0?'GAGAL: '+e0.message:(p&&p.id?p.nama+' · role '+p.role:'kosong — belum ada data karyawan'),ok:!e0&&!!(p&&p.id)});

  const {data:ak,error:e1}=await sb.rpc('cek_akses');
  const a=Array.isArray(ak)?ak[0]:ak;
  baris.push({item:'Hak akses (cek_akses)',
    hasil: e1 ? 'GAGAL: '+e1.message+' — jalankan 07_perbaiki_policy.sql'
         : !a ? 'kosong'
         : (a.peran_kantor ? 'peran '+a.peran+' · status '+a.status+' · diakui sebagai peran kantor'
                           : 'peran '+a.peran+' · status '+a.status+' · BELUM diakui sebagai peran kantor'),
    ok: !e1 && !!(a && a.peran_kantor)});

  const uji={id:crypto.randomUUID?crypto.randomUUID():uid(),kode:'ZZ-UJI',nama:'__uji tulis__',tipe:'lainnya'};
  const {error:e2}=await sb.from('kategori_pengeluaran').insert({id:uji.id,nama:'__uji tulis__',tipe:'lainnya'});
  baris.push({item:'Uji tulis (insert)',hasil:e2?'GAGAL: '+e2.message:'berhasil',ok:!e2});
  if(!e2) await sb.from('kategori_pengeluaran').delete().eq('id',uji.id);
  for(const k of Object.keys(TBL)){
    const {count,error}=await sb.from(TBL[k]).select('*',{count:'exact',head:true});
    baris.push({item:TBL[k],hasil:error?'GAGAL: '+error.message:count+' baris',ok:!error});
  }
  el.innerHTML=tableHtml(baris,[{k:'item',l:'Yang diperiksa'},
    {k:'hasil',l:'Hasil',fn:r=>`<span class="tag ${r.ok?'ok':'bad'}">${esc(r.hasil)}</span>`}]);
}

/* --------------------------- aksi --------------------------- */
async function putusIzin(id,st){
  const i={...get('izin',id),status:st,approver_id:ME.id,tgl_approve:today()};
  await simpan('izin',i);
  if(st==='disetujui'){
    const d=new Date(i.tgl_mulai), akhir=new Date(i.tgl_selesai);
    while(d<=akhir){ const t=d.toISOString().slice(0,10);
      if(!DB.absensi.some(a=>a.karyawan_id===i.karyawan_id&&String(a.tanggal).slice(0,10)===t))
        await simpan('absensi',{id:uid(),karyawan_id:i.karyawan_id,cabang_id:get('karyawan',i.karyawan_id)?.cabang_id,
          tanggal:t,status:i.jenis==='sakit'?'sakit':i.jenis==='cuti'?'cuti':'izin',menit_telat:0,catatan:i.alasan});
      d.setDate(d.getDate()+1); }
  }
  render(); toast('Pengajuan '+st);
}
async function hitungGaji(){
  if(LIVE){ const {error}=await sb.rpc('generate_gaji',{p_periode:periode()});
    if(error) return toast('Gagal: '+error.message);
    const {data}=await sb.from('gaji').select('*'); DB.gaji=data||[]; render(); return toast('Gaji dihitung'); }
  const HK=26;
  for(const k of DB.karyawan.filter(x=>x.status==='aktif')){
    const hadir=DB.absensi.filter(a=>a.karyawan_id===k.id&&String(a.tanggal).startsWith(periode())&&['hadir','telat'].includes(a.status)).length;
    const kom=sum(DB.komisi.filter(c=>c.karyawan_id===k.id&&c.periode===periode()),'nominal');
    const bon=sum(DB.bonus.filter(b=>b.karyawan_id===k.id&&b.periode===periode()&&b.status==='disetujui'),'nominal');
    const ksb=sum(DB.kasbon.filter(x=>x.karyawan_id===k.id&&x.status==='disetujui'&&x.sisa>0),'cicilan');
    const um=(get('jabatan',k.jabatan_id)?.uang_makan_harian||0)*hadir;
    const pot=hadir<HK?Math.round(k.gaji_pokok/HK)*(HK-hadir):0;
    const lama=DB.gaji.find(g=>g.periode===periode()&&g.karyawan_id===k.id);
    if(lama&&lama.status!=='draft') continue;
    await simpan('gaji',{id:lama?.id||uid(),periode:periode(),karyawan_id:k.id,hari_kerja:HK,hari_hadir:hadir,
      gaji_pokok:k.gaji_pokok,tunjangan:k.tunjangan,uang_makan:um,total_komisi:kom,total_bonus:bon,
      potongan_absen:pot,potongan_kasbon:ksb,total_terima:k.gaji_pokok+k.tunjangan+um+kom+bon-pot-ksb,status:'draft'});
  }
  render(); toast('Gaji periode '+periode()+' dihitung');
}
async function bayarGaji(){
  for(const g of DB.gaji.filter(x=>x.periode===periode())){
    await simpan('gaji',{...g,status:'dibayar',tgl_bayar:today()});
    await simpan('kas',{id:uid(),tanggal:today(),cabang_id:get('karyawan',g.karyawan_id)?.cabang_id,jenis:'keluar',
      kategori:'Gaji & Tunjangan',sumber:'gaji',ref_id:g.id,nominal:g.total_terima,metode:'transfer',
      keterangan:'Gaji '+g.periode+' — '+nm('karyawan',g.karyawan_id)});
  }
  for(const c of DB.komisi.filter(x=>x.periode===periode()&&!x.dibayar)) await simpan('komisi',{...c,dibayar:true});
  for(const b of DB.bonus.filter(x=>x.periode===periode()&&!x.dibayar)) await simpan('bonus',{...b,dibayar:true});
  render(); toast('Gaji ditandai dibayar dan tercatat di kas');
}
function formOrder(){
  sheet.innerHTML=`<h3 style="font-size:20px;margin-bottom:4px">Buat order</h3>
   <p class="hint" style="margin-bottom:16px">Pilih pelanggan, layanan, dan terapis yang menangani.</p>
   <div class="field"><label>Cabang</label><select id="o_cab">${DB.cabang.map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join('')}</select></div>
   <div class="field"><label>Pelanggan</label><select id="o_pel">${DB.pelanggan.map(p=>`<option value="${p.id}">${esc(p.nama)}</option>`).join('')}</select></div>
   <div class="field"><label>Layanan</label><select id="o_lay">${DB.layanan.filter(l=>l.aktif).map(l=>`<option value="${l.id}">${esc(l.nama)} — ${rp(l.harga)}</option>`).join('')}</select></div>
   <div class="field"><label>Terapis</label><select id="o_ter">${DB.karyawan.filter(k=>k.role==='terapis').map(k=>`<option value="${k.id}">${esc(k.nama)}</option>`).join('')}</select></div>
   <div class="grid g2"><div class="field"><label>Ruangan</label><input id="o_room" value="Room 1"></div>
     <div class="field"><label>Diskon</label><input id="o_disk" type="number" value="0"></div></div>
   <div class="field"><label>Metode bayar</label><select id="o_bayar"><option>tunai</option><option>qris</option><option>transfer</option><option>debit</option></select></div>
   <div class="field"><label>Catatan</label><textarea id="o_cat" rows="2" placeholder="Permintaan khusus pelanggan"></textarea></div>
   <div class="row"><button class="btn" onclick="simpanOrder()">Simpan order</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button></div>`;
  modal.classList.add('on');
}
async function simpanOrder(){
  const l=get('layanan',o_lay.value), disk=Number(o_disk.value)||0, cab=get('cabang',o_cab.value);
  const n=DB.pesanan.filter(p=>String(p.tanggal).slice(0,10)===today()).length+1;
  const p={id:uid(),nomor:'MHR-'+cab.kode+'-'+today().slice(2).replace(/-/g,'')+'-'+String(n).padStart(4,'0'),
    tanggal:today(),jam:jam(),cabang_id:cab.id,pelanggan_id:o_pel.value,kasir_id:ME.id,status:'berjalan',
    subtotal:l.harga,diskon:disk,total:l.harga-disk,metode_bayar:o_bayar.value,status_bayar:'belum',catatan:o_cat.value};
  await simpan('pesanan',p);
  await simpan('item',{id:uid(),pesanan_id:p.id,layanan_id:l.id,terapis_id:o_ter.value,ruangan:o_room.value,qty:1,
    harga:l.harga,durasi:l.durasi_menit,subtotal:l.harga,komisi:Math.round((l.harga-disk)*l.komisi_persen/100),status:'menunggu'});
  closeModal(); render(); toast('Order '+p.nomor+' dibuat');
}
function formKas(){
  sheet.innerHTML=`<h3 style="font-size:20px;margin-bottom:16px">Catat kas manual</h3>
   <div class="field"><label>Tanggal</label><input type="date" id="k_tgl" value="${today()}"></div>
   <div class="field"><label>Cabang</label><select id="k_cab">${DB.cabang.map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join('')}</select></div>
   <div class="field"><label>Jenis</label><select id="k_jns"><option value="masuk">Kas masuk</option><option value="keluar">Kas keluar</option></select></div>
   <div class="field"><label>Kategori</label><input id="k_kat" placeholder="Modal, setoran, penarikan…"></div>
   <div class="field"><label>Nominal</label><input type="number" id="k_nom"></div>
   <div class="field"><label>Metode</label><select id="k_met"><option>tunai</option><option>transfer</option><option>qris</option></select></div>
   <div class="field"><label>Keterangan</label><textarea id="k_ket" rows="2"></textarea></div>
   <div class="row"><button class="btn" onclick="simpanKas()">Simpan</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button></div>`;
  modal.classList.add('on');
}
async function simpanKas(){
  const n=Number(k_nom.value); if(!n) return toast('Isi nominal');
  await simpan('kas',{id:uid(),tanggal:k_tgl.value,cabang_id:k_cab.value,jenis:k_jns.value,
    kategori:k_kat.value||'Lain-lain',sumber:'manual',nominal:n,metode:k_met.value,keterangan:k_ket.value,dibuat_oleh:ME.id});
  closeModal(); render(); toast('Kas tercatat');
}
