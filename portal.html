<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahyra Relaksia — Home Wellness & Therapy</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:#1E3356;min-height:100vh;display:grid;place-items:center;padding:24px;
 background:radial-gradient(130% 100% at 50% 0%,#8FC6EC 0%,#4C8FD6 42%,#1F4C86 100%)}
.wrap{background:#fff;border-radius:26px;padding:36px 32px;max-width:520px;width:100%;
 box-shadow:0 24px 60px rgba(20,52,100,.28);text-align:center}
.logo{width:112px;height:112px;margin:0 auto 12px;border-radius:26px;display:grid;place-items:center;background:#fff;
 border:1px solid #E4EBF5;padding:8px;box-shadow:0 12px 28px rgba(47,111,191,.18)}
.logo img{width:100%;height:100%;object-fit:contain}
h1{font-family:Fraunces,Georgia,serif;font-size:27px;letter-spacing:-.01em}
.sub{color:#7A8CA8;font-size:13.5px;margin:4px 0 26px}
.pilih{display:grid;gap:12px}
a.portal{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:inherit;
 border:1px solid #E4EBF5;border-radius:18px;padding:16px 18px;transition:.18s}
a.portal:hover{border-color:#4C8FD6;background:#F6FAFE;transform:translateY(-2px);box-shadow:0 10px 26px rgba(31,64,120,.1)}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px;color:#fff;flex:none}
.ic.o{background:linear-gradient(150deg,#2F6FBF,#1F4C86)}
.ic.t{background:linear-gradient(150deg,#8FC6EC,#4C8FD6)}
.portal strong{display:block;font-size:15px}
.portal span{font-size:12.5px;color:#7A8CA8}
.foot{margin-top:24px;font-size:12px;color:#94A5BE}
@media(max-width:480px){.wrap{padding:28px 22px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="logo.png" alt="Mahyra Relaksia"></div>
  <h1>Mahyra Relaksia</h1>
  <p class="sub">Home Wellness &amp; Therapy</p>
  <div class="pilih">
    <a class="portal" href="/office"><span class="ic o">◈</span>
      <span><strong>Portal Office</strong><span>Order, karyawan, kas, komisi, gaji, dan laporan</span></span></a>
    <a class="portal" href="/terapis"><span class="ic t">✓</span>
      <span><strong>Portal Terapis</strong><span>Absensi, kerjaan, komisi, bonus, izin, dan slip gaji</span></span></a>
  </div>
  <p class="foot">Butuh akun? Hubungi admin cabang Anda.</p>
</div>
</body>
</html>
