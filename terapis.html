const GENERATED={item:['subtotal'],izin:['jumlah_hari']};
function bersihkan(key,row){
  const r={...row}; (GENERATED[key]||[]).forEach(f=>delete r[f]);
  if(key==='absensi') ['jam_masuk','jam_pulang'].forEach(f=>{
    if(/^\d{2}:\d{2}$/.test(r[f]||'')) r[f]=String(r.tanggal).slice(0,10)+'T'+r[f]+':00';
  });
  Object.keys(r).forEach(k=>{ if(r[k]==='') r[k]=null; });
  return r;
}
async function simpan(key,row){
  if(LIVE){ const {data,error}=await sb.from(TBL[key]).upsert(bersihkan(key,row)).select().single();
    if(error){toast('Gagal menyimpan: '+error.message);return null}
    const i=DB[key].findIndex(x=>x.id===data.id); i>=0?DB[key][i]=data:DB[key].push(data); return data; }
  const i=DB[key].findIndex(x=>x.id===row.id); i>=0?DB[key][i]=row:DB[key].push(row); return row;
}

let ME=null, PAGE='dash';

/* Cari data karyawan milik akun yang baru login.
   Urutan: RPC profil_saya() (bisa menautkan otomatis lewat email) -> muat tabel -> cocokkan manual. */
async function ambilProfil(userId,email){
  let k=null;
  try{
    const {data,error}=await sb.rpc('profil_saya');
    if(!error&&data){ const r=Array.isArray(data)?data[0]:data; if(r&&r.id) k=r; }
  }catch(e){ /* fungsi belum dipasang, lanjut cara biasa */ }
  await muatSemua();
  if(!k) k=DB.karyawan.find(x=>x.user_id===userId)
        ||DB.karyawan.find(x=>String(x.email||'').toLowerCase()===email);
  if(k&&!k.user_id){ const r=await simpan('karyawan',{...k,user_id:userId}); if(r) k=r; }
  return k;
}
async function masuk(){
  const email=em.value.trim().toLowerCase(), pass=pw.value, err=loginErr;
  btnLogin.disabled=true; btnLogin.textContent='Memeriksa…'; err.classList.remove('on');
  try{
    if(LIVE){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw new Error('Email atau kata sandi salah.');
      const k=await ambilProfil(data.user.id,email);
      if(!k) throw new Error('Login berhasil, tetapi email ini belum terhubung ke data karyawan. Minta admin membuatkan akun lewat menu Karyawan di Portal Office.');
      if(k.role!=='terapis') throw new Error('Akun kantor. Gunakan Portal Office.');
      if(k.status!=='aktif') throw new Error('Akun nonaktif. Hubungi admin.');
      ME=k;
      if(!DB.karyawan.some(x=>x.id===k.id)) DB.karyawan.push(k);
    }else{
      seedDemo(); const akun=AKUN_DEMO[email];
      if(!akun||akun.pw!==pass) throw new Error('Email atau kata sandi salah.');
      ME=get('karyawan',akun.id);
    }
    bukaAplikasi();
  }catch(e){ err.textContent=e.message; err.classList.add('on'); }
  btnLogin.disabled=false; btnLogin.textContent='Masuk';
}
function bukaAplikasi(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  meName.textContent=ME.nama;
  meRole.textContent=nm('jabatan',ME.jabatan_id)+' · '+nm('cabang',ME.cabang_id);
  meAv.textContent=ME.nama[0];

}

/* Sesi disimpan di perangkat, jadi terapis tidak perlu login ulang tiap
   kali membuka aplikasi untuk check in. Keluar dari menu Lainnya. */
(async function pulihkanSesi(){
  if(!LIVE) return;
  const kotak=document.getElementById('login');
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return;
    kotak.querySelector('.card-login').innerHTML=
      '<p class="hint" style="text-align:center;padding:20px">Membuka sesi Anda…</p>';

function tableHtml(rows,cols){
  if(!rows.length) return `<div class="empty"><div class="disp">Belum ada data</div><div>Riwayat akan muncul di sini.</div></div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c.l||cap(c.k)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${cols.map(c=>`<td>${cellVal(r,c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function cellVal(r,c){ if(c.fn)return c.fn(r); const v=r[c.k];
  if(c.t==='rp')return `<span class="rp">${rp(v)}</span>`; if(c.t==='date')return tgl(v);
  if(c.t==='tag')return tagHtml(v); return esc(v??'-'); }
function tagHtml(v){
  const ok=['aktif','selesai','disetujui','hadir','dibayar','final'],
        warn=['menunggu','berjalan','telat','draft','izin','cuti','belum'],
        bad=['ditolak','alpa','batal','nonaktif','sakit'];
  const c=ok.includes(v)?'ok':warn.includes(v)?'warn':bad.includes(v)?'bad':'info';
  return `<span class="tag ${c}">${cap(v||'-')}</span>`;
}
const stat=(l,v,s,cls='')=>`<div class="card stat ${cls}"><div class="lbl">${l}</div><div class="val">${v}</div>${s?`<div class="sub">${s}</div>`:''}</div>`;

function rekapHarian(log){
  const peta={};
  log.forEach(a=>{
    const d=String(a.tanggal).slice(0,10);
    peta[d]=peta[d]||{id:d,tanggal:d,masuk:null,pulang:null,jml:0};
    const w=jamDari(a.waktu);
    if(a.tipe==='masuk'){ if(!peta[d].masuk||w<peta[d].masuk) peta[d].masuk=w; peta[d].jml++; }
    else { if(!peta[d].pulang||w>peta[d].pulang) peta[d].pulang=w; }
  });
  return Object.values(peta).map(r=>({...r,masuk:r.masuk||'--.--',pulang:r.pulang||'--.--'}))
    .sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
}

/* ================= KAMERA DEPAN + TITIK GPS ================= */
let KAM={aliran:null,foto:null,posisi:null,alamat:'',item:null,tipe:'masuk'};

async function bukaAbsen(itemId,tipe){
  KAM={aliran:null,foto:null,posisi:null,alamat:'Mencari lokasi…',item:itemId,tipe};
  const i=get('item',itemId), l=i?get('layanan',i.layanan_id):null;
  sheet.innerHTML=`<h3 style="font-size:19px;margin-bottom:3px">${tipe==='masuk'?'Check in':'Check out'} pekerjaan</h3>
    <p class="hint" style="margin-bottom:14px">${esc(l?.nama||'-')} · ${esc(get('pesanan',i?.pesanan_id)?.nomor||'')}</p>
    <div class="kam" id="kotakKam">
      <video id="vid" autoplay playsinline muted></video>
      <div class="sinyal" id="sinyal">Menyalakan kamera depan…</div>
    </div>
    <button class="btn besar blok" id="btnJepret" onclick="jepret()">Ambil foto</button>
    <button class="btn ghost blok" style="margin-top:8px" onclick="tutupAbsen()">Batal</button>
    <p class="hint" style="margin-top:10px">Foto dan titik lokasi tercatat sebagai bukti kehadiran.</p>`;
  modal.classList.add('on');
  nyalakanKamera(); ambilLokasi();
}
function tutupAbsen(){ if(KAM.aliran) KAM.aliran.getTracks().forEach(t=>t.stop()); KAM.aliran=null; closeModal(); }

async function nyalakanKamera(){
  try{
    KAM.aliran=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720}},audio:false});
    const v=document.getElementById('vid'); if(v){ v.srcObject=KAM.aliran; }
    tulisSinyal();
  }catch(e){
    document.getElementById('kotakKam').innerHTML=
      `<div style="color:#fff;padding:24px;text-align:center;font-size:13.5px">Kamera tidak bisa dibuka.<br>
       Izinkan akses kamera di peramban, lalu coba lagi.<br><span style="opacity:.7">${esc(e.message||'')}</span></div>`;
    const b=document.getElementById('btnJepret');
    if(b){ b.className='btn besar blok'; b.textContent='Lanjut tanpa foto'; b.onclick=()=>{KAM.foto=null;kirimAbsen();}; }
  }
}
function ambilLokasi(){
  if(!navigator.geolocation){ KAM.alamat='Perangkat tidak mendukung GPS'; return tulisSinyal(); }
  navigator.geolocation.getCurrentPosition(async p=>{
    KAM.posisi={lat:p.coords.latitude,lng:p.coords.longitude,akurasi:Math.round(p.coords.accuracy)};
    KAM.alamat='Menerjemahkan alamat…'; tulisSinyal();
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${p.coords.latitude}&lon=${p.coords.longitude}&accept-language=id`);
      const j=await r.json();
      KAM.alamat=j.display_name||`${KAM.posisi.lat.toFixed(5)}, ${KAM.posisi.lng.toFixed(5)}`;
    }catch(_){ KAM.alamat=`${KAM.posisi.lat.toFixed(5)}, ${KAM.posisi.lng.toFixed(5)}`; }
    tulisSinyal();
  },e=>{ KAM.alamat='Lokasi tidak diizinkan'; tulisSinyal(); },{enableHighAccuracy:true,timeout:12000});
}
function tulisSinyal(){
  const s=document.getElementById('sinyal'); if(!s) return;
  const a=KAM.posisi?` · ±${KAM.posisi.akurasi} m`:'';
  s.innerHTML=`<strong>${jam()}</strong> · ${new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}${a}
    <br>${esc(KAM.alamat||'—')}`;
}
function jepret(){
  const v=document.getElementById('vid');
  if(!v||!v.videoWidth) return toast('Kamera belum siap');
  const lebar=320, tinggi=Math.round(v.videoHeight/v.videoWidth*lebar);
  const c=document.createElement('canvas'); c.width=lebar; c.height=tinggi;
  const x=c.getContext('2d'); x.translate(lebar,0); x.scale(-1,1);
  x.drawImage(v,0,0,lebar,tinggi);
  KAM.foto=c.toDataURL('image/jpeg',0.42);   // sekitar 15 KB, cukup untuk bukti wajah
  document.getElementById('kotakKam').innerHTML=
    `<img src="${KAM.foto}" alt="Foto absensi" style="transform:none">
     <div class="sinyal">${jam()} · ${esc(KAM.alamat||'—')}</div>`;
  const b=document.getElementById('btnJepret');
  b.className='btn besar blok';
  b.textContent=KAM.tipe==='masuk'?'Kirim check in':'Kirim check out'; b.onclick=kirimAbsen;
}
async function kirimAbsen(){
  const b=document.getElementById('btnJepret'); if(b){b.disabled=true;b.textContent='Mengirim…';}
  const p=KAM.posisi||{};
  if(LIVE){
    // satu parameter jsonb: menghindari galat penentuan tipe saat ada nilai kosong
    const muatan={item:KAM.item,tipe:KAM.tipe,foto:KAM.foto||null,
      lat:p.lat??null,lng:p.lng??null,alamat:KAM.alamat||null,akurasi:p.akurasi??null};
    let {error}=await sb.rpc('absen_order',{p:muatan});
    if(error){
      console.warn('absen_order gagal, memakai jalur cadangan:',error.message);
      const cadangan=await absenCadangan(muatan);
      if(cadangan){ if(b){b.disabled=false;b.className='btn besar blok';b.textContent='Coba lagi';} return toast('Gagal: '+cadangan); }
    }
    await muatTabel(['absen_log','item','absensi','komisi']);
  }else{
    DB.absen_log.push({id:uid(),karyawan_id:ME.id,pesanan_item_id:KAM.item,cabang_id:ME.cabang_id,
      tanggal:today(),tipe:KAM.tipe,waktu:new Date().toISOString(),foto:KAM.foto,
      lat:p.lat,lng:p.lng,alamat:KAM.alamat,akurasi_meter:p.akurasi});
    const i=get('item',KAM.item);
    if(KAM.tipe==='masuk'){ await simpan('item',{...i,status:'berjalan',jam_mulai:new Date().toISOString()}); }
    else { await selesaikanItem(i); }
    let a=DB.absensi.find(x=>x.karyawan_id===ME.id&&String(x.tanggal).slice(0,10)===today());
    const log=DB.absen_log.filter(x=>x.karyawan_id===ME.id&&x.tanggal===today());
    const masuk=log.find(x=>x.tipe==='masuk'), pulang=[...log].reverse().find(x=>x.tipe==='pulang');
    await simpan('absensi',{...(a||{id:uid(),karyawan_id:ME.id,cabang_id:ME.cabang_id,tanggal:today(),menit_telat:0}),
      jam_masuk:masuk?new Date(masuk.waktu).toTimeString().slice(0,5):'',
      jam_pulang:pulang?new Date(pulang.waktu).toTimeString().slice(0,5):'',status:'hadir'});
  }
  tutupAbsen(); render();
  toast(KAM.tipe==='masuk'?'Check in tercatat':'Check out tercatat, pekerjaan selesai');
}
/* Jalur cadangan bila fungsi absen_order belum terpasang di database:
   tulis langsung ke tabel, lalu perbarui status pekerjaannya. */
async function absenCadangan(m){
  const item=get('item',m.item);
  const {error:e1}=await sb.from('absen_log').insert({
    karyawan_id:ME.id,pesanan_item_id:m.item,cabang_id:ME.cabang_id,tanggal:today(),
    tipe:m.tipe,waktu:new Date().toISOString(),foto:m.foto,lat:m.lat,lng:m.lng,
    alamat:m.alamat,akurasi_meter:m.akurasi});
  if(e1) return e1.message+' — jalankan 12_absen_order.sql di SQL Editor.';
  const patch = m.tipe==='masuk'
    ? {status:'berjalan',jam_mulai:new Date().toISOString()}
    : {status:'selesai', jam_selesai:new Date().toISOString()};
  const {error:e2}=await sb.from('pesanan_item').update(patch).eq('id',m.item);
  if(e2) return e2.message;
  return null;
}

/* penyelesaian pekerjaan (dipakai mode demo) */
async function selesaikanItem(i){
  const l=get('layanan',i.layanan_id), j=get('jabatan',ME.jabatan_id);
  const tipe=ME.tipe_gaji||j?.tipe_gaji||'bulanan';
  const fee=ME.fee_per_order??j?.fee_per_order??0;
  const persen=ME.persen_komisi||j?.persen_komisi||l?.komisi_persen||0;
  const komisi=fee>0?fee*(i.qty||1):Math.round((i.subtotal||i.harga)*persen/100);
  await simpan('item',{...i,status:'selesai',jam_selesai:new Date().toISOString(),komisi});
  if(!DB.komisi.some(c=>c.item_id===i.id))
    await simpan('komisi',{id:uid(),karyawan_id:ME.id,item_id:i.id,tanggal:today(),periode:periode(),
      dasar:i.subtotal||i.harga,persen:fee>0?0:persen,nominal:komisi,dibayar:false});
  const p=get('pesanan',i.pesanan_id);
  if(p&&DB.item.filter(x=>x.pesanan_id===p.id).every(x=>x.status==='selesai'))
    await simpan('pesanan',{...p,status:'selesai'});
}

async function selesaiKerja(id){
  const i=get('item',id), l=get('layanan',i.layanan_id);
  const persen=l?.komisi_persen||ME.persen_komisi||0, komisi=Math.round((i.subtotal||i.harga)*persen/100);
  await simpan('item',{...i,status:'selesai',jam_selesai:new Date().toISOString(),komisi});
  if(!LIVE&&!DB.komisi.some(c=>c.item_id===i.id))
    await simpan('komisi',{id:uid(),karyawan_id:ME.id,item_id:i.id,tanggal:today(),periode:periode(),
      dasar:i.subtotal||i.harga,persen,nominal:komisi,dibayar:false});
  const p=get('pesanan',i.pesanan_id);
  if(p&&DB.item.filter(x=>x.pesanan_id===p.id).every(x=>x.status==='selesai'))
    await simpan('pesanan',{...p,status:'selesai'});
  if(LIVE) await muatSemua();
  render(); toast('Selesai. Komisi '+rp(komisi)+' tercatat');
}
async function absenMasuk(){
  const jd=DB.jadwal.find(j=>j.karyawan_id===ME.id&&String(j.tanggal).slice(0,10)===today());
  const sh=jd?get('shift',jd.shift_id):null;
  let telat=0, st='hadir';
  if(sh){ const [h,m]=sh.jam_masuk.split(':').map(Number); const now=new Date();
    const batas=new Date(now); batas.setHours(h,m,0,0);
    telat=Math.max(0,Math.round((now-batas)/60000)-(sh.toleransi_menit||0)); if(telat>0) st='telat'; }
  if(LIVE){ const {error}=await sb.rpc('absen_masuk',{p_karyawan:ME.id,p_cabang:ME.cabang_id,p_lokasi:nm('cabang',ME.cabang_id)});
    if(error) return toast('Gagal absen: '+error.message);
    const {data}=await sb.from('absensi').select('*'); DB.absensi=data||[];
  }else{
    const ada=DB.absensi.find(a=>a.karyawan_id===ME.id&&String(a.tanggal).slice(0,10)===today());
    await simpan('absensi',ada?{...ada,jam_masuk:ada.jam_masuk||jam()}:
      {id:uid(),karyawan_id:ME.id,cabang_id:ME.cabang_id,shift_id:jd?.shift_id,tanggal:today(),
       jam_masuk:jam(),jam_pulang:'',status:st,menit_telat:telat,lokasi_masuk:nm('cabang',ME.cabang_id)});
  }
  render(); toast(st==='telat'?`Absen tercatat, telat ${telat} menit`:'Absen masuk tercatat');
}
async function absenPulang(){
  if(LIVE){ const {error}=await sb.rpc('absen_pulang',{p_karyawan:ME.id,p_lokasi:nm('cabang',ME.cabang_id)});
    if(error) return toast('Gagal: '+error.message);
    const {data}=await sb.from('absensi').select('*'); DB.absensi=data||[];
  }else{
    const a=DB.absensi.find(x=>x.karyawan_id===ME.id&&String(x.tanggal).slice(0,10)===today());
    if(a) await simpan('absensi',{...a,jam_pulang:jam(),lokasi_pulang:nm('cabang',ME.cabang_id)});
  }
  render(); toast('Absen pulang tercatat');
}
async function ajukanIzin(){
  const alasan=iz_alasan.value.trim();
  if(!alasan) return toast('Isi alasan dulu supaya cepat diproses');
  await simpan('izin',{id:uid(),karyawan_id:ME.id,jenis:iz_jenis.value,tgl_mulai:iz_mulai.value,
    tgl_selesai:iz_selesai.value,alasan,lampiran_url:iz_lampiran.value||null,status:'menunggu'});
  render(); toast('Pengajuan terkirim ke HRD');
}
async function ajukanKasbon(){
  const n=Number(kb_nominal.value); if(!n) return toast('Isi nominal kasbon');
  await simpan('kasbon',{id:uid(),karyawan_id:ME.id,tanggal:today(),nominal:n,
    cicilan:Number(kb_cicilan.value)||0,sisa:n,keperluan:kb_ket.value,status:'menunggu'});
  render(); toast('Pengajuan kasbon terkirim');
}
async function gantiSandi(){
  const a=s_baru.value, b=s_ulang.value;
  if(a.length<6) return toast('Kata sandi minimal 6 karakter');
  if(a!==b) return toast('Kedua kata sandi belum sama');
  if(LIVE){ const {error}=await sb.auth.updateUser({password:a}); if(error) return toast('Gagal: '+error.message); }
  else { AKUN_DEMO[ME.email].pw=a; }
  s_baru.value=''; s_ulang.value=''; toast('Kata sandi diperbarui');
}
setInterval(()=>{const c=document.getElementById('liveClock'); if(c) c.textContent=jam();},1000);
</script>
